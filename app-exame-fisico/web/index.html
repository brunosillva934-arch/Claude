<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src 'self' data: file: blob:">
<meta name="color-scheme" content="light dark">
<title>Exame físico</title>
<style>/*FONTES*/</style>
<style>/*ESTILO*/</style>
</head>
<body>
<div id="erro" hidden></div>
<script>
/* se algo quebrar, o motivo aparece na tela em vez de uma página em branco */
window.addEventListener("error", function (e) {
  var n = document.getElementById("erro");
  if (!n) return;
  n.hidden = false;
  n.textContent = "Algo falhou no app: " + (e.message || "erro desconhecido") + (e.lineno ? " (linha " + e.lineno + ")" : "") + ". O que você já salvou continua no aparelho.";
});
</script>
<div id="app"></div>
<div id="folha"></div>
<div id="aviso" role="status" aria-live="polite"></div>
<input id="seletor" type="file" accept=".json,application/json,text/plain" hidden>
<input id="seletor-foto" type="file" accept="image/*" hidden>
<script>/*DADOS*/</script>
<script>/*APP*/</script>
</body>
</html>
