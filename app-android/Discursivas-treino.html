<style>/* Caderno de treino: papel quente, tinta escura e uma cor por tipo de questão,
   índigo para discursiva e terracota para objetiva, para a lista se reconhecer de longe.
   As caixas de resposta são pautadas, como folha de prova. */
:root{
  --paper:#f5f2ec; --surface:#fffdf9; --surface-2:#f0ebe2; --sunken:#e9e3d8;
  --ink:#1e1c19; --ink-2:#57524a; --ink-3:#857f73;
  --rule:#e4ded3; --rule-strong:#cdc4b5; --linha:#ece6db;
  --disc:#3b54b5; --disc-soft:#e8ecfb; --disc-ink:#2b3f8f;
  --obj:#b5551a; --obj-soft:#fbede2; --obj-ink:#893e0e;
  --ok:#2a774a; --ok-soft:#e2f0e6; --warn:#946511; --warn-soft:#f7edd5; --bad:#ad3a2a; --bad-soft:#f8e5e0;
  --on-tom:#ffffff;
  --sombra:0 1px 2px rgba(46,36,20,.05),0 10px 28px -16px rgba(46,36,20,.22);
  --sombra-alta:0 18px 50px -18px rgba(46,36,20,.45);
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tom:var(--ink); --tom-soft:var(--surface-2); --tom-ink:var(--ink);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#141210; --surface:#1d1b18; --surface-2:#26231f; --sunken:#2d2a25;
  --ink:#f2ede5; --ink-2:#bab2a5; --ink-3:#8d8679;
  --rule:#312d28; --rule-strong:#484139; --linha:#2b2824;
  --disc:#95a8f4; --disc-soft:#20253f; --disc-ink:#bfcaff;
  --obj:#f0a56f; --obj-soft:#392416; --obj-ink:#ffc8a0;
  --ok:#72c995; --ok-soft:#16291d; --warn:#e3b85e; --warn-soft:#2e2512; --bad:#f28f7d; --bad-soft:#341b16;
  --on-tom:#141210;
  --sombra:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.7);
  --sombra-alta:0 18px 50px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
[data-tipo="disc"]{--tom:var(--disc);--tom-soft:var(--disc-soft);--tom-ink:var(--disc-ink)}
[data-tipo="obj"]{--tom:var(--obj);--tom-soft:var(--obj-soft);--tom-ink:var(--obj-ink)}
[data-tipo="mista"]{--tom:var(--ink);--tom-soft:var(--surface-2);--tom-ink:var(--ink)}

html{font-size:16px}
html[data-tam="p"]{font-size:14.5px}
html[data-tam="g"]{font-size:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--body);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-wrap:break-word;overscroll-behavior-y:none;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
textarea,input{font:inherit;color:inherit}
svg{flex:none;display:block}
img{display:block}
.cresce{flex:1 1 0;min-width:0}
:focus-visible{outline:2px solid var(--tom);outline-offset:2px}
::selection{background:var(--tom-soft)}

/* ── barra de cima ──────────────────────────── */
.topo{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  .topo{background:color-mix(in srgb,var(--paper) 84%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px)}
}
.topo-in{max-width:62rem;margin:0 auto;min-height:60px;padding:0 8px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px}
.topo-esq,.topo-dir{display:flex;align-items:center;gap:4px}
.topo-meio{min-width:0;display:flex;align-items:center}
.marca{display:flex;align-items:center;gap:10px;padding-left:6px;font-family:var(--display);font-size:1.3rem;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.marca img{width:32px;height:32px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.marca em{font-style:italic;font-weight:400;color:var(--ink-3)}
.topo-titulo{font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.topo-grade{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:100%;padding:5px 10px;border-radius:12px}
.topo-grade:hover{background:var(--surface-2)}
.topo-grade-q{display:flex;align-items:center;gap:4px;font-weight:600;font-size:.95rem;white-space:nowrap}
.topo-grade-q svg{color:var(--ink-3)}
.topo-grade-l{font-size:.76rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.onde{font-weight:600;font-size:.9rem;color:var(--ink-2);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icone-b{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2);flex:none;transition:background .15s,color .15s}
.icone-b:hover{background:var(--surface-2);color:var(--ink)}
.icone-b:disabled{opacity:.3;pointer-events:none}
.relogio{font-family:var(--mono);font-size:.8rem;color:var(--ink-3);padding:4px 6px;white-space:nowrap}
.trilho{height:3px;background:var(--rule)}
.trilho i{display:block;height:100%;background:var(--tom);border-radius:0 3px 3px 0;transition:width .3s}
.faixa-aviso{margin:0 0 18px;padding:12px 16px;border-radius:14px;background:var(--warn-soft);color:var(--ink);font-size:.9rem;line-height:1.45}
.faixa-aviso b{color:var(--warn)}

.miolo{max-width:44rem;margin:0 auto;padding:24px 16px calc(116px + env(safe-area-inset-bottom,0px))}
.miolo.largo{max-width:62rem;padding-bottom:48px}

/* ── botões e selos ─────────────────────────── */
.botao{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:.94rem;line-height:1.2;text-align:center;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s,filter .15s,transform .06s}
.botao:active{transform:translateY(1px)}
.botao.principal{background:var(--tom);border-color:var(--tom);color:var(--on-tom);box-shadow:0 6px 16px -10px var(--tom)}
.botao.grande{min-height:52px;padding:0 24px;font-size:1rem;border-radius:14px}
.botao.leve{border-color:transparent;background:transparent;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:4px;padding:0 10px}
.botao.perigo{color:var(--bad);border-color:var(--bad)}
.botao.pequeno{min-height:36px;padding:0 12px;font-size:.84rem;border-radius:999px;font-weight:500;color:var(--ink-2);border-color:var(--rule)}
.botao:disabled{opacity:.4;pointer-events:none;box-shadow:none}
.linha-acoes{display:flex;flex-wrap:wrap;gap:8px}
.selo-tipo{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:999px;background:var(--tom-soft);color:var(--tom-ink);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;line-height:1.2}
.selo-tipo i{width:8px;height:8px;border-radius:50%;background:var(--tom);flex:none}
.selo-tipo[data-tipo="mista"] i{background:linear-gradient(90deg,var(--disc) 50%,var(--obj) 50%)}
.selo-tipo small{font-weight:500;letter-spacing:.01em;text-transform:none;opacity:.85;font-size:.76rem}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--rule-strong);font-size:.76rem;color:var(--ink-2);font-weight:500;white-space:nowrap}
.barra{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.barra i{display:block;height:100%}
.barra i.ok{background:var(--tom)}
.barra i.rasc{background:var(--tom);opacity:.28}
[data-tipo="mista"] .barra i.ok{background:linear-gradient(90deg,var(--disc),var(--obj))}
.rot{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 6px}
.rot:first-child{margin-top:0}

/* ── listas (tela inicial) ──────────────────── */
.capa{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;margin:6px 0 24px}
.capa h1{font-size:2.3rem;line-height:1.05}
.capa-sub{color:var(--ink-3);font-size:.9rem;margin-top:8px}
.capa-acoes{display:flex;gap:4px;align-items:center}
.grade-listas{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:720px){.grade-listas{grid-template-columns:1fr 1fr;gap:16px}}
.cartao{position:relative;display:flex;flex-direction:column;gap:10px;width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:18px 18px 16px 24px;box-shadow:var(--sombra);overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.cartao::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tom)}
.cartao[data-tipo="mista"]::before{background:linear-gradient(var(--disc) 50%,var(--obj) 50%)}
.cartao-topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cartao-data{font-size:.78rem;color:var(--ink-3);white-space:nowrap}
.cartao .titulo{font-size:1.42rem;line-height:1.2;margin-top:2px}
.cartao-meta{font-size:.86rem;color:var(--ink-2);margin-top:-4px}
.cartao .barra{margin-top:4px}
.cartao-pe{display:flex;align-items:center;justify-content:space-between;gap:10px}
.estado{font-size:.84rem;color:var(--ink-2)}
.ir{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:.86rem;color:var(--tom-ink);white-space:nowrap}

.boas-vindas{padding:5vh 0 0;display:grid;gap:18px;justify-items:start}
.boas-vindas h1{font-size:2.5rem;line-height:1.06;max-width:34rem}
.sobre{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.apoio{color:var(--ink-2);font-size:1.06rem;max-width:34rem}
.boas-vindas .acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.passos-ajuda{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;counter-reset:p;width:100%}
@media (min-width:720px){.passos-ajuda{grid-template-columns:repeat(3,1fr);gap:14px}}
.passos-ajuda li{counter-increment:p;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px 16px 18px;display:grid;gap:4px;font-size:.9rem;color:var(--ink-2);box-shadow:var(--sombra)}
.passos-ajuda li::before{content:counter(p);font-family:var(--display);font-style:italic;font-weight:600;font-size:1.6rem;color:var(--ink-3);line-height:1;margin-bottom:6px}
.passos-ajuda b{color:var(--ink);font-weight:600;font-size:.98rem}

/* ── uma lista ──────────────────────────────── */
.cabeca{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:24px 20px 20px;box-shadow:var(--sombra);display:grid;gap:14px}
.cabeca::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--tom)}
.cabeca[data-tipo="mista"]::before{background:linear-gradient(90deg,var(--disc) 50%,var(--obj) 50%)}
.cabeca-topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nome-linha{display:flex;align-items:flex-start;gap:4px}
.nome-linha h1{font-size:2rem;line-height:1.1;flex:1;min-width:0}
.nome-linha .icone-b{margin:-4px -8px 0 0}
.cabeca-meta{color:var(--ink-2);font-size:.92rem;margin-top:-8px}
.cabeca-arquivo{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);word-break:break-all;margin-top:-10px}
.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.numero{background:var(--paper);border-radius:14px;padding:10px 12px 11px;display:grid;gap:1px}
.numero b{font-family:var(--display);font-size:1.55rem;font-weight:600;line-height:1.1}
.numero span{font-size:.74rem;color:var(--ink-3)}
.cabeca-acoes{display:grid;gap:10px;margin-top:4px}
@media (min-width:620px){.cabeca-acoes{grid-template-columns:auto minmax(0,1fr);align-items:center}}
.chave{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;border:1px solid var(--rule);border-radius:14px;background:var(--paper);text-align:left}
.chave b{display:block;font-weight:600;font-size:.92rem}
.chave small{display:block;color:var(--ink-3);font-size:.8rem;line-height:1.35}
.interruptor{flex:none;width:44px;height:26px;border-radius:99px;background:var(--rule-strong);position:relative;transition:background .15s}
.interruptor::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
[aria-checked="true"] .interruptor{background:var(--tom)}
[aria-checked="true"] .interruptor::after{transform:translateX(18px)}
.aviso-formato{padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:.88rem}
.secao-cab{display:flex;align-items:baseline;gap:6px 12px;margin:30px 4px 12px;flex-wrap:wrap}
.secao-cab h2{font-size:1.3rem}
.secao-cab span{font-size:.86rem;color:var(--ink-3)}
.lista-q{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--rule);border-radius:20px;overflow:hidden;box-shadow:var(--sombra)}
.lista-q li + li{border-top:1px solid var(--rule)}
.linha-q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:14px 16px;transition:background .12s}
.linha-q .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.86rem;border:1.5px solid var(--rule-strong);color:var(--ink-2)}
.linha-q[data-k="rascunho"] .num{border-color:var(--tom);color:var(--tom-ink);background:var(--tom-soft)}
.linha-q[data-k="entregue"] .num{background:var(--tom);border-color:var(--tom);color:var(--on-tom)}
.linha-q .corpo{display:grid;gap:3px;min-width:0}
.linha-q .t{font-family:var(--display);font-size:1.07rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.linha-q .tr{font-size:.86rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.linha-q .s{font-size:.76rem;color:var(--ink-3)}
.selo{font-size:.76rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;color:var(--ink-3);background:var(--surface-2)}
.selo[data-k="rascunho"]{color:var(--tom-ink);background:var(--tom-soft)}
.selo[data-k="entregue"]{color:var(--ok);background:var(--ok-soft)}
.selo[data-nivel="medio"]{color:var(--warn);background:var(--warn-soft)}
.selo[data-nivel="ruim"]{color:var(--bad);background:var(--bad-soft)}

/* ── questão ────────────────────────────────── */
.q-cab{display:grid;gap:8px;margin-bottom:18px}
.q-selos{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.q-cab h1{font-size:1.55rem;line-height:1.18}
.assunto{font-size:.84rem;color:var(--ink-3);margin-top:-2px}
.enun{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:22px 22px 24px;box-shadow:var(--sombra)}
.prosa{font-family:var(--display);font-size:1.17rem;line-height:1.64;white-space:pre-line}
.prosa + .prosa{margin-top:.85em}
.momento{display:flex;align-items:center;gap:10px;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tom-ink);margin:0 0 10px}
.momento::after{content:"";flex:1;height:1px;background:var(--rule)}
.prosa + .momento{margin-top:24px}
.enun.recolhe{padding:0;overflow:hidden}
.enun-cab{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:0 20px;font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.enun-cab svg{transition:transform .15s;color:var(--ink-3)}
.enun.recolhe[data-aberto="1"] .enun-cab svg{transform:rotate(90deg)}
.enun.recolhe .enun-corpo{display:none;padding:0 22px 24px}
.enun.recolhe[data-aberto="1"] .enun-corpo{display:block}
.enun-dica{text-transform:none;letter-spacing:0;font-weight:400;font-size:.8rem;color:var(--ink-3);text-align:right}
.pergunta{font-family:var(--display);font-size:1.28rem;font-weight:600;line-height:1.4;margin:24px 2px 8px}

.item{margin-top:28px}
.item-cab{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.letra{font-family:var(--display);font-style:italic;font-weight:600;font-size:1.1rem;line-height:1;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--tom-soft);color:var(--tom-ink);flex:none;transition:background .15s,color .15s}
.comando{font-family:var(--display);font-size:1.15rem;line-height:1.5;white-space:pre-line;padding-top:.1rem}
.resposta{--lh:1.85rem;--pt:.95rem;display:block;width:100%;margin-top:12px;min-height:calc(var(--lh) * 6 + var(--pt) * 2);padding:var(--pt) 18px;border:1px solid var(--rule-strong);border-radius:16px;background-color:var(--surface);background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--linha) calc(var(--lh) - 1px));background-size:100% var(--lh);background-position:0 var(--pt);background-attachment:local;font-size:1.04rem;line-height:var(--lh);resize:none;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.resposta:focus{outline:none;border-color:var(--tom);box-shadow:0 0 0 4px var(--tom-soft)}
.resposta::placeholder,.just::placeholder{color:var(--ink-3)}
.conta{font-size:.76rem;color:var(--ink-3);margin-top:6px;text-align:right}
.conta[data-passou="1"]{color:var(--warn);font-weight:600}
.minha{margin-top:6px;padding:14px 16px;border-radius:14px;background:var(--surface-2);white-space:pre-wrap;font-size:1.02rem;line-height:1.6}
.minha.branco{color:var(--ink-3);font-style:italic}
.item.corrigido .item-cab + .rot{margin-top:16px}

/* ── correção ───────────────────────────────── */
.resultado{display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:20px;background:var(--surface-2);margin-bottom:18px}
.resultado[data-nivel="bom"]{background:var(--ok-soft)}
.resultado[data-nivel="medio"]{background:var(--warn-soft)}
.resultado[data-nivel="ruim"]{background:var(--bad-soft)}
.nota-grande{font-family:var(--display);font-weight:600;font-size:3rem;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.nota-grande small{font-size:1.15rem;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-left:2px}
.res-txt{min-width:0}
.res-txt .rot{margin:0 0 4px;color:var(--ink-2)}
.res-txt p{font-size:.9rem;color:var(--ink-2)}
.gab{margin-top:14px;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--ok)}
.gab-max{font-family:var(--display);font-size:1.09rem;line-height:1.6;white-space:pre-line}
.gab-max + .gab-max{margin-top:.7em}
.quesitos-rot{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.quesitos-rot span{text-transform:none;letter-spacing:0;font-weight:400;font-size:.8rem}
.quesito{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.quesito p{font-size:.94rem;line-height:1.45}
@media (max-width:520px){.quesito{grid-template-columns:1fr;gap:8px}.quesito .seg{justify-self:end}}
.exige{display:inline-block;margin-left:6px;font-size:.68rem;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:1px 7px;border-radius:99px;white-space:nowrap;vertical-align:1px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{min-width:44px;height:36px;padding:0 10px;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--ink-2);display:grid;place-items:center;transition:background .12s,color .12s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button[aria-pressed="true"][data-f="0"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-f="0.5"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-f="1"]{background:var(--ok);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"][data-f]{color:#141210}
.seg.larga{display:flex}
.seg.larga button{flex:1 1 0;height:40px;font-weight:500;font-size:.9rem}
.aceito{font-size:.9rem;color:var(--ink-2);padding-top:12px;border-top:1px solid var(--rule)}
.grave{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);font-size:.9rem;line-height:1.45;cursor:pointer}
.grave b{color:var(--bad)}
.grave em{color:var(--ink-2);font-style:normal;font-size:.8rem}
.grave input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--bad)}
.nota-item{margin-top:10px;font-size:.8rem;font-weight:600;color:var(--ink-2);text-align:right}
.rodape{margin-top:30px;display:grid;gap:12px}
.nota-rod{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--rule);font-size:.94rem;line-height:1.55}
.nota-rod .rot{margin-bottom:4px}
.nota-rod p{white-space:pre-line}
.nota-rod.conferir{background:var(--warn-soft);border-color:transparent}
.nota-rod.conferir .rot{color:var(--warn)}
details.nota-rod summary{font-size:.84rem;font-weight:600;color:var(--ink-2);cursor:pointer}
details.nota-rod ul{margin:8px 0 0;padding-left:1.1rem;color:var(--ink-2);font-size:.88rem}
.cru{white-space:pre-wrap;font-family:var(--mono);font-size:.76rem;line-height:1.5;color:var(--ink-2);margin-top:8px}

/* ── objetiva ───────────────────────────────── */
.alt{margin-top:10px;border:1px solid var(--rule);border-radius:18px;background:var(--surface);overflow:hidden;box-shadow:var(--sombra);transition:border-color .15s,box-shadow .15s}
.alt-cab{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;width:100%;padding:15px 16px}
.alt-txt{font-size:1.04rem;line-height:1.5;padding-top:.15rem}
.alt[data-marcada="1"]{border-color:var(--tom);box-shadow:0 0 0 1.5px var(--tom),var(--sombra)}
.alt[data-marcada="1"] .letra{background:var(--tom);color:var(--on-tom)}
.alt[data-fora="1"]{opacity:.5;box-shadow:none}
.alt[data-fora="1"] .alt-txt{text-decoration:line-through;text-decoration-color:var(--bad)}
.just{display:block;width:100%;min-height:2.9rem;margin:0;padding:11px 16px 12px 62px;border:0;border-top:1px dashed var(--rule-strong);border-radius:0;background:transparent;font-size:.94rem;line-height:1.5;resize:none;overflow:hidden;transition:background .15s}
.just:focus{outline:none;background:var(--tom-soft)}
.alt.vista[data-estado="certa"]{border-color:var(--ok);box-shadow:0 0 0 1.5px var(--ok),var(--sombra)}
.alt.vista[data-estado="certa"] .letra{background:var(--ok);color:var(--on-tom)}
.alt.vista[data-estado="errada"]{border-color:var(--bad);box-shadow:0 0 0 1.5px var(--bad),var(--sombra)}
.alt.vista[data-estado="errada"] .letra{background:var(--bad);color:var(--on-tom)}
.alt.vista[data-estado="neutra"] .letra{background:var(--surface-2);color:var(--ink-2)}
.alt-pe{padding:0 16px 16px 62px;display:grid;gap:10px}
.veredicto{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.alt.vista[data-estado="certa"] .veredicto{color:var(--ok)}
.alt.vista[data-estado="errada"] .veredicto{color:var(--bad)}
.por{font-size:.95rem;line-height:1.55;color:var(--ink-2)}
.grave-obj{padding:9px 12px;border-radius:10px;background:var(--bad-soft);font-size:.86rem;color:var(--bad)}
.minha-just{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.92rem;line-height:1.5}
.minha-just .rot{margin:0 0 4px}
.minha-just p{white-space:pre-wrap}
.bateu{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:.82rem;color:var(--ink-2)}
.aviso-tent{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:.92rem;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.aviso-tent button{font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ── barra de baixo ─────────────────────────── */
.base{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--rule)}
.base .botao{flex:1 1 0;min-width:0;min-height:50px;border-radius:14px;font-size:1rem}
.base .icone-b{border:1px solid var(--rule-strong);height:50px;width:50px;border-radius:14px}
@media (min-width:760px){
  .base{left:50%;right:auto;bottom:18px;transform:translateX(-50%);width:min(44rem,calc(100% - 32px));border:1px solid var(--rule);border-radius:22px;box-shadow:var(--sombra-alta);padding:10px}
}
body.teclado .base{position:static;margin:8px 0 0;transform:none;width:auto;border-radius:0;box-shadow:none}
body.teclado .miolo{padding-bottom:20px}

/* ── modo foco ──────────────────────────────── */
body.foco .topo{background:var(--paper);border-bottom-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
body.foco .q-cab{margin-bottom:14px;gap:4px}
body.foco .q-cab h1{font-family:var(--body);font-size:.92rem;font-weight:500;color:var(--ink-3);letter-spacing:0}
body.foco .q-cab .assunto,body.foco .q-selos .chip{display:none}
body.foco .resposta{min-height:calc(var(--lh) * 11 + var(--pt) * 2)}
body.pc.foco .resposta{min-height:calc(var(--lh) * 13 + var(--pt) * 2)}

<script>window.EXEMPLO_TXT="==============================================================================\ninsuficiência cardíaca descompensada · internato\ngerado em 2026-11-12\n==============================================================================\n\n[EXEMPLO QUE ACOMPANHA A PÁGINA — não foi gerado pelos seus parâmetros]\n\nQUESTÃO 1 — INSUFICIÊNCIA CARDÍACA DESCOMPENSADA\ninternato · clínica médica · caso clínico · pronto-socorro · dificuldade 3\n\nHomem de 68 anos chega ao pronto-socorro com dispneia progressiva há cinco\ndias, hoje em repouso, e não consegue dormir deitado. Tem insuficiência\ncardíaca em acompanhamento e usa carvedilol e enalapril; conta que parou o\ncomprimido do \"xixi\" há duas semanas porque incomodava no trabalho.\n\nAo exame: PA 138/84 mmHg, FC 96 bpm, FR 26 irpm, SpO2 88% em ar ambiente,\ntemperatura 36,4 °C. Lúcido. Jugulares distendidas a 45°. Estertores finos nos\ndois terços inferiores de ambos os hemitórax. Bulhas rítmicas, sem sopros.\nFígado a 4 cm do rebordo costal direito, doloroso à compressão. Edema de\nmembros inferiores até os joelhos, com cacifo. Extremidades quentes, tempo de\nreenchimento capilar de 2 segundos.\n\nExames da triagem: creatinina 1,4 mg/dL (1,3 mg/dL há três meses), sódio 136\nmEq/L, potássio 4,2 mEq/L, hemoglobina 13,1 g/dL. Ultrassom de abdome: cisto\nrenal simples de 2 cm à direita, fígado de contornos regulares.\n\na) Classifique o perfil hemodinâmico deste paciente e sustente a classificação\ncom, no mínimo, dois achados do exame e um dado que afaste a alternativa\noposta.\n   (até 10 linhas)\n\nb) Indique duas condutas da primeira hora e justifique cada uma com um dado\ndeste caso. Diga o que fazer com o carvedilol e por quê.\n   (até 10 linhas)\n\nc) Se a pressão arterial fosse 82/54 mmHg, com extremidades frias e\nreenchimento capilar de 4 segundos, o que mudaria na sua classificação e na\nsua conduta? Explique por que a mudança é necessária.\n   (até 10 linhas)\n\n==============================================================================\n\n\nESPELHO DO CORRETOR — não leia antes de responder\n\nESPELHO DA QUESTÃO 1 — insuficiência cardíaca descompensada · 10,0 pontos\nveredito: EXEMPLO\n\nPonte clínica: Classificar o perfil hemodinâmico à beira do leito define se o\npaciente recebe diurético ou inotrópico; errar o perfil é a diferença entre\ndescongestionar e piorar a perfusão.\n\na) interpretação\n   Perfil quente-congesto (B). Há congestão — turgência jugular, estertores,\n   edema e hepatomegalia dolorosa — sem hipoperfusão, já que a PA está\n   preservada, as extremidades estão quentes e o reenchimento capilar é\n   normal.\n   [1,5] Nomeia o perfil congesto sem hipoperfusão\n   [1,5] Sustenta a congestão com ao menos dois achados do caso — exige\n   justificativa com dados do caso\n   [1,0] Afasta hipoperfusão citando PA, extremidades ou reenchimento capilar\n   — exige justificativa com dados do caso\n   Aceito também: Perfil B de Stevenson (se descrever congestão sem\n   hipoperfusão)\n   ERRO GRAVE (erro conceitual): Classificar como frio-congesto e indicar\n   inotrópico -> inotrópico sem indicação, com risco arrítmico e isquêmico\n   [zera o item]\n\nb) conduta\n   Diurético de alça intravenoso, porque a congestão é o mecanismo do sintoma\n   e a via oral tem absorção incerta no congesto; oxigênio suplementar pela\n   SpO2 de 88% com FR de 26; manter o carvedilol, já que não há hipoperfusão\n   nem instabilidade que justifiquem suspender.\n   [1,5] Indica diurético de alça IV e liga a indicação à congestão deste\n   paciente — exige justificativa com dados do caso\n   [1,0] Segunda conduta pertinente justificada por dado do caso (O2 pela SpO2\n   e FR, monitorização, controle de diurese) — exige justificativa com dados\n   do caso\n   [1,0] Decide sobre o betabloqueador e justifica pela perfusão — exige\n   justificativa com dados do caso\n   Aceito também: Reduzir a dose do betabloqueador (se justificar pela piora\n   da congestão e mantiver a droga); Vasodilatador intravenoso (com PA\n   preservada e congestão pulmonar importante)\n   ERRO GRAVE (conduta perigosa): Expansão volêmica em paciente congesto ->\n   piora da congestão pulmonar e insuficiência respiratória [zera o item]\n   ERRO GRAVE (erro conceitual): Suspender o betabloqueador sem instabilidade\n   nem hipoperfusão -> perda do benefício da droga e risco de rebote [zera o\n   item]\n\nc) previsão\n   Passaria a perfil frio-congesto. Com hipoperfusão, o diurético isolado\n   tende a não responder e a piorar a função renal; a prioridade passa a ser\n   restaurar o débito antes de insistir na descongestão, e o betabloqueador é\n   reduzido ou suspenso.\n   [1,0] Reclassifica para frio-congesto\n   [1,0] Explica por que o diurético isolado tende a falhar com baixo débito —\n   exige justificativa com dados do caso\n   [0,5] Muda a conduta do betabloqueador de forma coerente com a hipoperfusão\n   — exige justificativa com dados do caso\n   ERRO GRAVE (conduta perigosa): Manter ou aumentar o betabloqueador na\n   hipoperfusão -> queda adicional do débito cardíaco [zera o item]\n\nContra a resposta decorada: Item b: o decoreba suspende o betabloqueador\n«porque descompensou». Perde o quesito e comete erro grave, porque a decisão\ndepende da perfusão deste paciente.\n\nPara conferência humana: Limiar de SpO2 para indicar oxigênio suplementar na\nIC aguda; Conduta com o betabloqueador na IC aguda sem hipoperfusão\n\nFonte: Diretriz Brasileira de Insuficiência Cardíaca Crônica e Aguda — SBC,\n2018\n\n==============================================================================\n";</script>
<script>/* Leitor dos TXT baixados no gerador "Discursivas de Medicina".
   O gerador grava texto puro em 78 colunas: as provas primeiro, os espelhos no fim.
   Aqui o caminho é o inverso: desfaz a quebra de linha e remonta cada questão.
   Regra da casa: nunca perder texto. O que não for reconhecido aparece cru. */
(function (raiz) {
  "use strict";

  const LARGURA = 78;
  const REGUA = /^={20,}\s*$/;
  const DIVISOR = /^(ESPELHO DO CORRETOR|GABARITO COMENTADO|GABARITO E ESPELHO)\s+[—–-]/;
  const CAB_Q = /^QUEST[ÃA]O\s+(\d+)\s+[—–-]\s*(.*)$/;
  const CAB_E = /^(ESPELHO|GABARITO) DA QUEST[ÃA]O\s+(\d+)\s+[—–-]\s*(.*)$/;
  const ATE = /^\s*\(até\s+(\d+)\s+linhas?\)\s*$/i;
  const MOMENTO = /^\[MOMENTO\s+(\d+)\]\s*$/i;
  const EXEMPLO = /^\[EXEMPLO\b/;
  /* começos de linha que o autor quis numa linha nova, mesmo depois de uma linha cheia */
  const MARCADOR = /^(?:[-•–*]\s+|\d{1,2}[.)]\s+|\([a-z0-9]{1,3}\)\s+|[IVX]{1,4}[.)]\s+)/;
  const ROTULO = /^[A-ZÀ-Ý0-9](?:(?![.!?]\s)[^:]){0,60}:(?:\s|$)/;

  const proxima = l => String.fromCharCode(l.charCodeAt(0) + 1);
  const numero = s => { const n = parseFloat(String(s).replace(/\./g, "").replace(",", ".")); return isNaN(n) ? null : n; };

  /* Desfaz a quebra em 78 colunas. O gerador só quebra quando a próxima palavra não cabe;
     então a quebra é "mole" quando a primeira palavra da linha seguinte não caberia na anterior. */
  function desdobra(linhas) {
    const out = []; let atual = null, anterior = "";
    for (const bruta of linhas) {
      const l = String(bruta).replace(/\s+$/, ""), s = l.trim();
      if (!s) { if (atual !== null) { out.push(atual); atual = null; } if (out.length && out[out.length - 1] !== "") out.push(""); continue; }
      if (atual === null) { atual = s; anterior = l; continue; }
      const primeira = s.split(/\s+/)[0];
      const mole = anterior.length + 1 + primeira.length > LARGURA && !MARCADOR.test(s) && !ROTULO.test(s);
      if (mole) atual += " " + s; else { out.push(atual); atual = s; }
      anterior = l;
    }
    if (atual !== null) out.push(atual);
    while (out.length && out[out.length - 1] === "") out.pop();
    return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  /* blocos separados por linha em branco */
  function grupos(linhas) {
    const out = []; let g = [];
    for (const l of linhas) { if (l.trim()) g.push(l); else if (g.length) { out.push(g); g = []; } }
    if (g.length) out.push(g);
    return out;
  }

  /* "A) ... B) ... C) ..." em sequência; a letra esperada evita confundir continuação com alternativa */
  function lerLetras(linhas, primeira) {
    const out = []; let esperada = primeira, atual = null;
    for (const l of linhas) {
      if (new RegExp("^" + esperada + "\\)\\s+\\S").test(l)) { atual = { l: esperada, linhas: [l] }; out.push(atual); esperada = proxima(esperada); }
      else if (atual) atual.linhas.push(l);
    }
    return out.map(a => ({ l: a.l, txt: desdobra(a.linhas).replace(/^[A-Za-z]\)\s+/, "") }));
  }

  function textoLivre(linhas, q, est) {
    let buf = [];
    const fecha = () => {
      const t = desdobra(buf); buf = [];
      if (!t) return;
      const m = q.momentos.find(x => x.n === est.mom);
      if (m) m.texto += "\n\n" + t; else q.momentos.push({ n: est.mom, texto: t });
    };
    for (const l of linhas) {
      const mm = MOMENTO.exec(l.trim());
      if (mm) { fecha(); est.mom = +mm[1]; continue; }
      buf.push(l);
    }
    fecha();
  }

  function lerQuestao(linhas, ordem) {
    const cab = CAB_Q.exec(linhas[0]) || [];
    const q = { idx: ordem, n: +cab[1] || ordem + 1, tema: (cab[2] || "").trim(), meta: [], dif: "", assunto: "", exemplo: false,
      tipo: "livre", momentos: [], itens: [], comando: "", alternativas: [], gabarito: null, espelho: null };
    let k = 1;
    /* cabeçalho: linha de parâmetros e, às vezes, o assunto da árvore */
    const topo = [];
    while (k < linhas.length && linhas[k].trim()) { topo.push(linhas[k]); k++; }
    if (topo.length && topo[0].indexOf(" · ") >= 0 && topo[0].length <= 160) {
      q.meta = topo[0].split(" · ").map(s => s.trim()).filter(Boolean);
      const ult = q.meta[q.meta.length - 1] || "";
      if (/^(dificuldade\s+\d+|aprendizagem)$/i.test(ult)) q.dif = q.meta.pop();
      const resto = topo.slice(1);
      if (resto.length && /^assunto:/i.test(resto[0])) q.assunto = desdobra(resto).replace(/^assunto:\s*/i, "").replace(/\n/g, " ");
      else if (resto.length) k = 2; /* não era cabeçalho: devolve ao corpo */
    } else k = 1;
    const corpo = linhas.slice(k);
    const est = { mom: 1 };
    const fins = []; corpo.forEach((l, i) => { if (ATE.test(l)) fins.push(i); });

    if (fins.length) {
      q.tipo = "disc";
      let ini = 0, esperada = "a";
      for (const t of fins) {
        let s = -1, qualquer = -1;
        for (let i = ini; i < t; i++) {
          const m = /^([a-z])\)\s+\S/.exec(corpo[i]);
          if (!m || (i > ini && corpo[i - 1].trim())) continue;
          if (m[1] === esperada) s = i;
          qualquer = i;
        }
        if (s < 0) s = qualquer;
        if (s < 0) s = ini;
        textoLivre(corpo.slice(ini, s), q, est);
        let comando = desdobra(corpo.slice(s, t)), letra = esperada;
        const m = /^([a-z])\)\s+/.exec(comando);
        if (m) { comando = comando.slice(m[0].length); letra = m[1]; }
        while (q.itens.some(i => i.l === letra) && letra < "z") letra = proxima(letra); /* as respostas são guardadas pela letra: não pode repetir */
        q.itens.push({ l: letra, momento: est.mom, comando, linhas: +ATE.exec(corpo[t])[1] });
        esperada = proxima(letra); ini = t + 1;
      }
      textoLivre(corpo.slice(ini), q, est);
      return q;
    }

    /* objetiva: as alternativas fecham o bloco */
    let fim = corpo.length; while (fim > 0 && !corpo[fim - 1].trim()) fim--;
    let a0 = -1;
    for (let i = fim - 1; i >= 0; i--) if (/^A\)\s+\S/.test(corpo[i]) && (i === 0 || !corpo[i - 1].trim())) { a0 = i; break; }
    const alts = a0 >= 0 ? lerLetras(corpo.slice(a0, fim), "A") : [];
    if (alts.length >= 2) {
      q.tipo = "obj"; q.alternativas = alts;
      textoLivre(corpo.slice(0, a0), q, est);
      const ult = q.momentos[q.momentos.length - 1];
      if (ult) { const ps = ult.texto.split("\n\n"); q.comando = ps.pop(); ult.texto = ps.join("\n\n"); }
      q.momentos = q.momentos.filter(m => m.texto);
      return q;
    }

    /* nada reconhecido: o texto inteiro, com uma caixa de resposta */
    textoLivre(corpo, q, est);
    q.itens = [{ l: "a", momento: est.mom, comando: "", linhas: 0 }];
    return q;
  }

  const ROTULOS = [["ponte", /^Ponte clínica:\s*/i], ["anti", /^Contra a resposta decorada:\s*/i], ["conferir", /^Para conferência humana:\s*/i], ["fonte", /^Fonte:\s*/i]];

  function lerValidacao(grupo, e) {
    const ents = []; let atual = null;
    for (const l of grupo) {
      if (/^(veredito|motivo|candidatos simulados|notas do revisor[^:]*):/i.test(l) || /^\s+-\s+\[/.test(l)) { atual = [l]; ents.push(atual); }
      else if (atual) atual.push(l); else { atual = [l]; ents.push(atual); }
    }
    for (const en of ents) {
      const t = desdobra(en).replace(/\n/g, " ");
      const v = /^veredito:\s*(.*)$/i.exec(t);
      if (v) e.veredito = v[1].trim(); else if (t) e.validacao.push(t.replace(/^-\s+/, ""));
    }
  }

  function lerItemEspelho(grupo) {
    const m = /^([a-z])\)\s*(.*)$/.exec(grupo[0]);
    const it = { l: m[1], etapa: m[2].trim(), max: "", q: [], alt: "", graves: [], extra: "" };
    let atual = { tipo: "max", linhas: [] }; const ents = [atual];
    for (const l of grupo.slice(1)) {
      const s = l.trim();
      if (/^\[\d+(?:[.,]\d+)?\]\s/.test(s)) ents.push(atual = { tipo: "q", linhas: [l] });
      else if (/^Aceito também:/i.test(s)) ents.push(atual = { tipo: "alt", linhas: [l] });
      else if (/^ERRO GRAVE\b/i.test(s)) ents.push(atual = { tipo: "grave", linhas: [l] });
      else atual.linhas.push(l);
    }
    for (const en of ents) {
      const t = desdobra(en.linhas);
      if (!t) continue;
      if (en.tipo === "max") it.max = t;
      else if (en.tipo === "alt") it.alt = t.replace(/^Aceito também:\s*/i, "").replace(/\n/g, " ");
      else if (en.tipo === "q") {

    const q = qAtual(), r = respDe(E.qi), vazios = q.itens.filter(i => !(r.itens[i.l] || "").trim()).length;
    const vai = () => { r.entregue = Date.now(); carimbo(); gravar(); desenhar(); atualizarNota(); };
    if (vazios) confirmar(vazios === q.itens.length ? "Entregar em branco?" : vazios === 1 ? "Há 1 item em branco" : "Há " + vazios + " itens em branco", "Depois de entregar, o espelho abre e as caixas fecham.", "Entregar assim", vai);
    else vai();
  }
  function reabrir() {
    confirmar("Reabrir esta questão?", "O que você escreveu continua. A correção que você marcou é apagada.", "Reabrir", () => {
      const r = respDe(E.qi); r.entregue = null; r.auto = {}; r.bate = {}; r.tent = []; r.marcada = null; r.fim = false; r.nota = null;
      carimbo(); gravar(); primeiroPasso(); desenhar();
    });
  }

  function telaQuestao() {
    const P = E.arq.pacote, q = qAtual(), r = respDe(E.qi), N = P.questoes.length, foco = !!E.prefs.foco, feito = !!r.entregue;
    const umPorVez = foco && !feito && q.tipo !== "obj" && q.itens.length > 0;
    if (E.passo >= q.itens.length) E.passo = Math.max(0, q.itens.length - 1);
    const f = document.createDocumentFragment();
    const trilho = el("div.trilho", { "aria-hidden": "true" }, el("i", { style: "width:" + ((E.qi + 1) / N * 100) + "%" }));

    /* topo */
    if (foco) {
      const passos = umPorVez && q.itens.length > 1 ? el("div.passos", null, q.itens.map((it, k) => el("button", { type: "button", dataset: { l: it.l, feito: (r.itens[it.l] || "").trim() ? "1" : "0" }, "aria-current": String(k === E.passo), "aria-label": "Item " + it.l, onclick: () => { gravar(); E.passo = k; E.enun = false; desenhar(); } }, it.l))) : null;
      f.appendChild(topo(botaoIcone("fechar", "Sair do modo foco", alternarFoco, { id: "bt-foco" }), el("span.onde", null, "Questão " + (E.qi + 1) + " de " + N), [passos, relogioEl(r)], trilho));
    } else {
      f.appendChild(topo(botaoIcone("voltar", "Voltar à lista", () => ir("arquivo"), { id: "bt-voltar" }),
        el("button.topo-grade", { type: "button", id: "bt-grade", onclick: abrirGrade, title: "Ir para outra questão" },
          el("span.topo-grade-q", null, "Questão " + (E.qi + 1) + " de " + N, ico("baixo", 16)), el("span.topo-grade-l", null, E.arq.ent.titulo)),
        [relogioEl(r), el("button.botao.pequeno.bt-foco", { type: "button", id: "bt-foco", onclick: alternarFoco, title: "Modo foco" }, ico("foco", 17), el("span", null, "Foco")), botaoIcone("ajustes", "Ajustes", abrirAjustes)], trilho));
    }

    /* miolo */
    const m = el("main.miolo.questao");
    junta(m, faixaMemoria());
    m.appendChild(el("div.q-cab", null,
      el("div.q-selos", null, q.tipo === "livre" ? el("span.chip", null, "Texto livre") : seloTipo(tipoQ(q), null, true), q.dif ? el("span.chip", null, maiuscula(q.dif)) : null, q.exemplo ? el("span.chip", null, "Exemplo") : null),
      temaDe(q) !== E.arq.ent.titulo ? el("h1", null, temaDe(q)) : null,
      q.assunto ? el("p.assunto", null, q.assunto) : null));
    if (feito) m.appendChild(blocoResultado(q, r));

    if (q.tipo === "obj") {
      junta(m, blocoEnunciado(q, null, false));
      if (q.comando) m.appendChild(el("p.pergunta", null, q.comando));
      if (!feito && r.tent.length) m.appendChild(el("div.aviso-tent", { id: "aviso-tent" }, el("span", null, "Não é a " + r.tent[r.tent.length - 1] + ". Você tem mais uma tentativa, valendo metade."), el("button", { type: "button", id: "bt-desistir", onclick: desistirObj }, "Ver o gabarito")));
      q.alternativas.forEach(a => m.appendChild(feito ? altCorrigida(q, r, a) : altAberta(r, a)));
    } else if (umPorVez) {
      const it = q.itens[E.passo];
      junta(m, blocoEnunciado(q, it.momento, true));
      m.appendChild(blocoItem(q, r, it));
    } else {
      junta(m, blocoEnunciado(q, null, false));
      q.itens.forEach(it => m.appendChild(feito ? blocoItemCorrigido(q, r, it) : blocoItem(q, r, it)));
    }
    if (feito) m.appendChild(blocoRodape(q));
    f.appendChild(m);

    /* base */
    const base = el("footer.base"), ultima = E.qi >= N - 1;
    const seguir = () => { if (ultima) ir("arquivo"); else irQuestao(E.qi + 1); };
    const dica = PC ? "Ctrl+Enter" : null;
    if (umPorVez) {
      const fim = E.passo >= q.itens.length - 1;
      base.appendChild(botaoIcone("voltar", "Item anterior", () => { gravar(); E.passo--; E.enun = false; desenhar(); }, { id: "bt-ant", disabled: E.passo === 0 }));
      base.appendChild(fim ? el("button.botao.principal", { type: "button", id: "bt-centro", title: dica, onclick: entregar }, "Entregar e ver o espelho")
        : el("button.botao.principal", { type: "button", id: "bt-centro", title: dica, onclick: () => { gravar(); E.passo++; E.enun = false; desenhar(); } }, "Próximo item", ico("avancar", 18)));
    } else if (foco && feito) {
      base.appendChild(el("button.botao", { type: "button", id: "bt-reabrir", onclick: reabrir }, "Reabrir"));
      base.appendChild(el("button.botao.principal", { type: "button", id: "bt-prox", title: dica, onclick: seguir }, ultima ? "Voltar à lista" : "Próxima questão", ultima ? null : ico("avancar", 18)));
    } else {
      if (!foco) base.appendChild(botaoIcone("voltar", "Questão anterior", () => irQuestao(E.qi - 1), { id: "bt-ant", disabled: E.qi === 0 }));
      base.appendChild(feito ? el("button.botao", { type: "button", id: "bt-reabrir", onclick: reabrir }, "Reabrir")
        : q.tipo === "obj" ? el("button.botao.principal", { type: "button", id: "bt-centro", title: dica, disabled: !r.marcada, onclick: confirmarObj }, r.tent.length ? "Confirmar a segunda tentativa" : "Confirmar a resposta")
          : el("button.botao.principal", { type: "button", id: "bt-centro", title: dica, onclick: entregar }, "Entregar e ver o espelho"));
      if (!foco) base.appendChild(botaoIcone("avancar", ultima ? "Voltar à lista" : "Próxima questão", seguir, { id: "bt-prox" }));
    }
    f.appendChild(base);
    if (feito && q.tipo !== "obj") setTimeout(atualizarNota, 0);
    return f;
  }

  /* ── botão voltar do Android ────────────────── */
  window.__voltar = function () {
    if (folhaAberta()) { fecharFolha(); return true; }
    if (E.tela === "questao") { if (E.prefs.foco) alternarFoco(); else ir("arquivo"); return true; }
    if (E.tela === "arquivo") { ir("biblioteca"); return true; }
    return false;
  };
  window.__pausa = gravar;
  window.__tema = aplicarTema;

  /* ── partida ────────────────────────────────── */
  let cheia = window.innerHeight, largura = window.innerWidth;
  window.addEventListener("resize", () => {
    if (window.innerWidth !== largura) { largura = window.innerWidth; cheia = window.innerHeight; }
    cheia = Math.max(cheia, window.innerHeight);
    document.body.classList.toggle("teclado", !PC && window.innerHeight < cheia * 0.75);
    ajustarCaixas();
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) gravar(); });
  /* no navegador, o Esc tira da tela cheia sem chegar à página: sair da tela cheia é sair do foco */
  document.addEventListener("fullscreenchange", () => { if (PC && !document.fullscreenElement && E.tela === "questao" && E.prefs.foco) alternarFoco(); });
  window.addEventListener("pagehide", gravar);
  function lerArquivos(arqs) {
    if (!arqs.length) return;
    Promise.all(arqs.map(a => new Promise(ok => {
      if (a.size > 8 * 1024 * 1024) { ok({ nome: a.name, texto: "" }); return; }
      const fr = new FileReader(); fr.onload = () => ok({ nome: a.name, texto: String(fr.result || "") }); fr.onerror = () => ok({ nome: a.name, texto: "" }); fr.readAsText(a);
    }))).then(importar);
  }
  document.getElementById("seletor").addEventListener("change", ev => { const arqs = [].slice.call(ev.target.files || []); ev.target.value = ""; lerArquivos(arqs); });
  if (!A) {
    const temArquivos = ev => !!ev.dataTransfer && [].indexOf.call(ev.dataTransfer.types || [], "Files") >= 0;
    let arrasto = 0;
    const solta = () => { arrasto = 0; document.body.classList.remove("arrastando"); };
    document.addEventListener("dragenter", ev => { if (!temArquivos(ev)) return; ev.preventDefault(); arrasto++; document.body.classList.add("arrastando"); });
    document.addEventListener("dragover", ev => { if (!temArquivos(ev)) return; ev.preventDefault(); ev.dataTransfer.dropEffect = "copy"; });
    document.addEventListener("dragleave", ev => { if (!temArquivos(ev)) return; arrasto = Math.max(0, arrasto - 1); if (!arrasto) solta(); });
    document.addEventListener("drop", ev => { if (!temArquivos(ev)) return; ev.preventDefault(); solta(); fecharFolha(); lerArquivos([].slice.call(ev.dataTransfer.files || [])); });
  }
  /* teclado físico: Esc volta, Ctrl+Enter faz o botão principal, A a E marcam a alternativa */
  document.addEventListener("keydown", ev => {
    const campo = ev.target && /^(TEXTAREA|INPUT)$/.test(ev.target.tagName);
    if (ev.key === "Escape") {
      if (campo && !folhaAberta()) { ev.target.blur(); return; }
      if (folhaAberta() || E.tela !== "biblioteca") { ev.preventDefault(); window.__voltar(); }
      return;
    }
    if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) {
      const ids = folhaAberta() ? ["bt-sim", "bt-colar", "bt-salvar-nome"] : ["bt-centro", "bt-prox", "bt-continuar"];
      for (const id of ids) { const b = document.getElementById(id); if (b && !b.disabled) { ev.preventDefault(); b.click(); return; } }
      return;
    }
    if (!campo && !folhaAberta() && !ev.ctrlKey && !ev.metaKey && !ev.altKey && E.tela === "questao" && /^[a-e]$/i.test(ev.key)) {
      const b = document.getElementById("alt-" + ev.key.toUpperCase());
      if (b && b.tagName === "BUTTON" && !b.disabled) { ev.preventDefault(); b.click(); }
    }
  });
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", aplicarTema); } catch (e) { /* WebView antigo */ }

  document.body.classList.toggle("pc", PC);
  E.indice = Arm.ler("indice") || [];
  let migrou = false;
  for (const ent of E.indice) {
    if (ent.difs != null && (ent.nomeProprio || !GENERICO.test(ent.titulo || ""))) continue;
    const t = Arm.ler("txt-" + ent.id); if (typeof t !== "string") continue;
    const p = Leitor.lerPacote(t);
    if (ent.difs == null) ent.difs = resumoDifs(p);
    if (!ent.nomeProprio && GENERICO.test(ent.titulo || "")) ent.titulo = nomeAuto(p, ent.nome);
    migrou = true;
  }
  if (migrou) Arm.guardar("indice", E.indice);
  E.prefs = Object.assign({}, PADRAO, Arm.ler("prefs") || {});
  aplicarTema();
  const onde = Arm.ler("onde");
  if (!(onde && onde.id && E.indice.some(x => x.id === onde.id) && abrirArquivo(onde.id, onde.tela === "questao" ? onde.qi : null))) desenhar();
  if (A) window.__chegou();
})();
</script>
