<body>
<div id="erro" hidden></div>
<script>
/* se algo quebrar, o motivo aparece na tela em vez de uma página em branco */
window.addEventListener("error", function (e) {
  var n = document.getElementById("erro");
  if (!n) return;
  n.hidden = false;
  n.textContent = "Algo falhou no app: " + (e.message || "erro desconhecido") + (e.lineno ? " (linha " + e.lineno + ")" : "") + ". Suas respostas salvas continuam no aparelho.";
});
</script>
<div id="app"></div>
<div id="veu-ancora"></div>
