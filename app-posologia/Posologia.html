/* Posologia: papel claro, tinta escura e um verde-petróleo de acento.
   Vermelho só para o que é alerta de verdade (advertência em destaque, dose acima do máximo);
   amarelo só para marcar doses no texto da bula. */
:root{
  --paper:#f4f5f2; --surface:#ffffff; --surface-2:#eef0ec; --sunken:#e6e9e4;
  --ink:#161a19; --ink-2:#4b5452; --ink-3:#737c7a;
  --rule:#e1e5e0; --rule-strong:#c9cfc8;
  --acento:#14635d; --acento-soft:#ddefec; --acento-ink:#0d4844; --on-acento:#ffffff;
  --ok:#2a774a; --ok-soft:#e2f0e6; --warn:#875a0a; --warn-soft:#f8eed6; --bad:#b0342a; --bad-soft:#f9e4e0;
  --dose-bg:#fbefc4; --achado:#ffd04d; --achado-atual:#ff9d2e;
  --sombra:0 1px 2px rgba(20,30,28,.05),0 8px 24px -14px rgba(20,30,28,.22);
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --alto-topo:56px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0f1312; --surface:#171c1b; --surface-2:#1f2524; --sunken:#262d2b;
  --ink:#e9eeec; --ink-2:#b0bab7; --ink-3:#8b9794;
  --rule:#29302e; --rule-strong:#3c4542;
  --acento:#62c4b8; --acento-soft:#15302d; --acento-ink:#9fe0d6; --on-acento:#0f1312;
  --ok:#72c995; --ok-soft:#16291d; --warn:#e3b85e; --warn-soft:#2e2512; --bad:#f28f7d; --bad-soft:#371a15;
  --dose-bg:#3a3114; --achado:#8a6a00; --achado-atual:#b5560f;
  --sombra:0 1px 2px rgba(0,0,0,.35),0 8px 24px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}

html{font-size:16px}
html[data-tam="p"]{font-size:14.5px}
html[data-tam="g"]{font-size:18.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--body);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.012em;margin:0;text-wrap:balance}
p{margin:0}
button,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
::selection{background:var(--acento-soft)}
.ic{flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cresce{flex:1 1 0;min-width:0}
.mono{font-family:var(--mono);font-size:.84em;word-break:break-all}
.fora-da-tela{position:fixed;left:-9999px;top:0}

/* ── barra de cima e abas ───────────────────── */
.topo{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.topo-in{max-width:52rem;margin:0 auto;height:var(--alto-topo);padding:0 8px 0 12px;display:flex;align-items:center;gap:6px}
.marca{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-size:1.28rem;font-weight:600;white-space:nowrap;min-width:0}
.marca em{font-style:italic;font-weight:400;font-size:.95rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.marca-sinal{align-self:center;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--acento);color:var(--on-acento);font:italic 600 .95rem/1 var(--display);letter-spacing:-.02em}
.topo-titulo{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.marca{flex:1}
.icone-b{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2);flex:none}
.icone-b:hover{background:var(--surface-2);color:var(--ink)}
.icone-b.pequeno{width:36px;height:36px;border-radius:10px}

.abas{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--rule);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.aba{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 5px;border-radius:12px;color:var(--ink-3);font-size:.74rem;font-weight:500}
.aba.ativa{color:var(--acento-ink)}
.aba.ativa .ic{color:var(--acento)}
.aba.ativa span{font-weight:600}
@media (min-width:760px){
  .abas{position:static;background:none;border:0;padding:0;gap:2px;flex:none}
  .aba{flex-direction:row;gap:7px;padding:9px 12px;font-size:.9rem;max-width:none}
  .aba:hover{background:var(--surface-2);color:var(--ink)}
  .aba.ativa{background:var(--acento-soft)}
}

/* ── página ─────────────────────────────────── */
.pagina{max-width:52rem;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
@media (min-width:760px){.pagina{padding:28px 24px 64px;gap:18px}}
.titulo-pag{font-size:1.7rem}
.titulo-sec{font-size:1.3rem;margin-top:2px}
.sub{color:var(--ink-2);font-size:.95rem}
.abertura{display:flex;flex-direction:column;gap:12px;padding:6px 0 4px}
.abertura h1{font-size:1.85rem;line-height:1.15}
@media (min-width:760px){.abertura h1{font-size:2.3rem}}

.cartao{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sombra)}
.cartao h2{font-size:1.2rem}
.cartao h3{font-size:1.02rem;margin-top:4px}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* busca */
.busca{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--rule-strong);border-radius:14px;padding:5px 5px 5px 12px;box-shadow:var(--sombra)}
.busca:focus-within{border-color:var(--acento)}
.busca .ic{color:var(--ink-3)}
.busca-campo{flex:1;min-width:0;border:0;background:none;outline:none;font-size:1.05rem;padding:9px 0}
.busca-campo::-webkit-search-cancel-button{-webkit-appearance:none}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-size:.88rem;color:var(--ink-2)}
.ficha:hover{border-color:var(--rule-strong);color:var(--ink)}

/* botões */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 15px;border-radius:12px;font-weight:600;font-size:.93rem;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.bt-pri{background:var(--acento);color:var(--on-acento)}
.bt-pri:hover{filter:brightness(1.07)}
.bt-sec{background:var(--surface);border:1px solid var(--rule-strong);color:var(--ink)}
.bt-sec:hover{background:var(--surface-2)}
.bt-ter{color:var(--acento-ink);padding:0 10px}
.bt-ter:hover{background:var(--acento-soft)}
.bt-marcado{background:var(--acento-soft);border-color:transparent;color:var(--acento-ink)}
.bt-marcado .ic{fill:currentColor}
.bt:disabled{opacity:.55;pointer-events:none}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.acoes.centro{justify-content:center}

/* listas */
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{width:100%;display:flex;align-items:center;gap:10px;padding:13px 12px 13px 15px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;text-align:left}
.item:hover{border-color:var(--rule-strong)}
.item>.ic{color:var(--ink-3)}
.cartao .item{box-shadow:none;background:var(--surface-2);border-color:transparent}
.item-t{font-weight:600;font-size:1.02rem;display:flex;align-items:center;gap:6px}
.item-d{color:var(--ink-2);font-size:.88rem;margin-top:2px}
.item-f{color:var(--ink-3);font-size:.84rem;margin-top:5px;line-height:1.45}
.item-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:5px;font-size:.8rem;color:var(--ink-3)}
.item-aviso{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:.84rem;color:var(--warn)}
.salva-ic .ic{fill:var(--acento);stroke:var(--acento)}
.selo{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:.76rem;letter-spacing:.01em}
.selo-nda,.selo-bla{background:var(--acento-soft);color:var(--acento-ink)}
.selo-alerta{background:var(--bad-soft);color:var(--bad)}
.selo-atencao{background:var(--warn-soft);color:var(--warn)}
.rotulo-lista{font:600 .78rem/1 var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:6px 2px -4px}
.salva-li{display:flex;align-items:center;gap:6px}
.salva-li .item{flex:1;min-width:0}
.remover{color:var(--ink-3)}
.remover.confirmar{width:auto;padding:0 10px;background:var(--bad-soft);color:var(--bad)}
.confirmar-t{font-weight:600;font-size:.85rem}
.vazio{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--ink-3);padding:40px 16px}

/* trilha da busca */
.trilha{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:.88rem;color:var(--ink-3)}
.trilha li{display:flex;align-items:center;gap:4px;min-width:0}
.trilha-sep{color:var(--ink-3)}
.trilha-b{color:var(--acento-ink);font-weight:500;padding:3px 6px;border-radius:7px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-strong)}
.trilha-b:hover{background:var(--acento-soft)}
.trilha-t{padding:3px 6px;color:var(--ink-2);font-weight:500}

/* notas, carga, erros */
.nota{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:.9rem}
.nota>.ic{margin-top:2px;color:var(--ink-3)}
.nota-alerta{background:var(--warn-soft);color:var(--ink)}
.nota-alerta>.ic{color:var(--warn)}
.nota-ok{background:var(--ok-soft);color:var(--ink)}
.nota-ok>.ic{color:var(--ok)}
.nota .acoes{margin-top:8px}
.carga{display:flex;align-items:center;gap:12px;padding:18px 4px;color:var(--ink-2)}
.giro{flex:none;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--rule-strong);border-top-color:var(--acento);animation:gira .8s linear infinite;margin-top:1px}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation-duration:2.4s}}
.erro-c{border-color:var(--bad-soft)}
.linha-ic{display:flex;gap:10px;align-items:flex-start}
.linha-ic .ic{color:var(--bad);margin-top:2px}
.def{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.92rem}
.def dt{font-weight:600}
.def dd{margin:0;color:var(--ink-2)}

/* ── bula ───────────────────────────────────── */
.cabeca-bula{display:flex;flex-direction:column;gap:10px}
.cabeca-bula h1{font-size:1.85rem;line-height:1.15}
.generico{color:var(--ink-2);font-size:1rem;margin-top:-4px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:2px 0 0;font-size:.88rem}
.meta dt{color:var(--ink-3)}
.meta dd{margin:0}
.meta-l{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ok)}
.procura{position:sticky;top:calc(var(--alto-topo) + env(safe-area-inset-top));z-index:20;display:flex;align-items:center;gap:6px;margin:0 -16px;padding:8px 8px 8px 16px;background:var(--paper);border-bottom:1px solid var(--rule)}
@media (min-width:760px){.procura{margin:0;border:1px solid var(--rule);border-radius:14px;background:var(--surface)}}
.procura>.ic{color:var(--ink-3)}
.procura-campo{flex:1;min-width:0;border:0;background:none;outline:none;padding:8px 0;font-size:.98rem}
.achados{font-size:.8rem;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}

#secoes{display:flex;flex-direction:column;gap:8px}
.secao{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.secao summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.secao summary::-webkit-details-marker{display:none}
.secao summary>.ic{color:var(--ink-3);transition:transform .15s}
.secao[open] summary>.ic{transform:rotate(180deg)}
.secao[open] summary{border-bottom:1px solid var(--rule)}
.secao-t{display:block;font-weight:600;font-size:1rem}
.secao-o{display:block;font-size:.76rem;color:var(--ink-3);margin-top:1px}
.secao-alerta{border:2px solid var(--bad)}
.secao-alerta summary{background:var(--bad-soft)}
.secao-alerta .secao-t{color:var(--bad)}
.contagem{background:var(--achado);color:var(--ink);font-weight:600;font-size:.78rem;padding:1px 8px;border-radius:999px}
.secao-corpo{padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;font-size:.98rem;line-height:1.62}
.secao-corpo p{max-width:72ch}
.subsecao{padding-top:10px;border-top:1px dashed var(--rule-strong)}
.dose{background:var(--dose-bg);border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;font-weight:500}
mark.achado{background:var(--achado);color:var(--ink);border-radius:3px;padding:0 1px}
mark.achado.atual{background:var(--achado-atual);outline:2px solid var(--achado-atual)}
.tabela{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.tabela table{border-collapse:collapse;min-width:100%;font-size:.84rem;line-height:1.45}
.tabela td,.tabela th{border:1px solid var(--rule-strong);padding:6px 8px;vertical-align:top;text-align:left}
.tabela caption{caption-side:top;text-align:left;padding:8px;font-weight:600}
.tabela p{margin:0}
.rodape-bula{display:flex;flex-direction:column;gap:8px;font-size:.84rem;color:var(--ink-3);padding:4px 2px}
.consulta .secao-corpo{max-height:22rem;overflow-y:auto}

/* ── calculadora ────────────────────────────── */
.segmento{display:flex;background:var(--sunken);border-radius:12px;padding:3px;gap:3px}
.segmento button{flex:1;padding:9px 8px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--ink-2);text-align:center}
.segmento button.ativo{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.form{display:flex;flex-direction:column;gap:14px}
.form-t{font:600 .78rem/1 var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-top:6px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo label,.campo-r{font-weight:600;font-size:.9rem}
.campo-l{display:flex;align-items:stretch;gap:6px;min-width:0}
.num,.texto{min-width:0;width:100%;border:1.5px solid var(--rule-strong);background:var(--surface);border-radius:11px;padding:10px 12px;font-size:1.1rem;font-variant-numeric:tabular-nums}
.num{flex:1 1 7rem;max-width:12rem}
.texto{font-size:1rem}
.num:focus,.texto:focus{outline:none;border-color:var(--acento)}
.num[aria-invalid="true"]{border-color:var(--bad)}
.suf{display:flex;align-items:center;color:var(--ink-2);font-size:.95rem;white-space:nowrap}
.suf-grupo{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sel{border:1.5px solid var(--rule-strong);background:var(--surface);border-radius:11px;padding:9px 8px;font-size:.95rem;min-height:44px}
.dica{font-size:.82rem;color:var(--ink-3)}
.campo-erro{font-size:.84rem;color:var(--bad);font-weight:500}
.campo-erro:empty{display:none}

.resultado{background:var(--surface);border:1.5px solid var(--acento);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.resultado:has(.resultado-vazio){border-style:dashed;border-color:var(--rule-strong)}
.resultado-vazio{color:var(--ink-3);font-size:.95rem}
.grandes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.grande{display:flex;flex-direction:column;gap:2px}
.grande-r{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.grande-v{font:600 1.65rem/1.15 var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.grande-s{font-size:.86rem;color:var(--ink-2)}
.grande.passou .grande-v,.grande.passou .grande-s{color:var(--bad)}
.limitada{padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.limitada-v{font-weight:600;font-size:1.08rem;margin-top:3px}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;font-size:.93rem}
.alerta .ic{margin-top:2px}
.alerta-grave{background:var(--bad-soft);color:var(--ink);border:1.5px solid var(--bad)}
.alerta-grave .ic{color:var(--bad)}
.alerta-atencao{background:var(--warn-soft);color:var(--ink)}
.alerta-atencao .ic{color:var(--warn)}
.passos{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:.86rem;color:var(--ink-2)}

/* ── sobre ──────────────────────────────────── */
.texto-longo .cartao p{color:var(--ink-2);font-size:.95rem}
.rotulo-c{font-weight:600;font-size:.88rem;color:var(--ink)!important}
.marcadores{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:7px;color:var(--ink-2);font-size:.95rem}
.versao{text-align:center;color:var(--ink-3);font-size:.82rem}

/* ── aviso flutuante e erro ─────────────────── */
#aviso{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:50;max-width:min(92vw,30rem);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:.9rem;box-shadow:var(--sombra);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#aviso.visivel{opacity:1;transform:translate(-50%,0)}
@media (min-width:760px){#aviso{bottom:24px}}
#erro{position:sticky;top:0;z-index:60;background:var(--bad);color:#fff;padding:10px 14px;font-size:.9rem}

/* ── busca com doença ───────────────────────── */
.busca-dupla{display:grid;grid-template-columns:1fr;gap:8px}
.busca-dupla .busca{padding:5px 12px}
.busca-dupla .bt{min-height:48px}
@media (min-width:760px){.busca-dupla{grid-template-columns:1.1fr 1fr auto}}

/* ── dose para a doença ─────────────────────── */
.dose-card{border:1.5px solid var(--acento)}
.dose-card .busca{box-shadow:none}
.ficha-ativa{background:var(--acento);border-color:var(--acento);color:var(--on-acento)}
.ficha-ativa:hover{color:var(--on-acento)}
.ficha-sit{border-style:dashed}
#dose-res{display:flex;flex-direction:column;gap:10px}
.procurado{font-size:.84rem;color:var(--ink-3)}
.indicacao{padding:10px 12px;border-radius:12px;background:var(--ok-soft);display:flex;flex-direction:column;gap:6px}
.trechos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.trecho{padding:11px 13px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:7px}
.trecho .item-m{margin-top:0}
.trecho-sit{background:var(--warn-soft)}
.trecho-t{font-size:.96rem;line-height:1.6}
.trecho-sub{font-size:.84rem;font-weight:600;color:var(--ink-2)}
.linha-tab{display:grid;grid-template-columns:minmax(0,38%) 1fr;gap:5px 12px;margin:0;font-size:.93rem;line-height:1.5}
.linha-tab dt{color:var(--ink-3);font-size:.8rem;padding-top:2px}
.linha-tab dd{margin:0}
@media (max-width:420px){.linha-tab{grid-template-columns:1fr}.linha-tab dt{padding-top:6px}}

/* ── conferência da prescrição ──────────────── */
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;min-height:36px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--acento)}
.conf-res{display:flex;flex-direction:column;gap:10px;margin-top:4px;padding-top:14px;border-top:1px solid var(--rule)}
.presc-linha{font-size:.95rem}
.alerta-ok{background:var(--ok-soft);color:var(--ink);border:1.5px solid var(--ok)}
.alerta-ok .ic{color:var(--ok)}
.conf-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.conf-item{padding:10px 12px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--rule-strong)}
.conf-ok{border-left-color:var(--ok)}
.conf-atencao{border-left-color:var(--warn)}
.conf-grave{border-left-color:var(--bad);background:var(--bad-soft)}
.conf-estado{font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.conf-ok .conf-estado{color:var(--ok)}
.conf-atencao .conf-estado{color:var(--warn)}
.conf-grave .conf-estado{color:var(--bad)}
.conf-valor{font-size:.95rem}
.conf-lido{font-size:.85rem;color:var(--ink-2)}
.conf-ctx{font-size:.8rem;color:var(--ink-3)}
.conf-resto summary{cursor:pointer;font-size:.88rem;color:var(--acento-ink);font-weight:500;padding:4px 0}
.conf-resto[open] summary{margin-bottom:8px}
.campo>.sel{width:100%}
</style>

<div id="erro" hidden></div>
<script>/* se algo quebrar, o motivo aparece na tela em vez de uma página em branco */
window.addEventListener("error", function (e) {
  var n = document.getElementById("erro");
  if (!n) return;
  n.hidden = false;
  n.textContent = "Algo falhou no app: " + (e.message || "erro desconhecido") + (e.lineno ? " (linha " + e.lineno + ")" : "") + ". As bulas salvas continuam no aparelho.";
});
</script>
<div id="app"></div>
<div id="aviso" role="status" aria-live="polite"></div>
<script>/* Calculadora de dose: só aritmética, com as unidades à vista em cada passo.
   Nenhuma dose vem embutida aqui. Todo número é digitado por quem prescreve, conferido
   na bula; o app multiplica, divide, converte unidade de massa e avisa quando algo não fecha.
   Funciona no navegador (window.Calculo) e no Node (require), para os testes. */
(function (raiz) {
  "use strict";

  /* massa em mcg; as outras unidades só se comparam com elas mesmas */
  var MASSA = { g: 1e6, mg: 1e3, mcg: 1 };
  var OUTRAS = { UI: 1, mEq: 1, mmol: 1 };
  var FINO = " "; // espaço fino inquebrável, separador de milhar sem ambiguidade

  function dimensao(u) {
    if (MASSA[u]) return "massa";
    if (OUTRAS[u]) return u;
    return null;
  }

  /** Converte entre unidades da mesma dimensão; null quando não há conversão possível. */
  function converter(valor, de, para) {
    if (de === para) return valor;
    if (MASSA[de] && MASSA[para]) return (valor * MASSA[de]) / MASSA[para];
    return null;
  }

  /**
   * Lê um número digitado. Vírgula ou ponto como decimal; nada de separador de milhar,
   * porque "1.000" e "2,500" são justamente os números que viram erro de dez ou mil vezes.
   * Devolve {vazio:true}, {erro:"..."} ou {valor:n}.
   */
  function lerNumero(texto, opcoes) {
    opcoes = opcoes || {};
    var t = String(texto == null ? "" : texto).replace(/\s+/g, "");
    if (!t) return { vazio: true };
    if (/^[1-9]\d{0,2}[.,]\d{3}$/.test(t)) {
      var sep = t.indexOf(".") >= 0 ? "." : ",";
      var antes = t.split(sep)[0];
      var depois = t.split(sep)[1];
      return {
        erro:
          "“" + t + "” é ambíguo: pode ser " + antes + depois + " ou " + antes + "," + depois.replace(/0+$/, "").replace(/^$/, "0") +
          ". Escreva sem separador de milhar (" + antes + depois + ") ou com outra quantidade de casas decimais."
      };
    }
    if (!/^(\d+([.,]\d+)?|[.,]\d+)$/.test(t)) return { erro: "Número inválido. Use só algarismos e uma vírgula decimal." };
    var n = parseFloat(t.replace(",", "."));
    if (!isFinite(n)) return { erro: "Número inválido." };
    if (opcoes.inteiro && n !== Math.floor(n)) return { erro: "Use um número inteiro." };
    if (!(n > 0)) return { erro: "Precisa ser maior que zero." };
    if (opcoes.max != null && n > opcoes.max) return { erro: "No máximo " + opcoes.max + "." };
    return { valor: n };
  }

  function agrupar(inteiro) {
    if (inteiro.length < 5) return inteiro; // 1200 fica 1200; 12 000 ganha o espaço fino
    return inteiro.replace(/\B(?=(\d{3})+(?!\d))/g, FINO);
  }

  /**
   * Formata para leitura em pt-BR: vírgula decimal, zero sempre à esquerda, nenhum zero
   * sobrando à direita (5 mg, nunca 5,0 mg). Casas conforme o tamanho do número:
   * 1 casa a partir de 100, 2 casas de 1 a 100, 3 algarismos significativos abaixo de 1.
   * Devolve {texto, aproximado}: aproximado diz se houve arredondamento para exibir.
   */
  function formatar(n) {
    if (n == null || !isFinite(n)) return { texto: "—", aproximado: false };
    var a = Math.abs(n);
    var s;
    if (a === 0) s = "0";
    else if (a >= 100) s = n.toFixed(1);
    else if (a >= 1) s = n.toFixed(2);
    else if (a >= 1e-6) s = n.toPrecision(3);
    else s = n.toFixed(12);
    if (s.indexOf("e") >= 0) s = n.toFixed(12);
    if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
    var exibido = parseFloat(s);
    var aproximado = Math.abs(exibido - n) > 1e-9 * Math.max(1, a);
    var partes = s.replace("-", "").split(".");
    var texto = (n < 0 ? "−" : "") + agrupar(partes[0]) + (partes[1] ? "," + partes[1] : "");
    return { texto: texto, aproximado: aproximado };
  }

  /** "≈ 0,333" quando arredondou, "0,5" quando é exato. */
  function num(n) {
    var f = formatar(n);
    return (f.aproximado ? "≈ " : "") + f.texto;
  }

  function com(n, unidade) {
    return num(n) + " " + unidade;
  }

  /* ── checagens comuns ───────────────────────────────────────────── */

  function checarPeso(peso, alertas) {
    if (peso == null) return;

    { campo: "stop_use", titulo: "Pare de usar se", original: "Stop use" },

    { campo: "indications_and_usage", titulo: "Indicações", original: "Indications and usage" },
    { campo: "purpose", titulo: "Finalidade", original: "Purpose" },
    { campo: "adverse_reactions", titulo: "Reações adversas", original: "Adverse reactions" },
    { campo: "recent_major_changes", titulo: "Mudanças recentes na bula", original: "Recent major changes" },

    { campo: "pharmacokinetics", titulo: "Farmacocinética", original: "Pharmacokinetics", dentroDe: "clinical_pharmacology" },

  var CAMPOS_OPENFDA = ["brand_name", "generic_name", "manufacturer_name", "route", "application_number", "product_type", "substance_name", "rxcui", "is_original_packager"];

  /* ── utilidades de texto ────────────────────────────────────────── */

  function semAcento(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function chaveNome(s) {
    return semAcento(s).toLowerCase().replace(/[^a-z0-9+/ ]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function juntar(v) {
    if (v == null) return "";
    if (Array.isArray(v)) return v.join("\n\n");
    return String(v);
  }

  /** Data da bula (AAAAMMDD) em DD/MM/AAAA. */
  function data(aaaammdd) {
    var s = String(aaaammdd || "");
    if (!/^\d{8}$/.test(s)) return s || "data não informada";
    return s.slice(6, 8) + "/" + s.slice(4, 6) + "/" + s.slice(0, 4);
  }

  /** Tipo de registro na FDA, a partir do número da aplicação. */
  function registro(numero) {
    var n = String(numero || "").toUpperCase();
    if (/^NDA/.test(n)) return { sigla: "NDA", texto: "Marca ou referência", ordem: 0 };
    if (/^BLA/.test(n)) return { sigla: "BLA", texto: "Biológico", ordem: 0 };
    if (/^ANDA/.test(n)) return { sigla: "ANDA", texto: "Genérico", ordem: 1 };
    if (/^(PART|M\d)/.test(n)) return { sigla: "OTC", texto: "Venda livre (monografia)", ordem: 2 };
    return { sigla: n.replace(/\d+$/, "") || "?", texto: "Outro registro", ordem: 3 };
  }

  /**
   * Quebra o texto corrido da bula em parágrafos, sem mudar nenhum caractere:
   * antes de cada número de subseção da própria seção ("2.1 Recommended…", "2.3 Renal…")
   * e antes de cada marcador "•".
   */
  function paragrafos(texto) {
    var t = String(texto || "");
    var cortes = [];
    var m = /^\s*(\d{1,2})\s+[A-Z]/.exec(t);
    if (m) {
      var re = new RegExp("\\s(?=" + m[1] + "\\.\\d{1,2}(?:\\.\\d{1,2})?\\s+[A-Z])", "g");
      var x;
      while ((x = re.exec(t))) cortes.push(x.index);
    }
    var rb = /\s(?=•\s)/g;
    var y;
    while ((y = rb.exec(t))) cortes.push(y.index);
    cortes.sort(function (a, b) { return a - b; });
    var partes = [];
    var ini = 0;
    cortes.forEach(function (c) {
      if (c <= ini) return;
      partes.push(t.slice(ini, c).trim());
      ini = c;
    });
    partes.push(t.slice(ini).trim());
    return partes.filter(function (p) { return p.length > 0; });
  }

  /* doses e frequências, só para destacar na leitura */
  var RE_DOSE = new RegExp(
    [
      "\\b\\d+(?:[.,]\\d+)?(?:\\s?(?:to|-|–|or)\\s?\\d+(?:[.,]\\d+)?)?\\s?" +
        "(?:million units|units?|mg|mcg|µg|μg|g|mL|L|IU|mEq|mmol)" +
        "(?:\\s?\\/\\s?(?:kg|m2|m²|day|dose|d|h|hr|hour|min|minute|mL|L|kg\\/day|kg\\/dose|kg\\/h|kg\\/min))*(?![A-Za-z])",
      "\\bevery\\s\\d+(?:\\s?(?:to|-|–)\\s?\\d+)?\\s(?:hours?|days?|weeks?)\\b",
      "\\b(?:once|twice|three times|four times)\\s(?:a\\s|per\\s)?(?:day|daily|week|weekly)\\b",
      "\\b(?:once|twice)\\s(?:daily|weekly)\\b"
    ].join("|"),
    "g"
  );

  function escaparRegex(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  /**
   * Divide um texto em trechos para pintar: {t, achado} para o que bate com a busca
   * e {t, dose} para doses e frequências. Concatenar os trechos devolve o texto exato.
   */
  function trechos(texto, consulta) {
    var t = String(texto || "");
    var saida = [];
    var q = String(consulta || "").trim();
    var pedacos = [];
    if (q.length >= 2) {
      var rq = new RegExp(escaparRegex(q), "gi");
      var ini = 0;
      var m;
      while ((m = rq.exec(t))) {
        if (m.index > ini) pedacos.push({ t: t.slice(ini, m.index) });
        pedacos.push({ t: m[0], achado: true });
        ini = m.index + m[0].length;
        if (m[0].length === 0) rq.lastIndex++;
      }
      if (ini < t.length) pedacos.push({ t: t.slice(ini) });
    } else {
      pedacos.push({ t: t });
    }
    pedacos.forEach(function (p) {
      if (p.achado) {
        saida.push(p);
        return;
      }
      var rd = new RegExp(RE_DOSE.source, "g");
      var i = 0;
      var d;
      while ((d = rd.exec(p.t))) {
        if (d.index > i) saida.push({ t: p.t.slice(i, d.index) });
        saida.push({ t: d[0], dose: true });
        i = d.index + d[0].length;
        if (d[0].length === 0) rd.lastIndex++;
      }
      if (i < p.t.length) saida.push({ t: p.t.slice(i) });
    });
    return saida.filter(function (s) { return s.t.length > 0; });
  }

  /* ── tabelas: HTML de fora reconstruído só com elementos seguros ── */

  var PERMITIDAS = {
    TABLE: "table", CAPTION: "caption", THEAD: "thead", TBODY: "tbody", TFOOT: "tfoot",
    TR: "tr", TD: "td", TH: "th", SUP: "sup", SUB: "sub", BR: "br",
    P: "p", PARAGRAPH: "p", UL: "ul", OL: "ol", LI: "li", LIST: "ul", ITEM: "li"
  };
  var DESCARTAR = /^(SCRIPT|STYLE|NOSCRIPT|TEMPLATE|IFRAME|FRAME|FRAMESET|OBJECT|EMBED|APPLET|SVG|MATH|IMG|PICTURE|SOURCE|VIDEO|AUDIO|TRACK|CANVAS|LINK|META|BASE|TITLE|HEAD|FORM|INPUT|BUTTON|TEXTAREA|SELECT|OPTION|COL|COLGROUP|RENDERMULTIMEDIA)$/;

  function copiarSeguro(origem, destino, doc) {
    var filhos = origem.childNodes;
    for (var i = 0; i < filhos.length; i++) {
      var f = filhos[i];
      if (f.nodeType === 3) {
        destino.appendChild(doc.createTextNode(f.nodeValue));
        continue;
      }
      if (f.nodeType !== 1) continue;
      var tag = String(f.tagName || "").toUpperCase();
      if (DESCARTAR.test(tag)) continue;
      var novo = null;
      if (PERMITIDAS[tag]) {
        novo = doc.createElement(PERMITIDAS[tag]);
        if (tag === "TD" || tag === "TH") {
          ["colspan", "rowspan"].forEach(function (a) {
            var v = f.getAttribute(a);
            if (v && /^\d{1,2}$/.test(v) && +v >= 1 && +v <= 50) novo.setAttribute(a, v);
          });
        }
      } else {
        var estilo = String(f.getAttribute("stylecode") || f.getAttribute("styleCode") || "").toLowerCase();
        if (/bold/.test(estilo)) novo = doc.createElement("strong");
        else if (/italic/.test(estilo)) novo = doc.createElement("em");
      }
      if (novo) {
        copiarSeguro(f, novo, doc);
        destino.appendChild(novo);
      } else {
        copiarSeguro(f, destino, doc); // elemento desconhecido: fica só o conteúdo
      }
    }
  }

  /** Recebe o HTML de uma tabela da bula e devolve um fragmento só com elementos permitidos. */
  function tabelaSegura(html, doc) {
    doc = doc || document;
    var lido = new DOMParser().parseFromString(String(html || ""), "text/html");
    var frag = doc.createDocumentFragment();
    if (lido && lido.body) copiarSeguro(lido.body, frag, doc);
    return frag;
  }

  /* ── rede ───────────────────────────────────────────────────────── */

  function ErroFonte(tipo, mensagem) {
    this.tipo = tipo;
    this.message = mensagem;
  }
  ErroFonte.prototype = Object.create(Error.prototype);

  var memoria = {};

  /** GET em JSON, só para os dois servidores oficiais, sem cookies nem referência de origem. */
  function obter(url) {
    if (url.indexOf(RXNAV) !== 0 && url.indexOf(FDA) !== 0) {
      return Promise.reject(new ErroFonte("bloqueado", "Endereço fora das fontes oficiais: bloqueado."));
    }
    if (memoria[url]) return memoria[url];
    var p = new Promise(function (ok, falha) {
      var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var acabou = false;
      var relogio = setTimeout(function () {
        if (acabou) return;
        acabou = true;
        if (ctrl) ctrl.abort();
        falha(new ErroFonte("tempo", "O servidor demorou demais para responder. Tente de novo."));
      }, 25000);
      fetch(url, { method: "GET", credentials: "omit", referrerPolicy: "no-referrer", redirect: "error", signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) {
          if (r.status === 404) return { __vazio: true };
          if (r.status === 429) throw new ErroFonte("limite", "A FDA limita as consultas sem cadastro (cerca de mil por dia). Tente de novo mais tarde.");
          if (!r.ok) throw new ErroFonte("servidor", "O servidor respondeu com erro " + r.status + ". Tente de novo em instantes.");
          return r.json();
        })
        .then(function (j) {
          if (acabou) return;
          acabou = true;
          clearTimeout(relogio);
          ok(j);
        })
        .catch(function (e) {
          if (acabou) return;
          acabou = true;
          clearTimeout(relogio);
          falha(e instanceof ErroFonte ? e : new ErroFonte("rede", "Sem conexão com a fonte oficial. Confira a internet e tente de novo."));
        });
    });
    memoria[url] = p;
    p.catch(function () { delete memoria[url]; }); // erro não fica guardado
    return p;
  }

  /* ── RxNorm: do nome digitado ao princípio ativo ────────────────── */

  function aproximado(termo) {
    return obter(RXNAV + "approximateTerm.json?maxEntries=8&option=1&term=" + encodeURIComponent(termo)).then(function (j) {
      var c = (j && j.approximateGroup && j.approximateGroup.candidate) || [];
      return c.map(function (x) {
        return { rxcui: String(x.rxcui), score: parseFloat(x.score) || 0, visto: x.name || "", fonte: x.source || "" };
      });
    });
  }

  function propriedades(rxcui) {
    return obter(RXNAV + "rxcui/" + encodeURIComponent(rxcui) + "/properties.json").then(function (j) {
      return (j && j.properties) || null;
    });
  }

  function ingredientesDe(rxcui) {
    return obter(RXNAV + "rxcui/" + encodeURIComponent(rxcui) + "/related.json?tty=IN+MIN").then(function (j) {
      var grupos = (j && j.relatedGroup && j.relatedGroup.conceptGroup) || [];
      var porTipo = {};
      grupos.forEach(function (g) {
        porTipo[g.tty] = (g.conceptProperties || []).map(function (p) { return { rxcui: p.rxcui, nome: p.name, tty: p.tty }; });
      });
      if (porTipo.MIN && porTipo.MIN.length) return porTipo.MIN;
      return porTipo.IN || [];
    });
  }

  /**
   * Nome digitado → lista de princípios ativos possíveis, do mais provável ao menos,
   * cada um com a origem da correspondência para a tela mostrar.
   */
  function resolver(termo) {
    var digitado = String(termo || "").trim();
    if (!digitado) return Promise.resolve({ digitado: digitado, ingredientes: [] });
    var apelido = APELIDOS[chaveNome(digitado)] || null;
    var buscas = apelido ? [apelido, digitado] : [digitado];
    return Promise.all(buscas.map(function (b) { return aproximado(b).catch(function (e) { if (b === digitado) throw e; return []; }); }))
      .then(function (listas) {
        var vistos = {};
        var ordem = [];
        listas.forEach(function (lista, i) {
          lista.forEach(function (c) {
            var bonus = apelido && i === 0 ? 100 : 0; // o apelido conferido vem primeiro
            var atual = vistos[c.rxcui];
            if (!atual) {
              vistos[c.rxcui] = { rxcui: c.rxcui, score: c.score + bonus, scoreReal: c.score, visto: c.visto, fonte: c.fonte, viaApelido: i === 0 && !!apelido };
              ordem.push(vistos[c.rxcui]);
            } else if (c.score + bonus > atual.score) {
              atual.score = c.score + bonus;
              atual.scoreReal = Math.max(atual.scoreReal, c.score);
              if (!atual.visto && c.visto) atual.visto = c.visto;
            }
          });
        });
        ordem.sort(function (a, b) { return b.score - a.score; });
        return Promise.all(
          ordem.slice(0, 6).map(function (c) {
            return propriedades(c.rxcui).then(function (p) {
              if (!p) return [];
              // PIN (sal) fica como está: penicilina G benzatina não pode virar só "penicilina G"
              if (p.tty === "IN" || p.tty === "MIN" || p.tty === "PIN") return [{ rxcui: p.rxcui, nome: p.name, tty: p.tty, de: c }];
              return ingredientesDe(c.rxcui).then(function (lista) {
                return lista.map(function (x) { return { rxcui: x.rxcui, nome: x.nome, tty: x.tty, de: c }; });
              });
            }).catch(function () { return []; });
          })
        );
      })
      .then(function (porCandidato) {
        var unicos = {};
        var lista = [];
        porCandidato.forEach(function (l) {
          l.forEach(function (ing) {
            if (unicos[ing.rxcui]) return;
            unicos[ing.rxcui] = true;
            lista.push({
              rxcui: ing.rxcui,
              nome: ing.nome,
              tty: ing.tty,
              comoAchou: ing.de.visto || "",
              fonteNome: ing.de.fonte || "",
              viaApelido: ing.de.viaApelido,
              apelido: ing.de.viaApelido ? apelido : null,
              fraco: !ing.de.viaApelido && ing.de.scoreReal < 6
            });
          });
        });
        return { digitado: digitado, apelido: apelido, ingredientes: lista };
      });
  }

  /* ── openFDA: do princípio ativo à bula ─────────────────────────── */

  function aspas(v) {
    return '"' + encodeURIComponent(String(v).replace(/"/g, "")) + '"';
  }

  function urlFDA(busca, extra) {
    return FDA + "?search=" + busca + (extra ? "&" + extra : "");
  }

  /** Busca por princípio ativo; "amoxicillin / clavulanate" exige os dois. */
  function buscaIngrediente(nome) {
    return String(nome)
      .split(/\s*\/\s*/)
      .filter(Boolean)
      .map(function (p) { return "(openfda.substance_name:" + aspas(p) + "+OR+openfda.generic_name:" + aspas(p) + ")"; })
      .join("+AND+");
  }

  /** Nomes genéricos (formulações, associações) que existem na FDA para o princípio ativo. */
  function grupos(nomeIngrediente) {
    return obter(urlFDA(buscaIngrediente(nomeIngrediente), "count=openfda.generic_name.exact&limit=60")).then(function (j) {
      var lista = (j && j.results) || [];
      var alvo = String(nomeIngrediente).toUpperCase();
      return lista
        .map(function (r) { return { nome: r.term, total: r.count, exato: String(r.term).toUpperCase() === alvo }; })
        .sort(function (a, b) { return (b.exato ? 1 : 0) - (a.exato ? 1 : 0) || b.total - a.total; });
    });
  }

  /** Só os campos que o app mostra, sempre na mesma ordem: é isso que o resumo de integridade cobre. */
  function enxugar(r) {
    var o = r.openfda || {};
    var rotulo = {
      set_id: r.set_id || "",
      id: r.id || "",
      version: String(r.version || ""),
      effective_time: String(r.effective_time || ""),
      openfda: {},
      secoes: {}
    };
    CAMPOS_OPENFDA.forEach(function (c) {
      if (o[c] != null) rotulo.openfda[c] = o[c];
    });
    SECOES.forEach(function (s) {
      if (r[s.campo] != null) rotulo.secoes[s.campo] = juntar(r[s.campo]);
      if (r[s.campo + "_table"] != null) rotulo.secoes[s.campo + "_table"] = [].concat(r[s.campo + "_table"]).map(String);
    });
    return rotulo;
  }

  /**
   * Bulas de um nome genérico. Primeiro as de referência (NDA/BLA), depois as demais,
   * sempre do fabricante original (sem reembaladoras) e da mais recente para a mais antiga.
   */
  function rotulos(generico, pagina) {
    pagina = pagina || 0;
    var por = 8;
    var base = "openfda.generic_name.exact:" + aspas(generico);
    var original = base + "+AND+openfda.is_original_packager:true";
    var ordem = "sort=effective_time:desc";
    var pedidos = [obter(urlFDA(original, ordem + "&limit=" + por + "&skip=" + pagina * por))];
    if (pagina === 0) {
      pedidos.push(obter(urlFDA(original + "+AND+(openfda.application_number:NDA*+OR+openfda.application_number:BLA*)", ordem + "&limit=3")).catch(function () { return {}; }));
    }
    return Promise.all(pedidos).then(function (rs) {
      var geral = rs[0] || {};
      if (geral.__vazio && pagina === 0) {
        // nenhuma marcada como do fabricante original: aceita todas
        return obter(urlFDA(base, ordem + "&limit=" + por)).then(function (j) {
          return montarLista([], j, por, pagina, true);
        });
      }
      return montarLista(rs[1] ? rs[1].results || [] : [], geral, por, pagina, false);
    });
  }

  function montarLista(referencias, geral, por, pagina, semFiltro) {
    var vistos = {};
    var itens = [];
    referencias.concat((geral && geral.results) || []).forEach(function (r) {
      if (!r || !r.set_id || vistos[r.set_id]) return;
      vistos[r.set_id] = true;
      itens.push(enxugar(r));
    });
    var total = (geral && geral.meta && geral.meta.results && geral.meta.results.total) || itens.length;
    return { itens: itens, total: total, temMais: (pagina + 1) * por < total, semFiltro: semFiltro };
  }

  /** A versão que está valendo hoje para um set_id (para conferir as bulas salvas). */
  function atual(setId) {
    return obter(urlFDA("set_id:" + aspas(setId), "limit=1")).then(function (j) {
      var r = j && j.results && j.results[0];
      return r ? enxugar(r) : null;
    });
  }

  /** Se a bula guardada está atrás da que vale hoje. */
  function maisNova(nova, guardada) {
    if (!nova || !guardada) return false;
    var vn = parseInt(nova.version, 10);
    var vg = parseInt(guardada.version, 10);
    if (nova.id && guardada.id && nova.id === guardada.id) return false;
    if (isFinite(vn) && isFinite(vg) && vn !== vg) return vn > vg;
    return String(nova.effective_time) > String(guardada.effective_time);
  }

  /* ── descrição da bula para a tela ──────────────────────────────── */

  function titulo(rotulo) {
    var o = rotulo.openfda || {};
    var marca = (o.brand_name && o.brand_name[0]) || "";
    var gen = (o.generic_name && o.generic_name[0]) || "";
    return { marca: marca, generico: gen, principal: marca || gen || "Bula sem nome" };
  }

  function linkDailyMed(rotulo) {
    return "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=" + encodeURIComponent(rotulo.set_id);
  }

  function linkAnvisa(nome) {
    return "https://consultas.anvisa.gov.br/#/bulario/q/?nomeProduto=" + encodeURIComponent(String(nome || "").trim());
  }

  /** Seções presentes, na ordem do app, sem repetir subseções já contidas na seção-mãe. */
  function secoesDe(rotulo) {
    var s = rotulo.secoes || {};
    return SECOES.filter(function (d) {
      if (!s[d.campo] && !s[d.campo + "_table"]) return false;
      if (d.dentroDe && s[d.dentroDe]) return false;
      return true;
    }).map(function (d) {
      return { def: d, texto: s[d.campo] || "", tabelas: s[d.campo + "_table"] || [] };
    });
  }

  var Bulas = {
    RXNAV: RXNAV,
    FDA: FDA,
    APELIDOS: APELIDOS,
    SECOES: SECOES,
    chaveNome: chaveNome,
    data: data,
    registro: registro,
    paragrafos: paragrafos,
    trechos: trechos,
    tabelaSegura: tabelaSegura,
    resolver: resolver,
    grupos: grupos,
    rotulos: rotulos,
    atual: atual,
    maisNova: maisNova,
    enxugar: enxugar,
    titulo: titulo,
    secoesDe: secoesDe,
    linkDailyMed: linkDailyMed,
    linkAnvisa: linkAnvisa,
    buscaIngrediente: buscaIngrediente,
    ErroFonte: ErroFonte

  /* ── bulas salvas ───────────────────────────────────────────────── */

  function chave(setId) {
    return "bula_" + String(setId).replace(/[^A-Za-z0-9-]/g, "").slice(0, 70);
  }

  function indice() {
    var l = lerJSON("indice", []);
    return Array.isArray(l) ? l : [];
  }

  function gravarIndice(l) {
    return Armazem.guardar("indice", JSON.stringify(l));
  }

  function estaSalva(setId) {
    return indice().some(function (x) { return x.set_id === setId; });
  }

  /** Lê a cópia guardada e confere o resumo SHA-256. */
  function lerSalva(setId) {
    var bruto = Armazem.ler(chave(setId));
    if (!bruto) return { erro: "sumiu" };
    var reg;
    try {
      reg = JSON.parse(bruto);
    } catch (e) {
      return { erro: "corrompida" };
    }
    if (!reg || !reg.rotulo || typeof reg.hash !== "string") return { erro: "corrompida" };
    if (I.sha256(JSON.stringify(reg.rotulo)) !== reg.hash) return { erro: "alterada" };
    if (reg.rotulo.set_id !== setId) return { erro: "alterada" };
    return reg;
  }

  function salvar(rotulo, silencioso) {
    if (semArmazem && !A) {
      aviso("Este navegador não deixa guardar nada nesta página. Abra o arquivo direto no Chrome ou no Edge.");
      return false;
    }
    var texto = JSON.stringify(rotulo);
    var reg = { formato: 1, hash: I.sha256(texto), salvoEm: new Date().toISOString(), rotulo: rotulo };
    if (!Armazem.guardar(chave(rotulo.set_id), JSON.stringify(reg))) {
      aviso("Não deu para salvar: o espaço do navegador acabou ou está bloqueado.");
      return false;
    }
    var volta = lerSalva(rotulo.set_id);
    if (volta.erro) {
      Armazem.apagar(chave(rotulo.set_id));
      aviso("A cópia gravada não conferiu. Nada foi salvo.");
      return false;
    }
    var t = B.titulo(rotulo);
    var o = rotulo.openfda || {};
    var antes = indice();
    var anterior = antes.filter(function (x) { return x.set_id === rotulo.set_id; })[0];
    var l = antes.filter(function (x) { return x.set_id !== rotulo.set_id; });
    l.unshift({
      busca: (!E.deSalvas && E.busca) || (anterior && anterior.busca) || "", // nome digitado, para o bulário da ANVISA
      set_id: rotulo.set_id,
      principal: t.principal,
      generico: t.generico,
      fabricante: (o.manufacturer_name && o.manufacturer_name[0]) || "",
      version: rotulo.version,
      effective_time: rotulo.effective_time,
      salvoEm: reg.salvoEm,
      conferidoEm: reg.salvoEm,
      hash: reg.hash
    });
    gravarIndice(l);
    if (!silencioso) aviso("Bula salva no aparelho. Abre mesmo sem internet.");
    return true;
  }

  function remover(setId) {
    Armazem.apagar(chave(setId));
    gravarIndice(indice().filter(function (x) { return x.set_id !== setId; }));
  }

  function marcarConferida(setId, nova) {
    var l = indice();
    l.forEach(function (x) {
      if (x.set_id !== setId) return;
      x.conferidoEm = new Date().toISOString();
      x.temNova = nova ? { version: nova.version, effective_time: nova.effective_time } : null;
      x.retirada = nova === false;

    gravarIndice(l);
  }

  function conferirVersao(guardada) {
    var n = E.pedido;
    E.conferencia = { estado: "conferindo" };
    render();
    B.atual(guardada.set_id).then(function (nova) {
      if (E.tela !== "bula" || !E.rotulo || E.rotulo.set_id !== guardada.set_id) return;
      if (!nova) {
        marcarConferida(guardada.set_id, false);
        E.conferencia = { estado: "retirada" };
      } else if (B.maisNova(nova, guardada)) {
        marcarConferida(guardada.set_id, nova);
        E.conferencia = { estado: "nova", nova: nova };
      } else {

        E.conferencia = { estado: "vigente" };
      }
      render();
    }, function (e) {

  function conferirTodas() {
    var l = indice();
    if (!l.length) return;
    E.conferindoTodas = true;
    render();
    var i = 0;
    var problemas = 0;
    var proximo = function () {
      if (i >= l.length) {

        render();

        return;
      }
      var item = l[i++];
      B.atual(item.set_id).then(function (nova) {
        var guardada = { set_id: item.set_id, id: "", version: item.version, effective_time: item.effective_time };
        var reg = lerSalva(item.set_id);
        if (!reg.erro) guardada = reg.rotulo;
        if (!nova) { marcarConferida(item.set_id, false); problemas++; }
        else if (B.maisNova(nova, guardada)) { marcarConferida(item.set_id, nova); problemas++; }
        else marcarConferida(item.set_id, null);
        render();
        proximo();
      }, function (e) {
        E.conferindoTodas = false;
        render();
        aviso(e.message);
      });
    };
    proximo();
  }

  function pintarTexto(texto, consulta) {
    var frag = document.createDocumentFragment();
    B.trechos(texto, consulta).forEach(function (t) {
      if (t.achado) frag.appendChild(h("mark", { classe: "achado", texto: t.t }));
      else if (t.dose) frag.appendChild(h("span", { classe: "dose", texto: t.t }));
      else frag.appendChild(document.createTextNode(t.t));
    });
    return frag;
  }

  /** Pinta os nós de texto de um fragmento já seguro (as tabelas). */
  function pintarNos(no, consulta) {
    var textos = [];
    var andar = document.createTreeWalker(no, 4, null, false);
    var n;
    while ((n = andar.nextNode())) textos.push(n);
    textos.forEach(function (t) {
      if (!t.nodeValue || !t.nodeValue.trim()) return;
      t.parentNode.replaceChild(pintarTexto(t.nodeValue, consulta), t);
    });
  }

  function corpoSecao(s, consulta) {
    var corpo = h("div", { classe: "secao-corpo" });

      B.paragrafos(s.texto).forEach(function (p) {
        var m = /^(\d{1,2}(?:\.\d{1,2}){1,2})\s/.exec(p);
        var el = h("p", { classe: m ? "subsecao" : null });
        el.appendChild(pintarTexto(p, consulta));
        corpo.appendChild(el);
      });
    }
    s.tabelas.forEach(function (html, i) {
      var frag = B.tabelaSegura(html);
      pintarNos(frag, consulta);
      corpo.appendChild(h("div", { classe: "tabela", role: "region", "aria-label": "Tabela " + (i + 1) + " da seção", tabindex: "0" }, frag));
    });
    return corpo;
  }

  function atualizarAchados(rolar) {
    var marcas = document.querySelectorAll("#secoes mark.achado");
    var cont = document.getElementById("achados");
    if (!cont) return;
    if (!E.consulta || E.consulta.trim().length < 2) {
      cont.textContent = "";
      return;
    }
    if (!marcas.length) {
      cont.textContent = "nada";
      return;
    }
    if (E.achado >= marcas.length) E.achado = 0;
    if (E.achado < 0) E.achado = marcas.length - 1;
    for (var i = 0; i < marcas.length; i++) marcas[i].classList.toggle("atual", i === E.achado);
    cont.textContent = E.achado + 1 + " de " + marcas.length;
    if (rolar) {
      var alvo = marcas[E.achado];
      var det = alvo.closest("details");
      if (det && !det.open) det.open = true;
      var y = alvo.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.35;
      window.scrollTo(0, Math.max(0, y));
    }
  }

  /* ── dose para a doença e conferência da prescrição ─────────────── */

  var D = window.Doses;
  var NOME_POP = { adulto: "Adulto", crianca: "Criança", ambos: "Adulto e criança" };

  function trocarDoencaSemDesenhar(v) {
    E.doenca = String(v || "").trim().replace(/\s+/g, " ");
    E.cacheDose = null;
    E.doseMais = false;
  }

  function trocarDoenca(v) {
    trocarDoencaSemDesenhar(v);
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  /** As tabelas da posologia, já limpas e lidas, guardadas para a bula aberta. */
  function tabelasDe(r) {
    var k = r.id || r.set_id;
    if (E.cacheTab[k]) return E.cacheTab[k];
    var lidas = [];
    [].concat(r.secoes.dosage_and_administration_table || []).forEach(function (html) {
      var caixa = document.createElement("div");
      caixa.appendChild(B.tabelaSegura(html));
      var t = caixa.querySelector("table");
      if (t) lidas.push(D.linhasDaTabela(t));
    });
    E.cacheTab = {};
    E.cacheTab[k] = lidas;
    return lidas;
  }

  function doseParaDoenca() {
    var r = E.rotulo;
    var chave = (r.id || r.set_id) + "|" + E.doenca;
    if (E.cacheDose && E.cacheDose.chave === chave) return E.cacheDose.res;
    var res = D.paraDoenca(r, tabelasDe(r), E.doenca);
    E.cacheDose = { chave: chave, res: res };
    return res;
  }

  /** Os trechos que a tela mostra e a conferência usa. */
  function trechosEmUso(res) {
    if (res.alvo.termos.length && !res.trechos.length) {
      return { lista: res.todos.filter(function (u) { return u.valores.length; }), naoAchou: true };
    }
    return { lista: res.trechos, naoAchou: false };
  }

  function cortar(t, n) {
    t = String(t || "");
    return t.length > n ? t.slice(0, n - 1).replace(/\s+\S*$/, "") + "…" : t;
  }

  /** Como o app entendeu um valor da bula, em português: "20 a 45 mg/kg/dia, a cada 8 a 12 h". */
  function descrever(v) {
    var faixa = v.lo === v.hi ? C.num(v.lo) : C.num(v.lo) + " a " + C.num(v.hi);
    var u = v.u + (v.porKg ? "/kg" : v.porM2 ? "/m²" : "");
    var por = v.base === "dia" ? "/dia" : v.base === "h" ? "/h" : v.base === "min" ? "/min" : v.base === "dose" && (v.porKg || v.porM2) ? "/dose" : "";
    var t = (v.max ? "máximo " : "") + faixa + " " + u + por;
    if (v.max && v.maxBase === "dia" && v.base !== "dia") t += " por dia";
    if (v.max && v.maxBase === "?") t += " (a bula não diz se por dose ou por dia)";
    if (v.unica) t += ", dose única";
    else if (v.freq) {
      var ops = v.freq.opcoes && v.freq.opcoes.length ? v.freq.opcoes : [v.freq];
      t += ", a cada " + ops.map(function (o) { return o.lo === o.hi ? C.num(o.lo) : C.num(o.lo) + " a " + C.num(o.hi); }).join(" ou ") + " h";
    }
    return t;
  }

  function selosTrecho(u) {
    var s = [];

    if (u.situacao === "renal") s.push(h("span", { classe: "selo selo-atencao", texto: "Ajuste renal" }));

    if (u.tipo === "linha") s.push(h("span", { texto: "Tabela " + u.tabela + (u.titulo ? " · " + cortar(u.titulo, 70) : "") }));
    else if (u.subsecao) s.push(h("span", { texto: "Subseção " + u.subsecao }));
    if (u.continuacao) s.push(h("span", { texto: "continuação do trecho anterior" }));
    return s;

  function resultadoDose(res) {
    var partes = [];
    var alvo = res.alvo;
    var nomeDoenca = alvo.doencas.length ? alvo.doencas.map(function (d) { return d.pt; }).join(" / ") : "“" + E.doenca + "”";
    if (alvo.termos.length) {
      partes.push(h("p", {
        classe: "procurado",
        texto: (alvo.doencas.length ? nomeDoenca + ", procurada na bula como: " : "Procurado na bula como está escrito: ") +
          alvo.termos.map(function (t) { return t.termo + (t.amplo ? " (categoria ampla)" : ""); }).join(", ") + "."
      }));
      if (res.indicacoes.length) {
        var caixa = h("div", { classe: "indicacao" }, h("p", { classe: "rotulo-c", texto: "Consta nas indicações da bula" }));
        res.indicacoes.slice(0, 2).forEach(function (i) {

        partes.push(caixa);
      } else {
        partes.push(nota(nomeDoenca + " não aparece nas indicações desta bula da FDA. Pode ser uso fora da bula nos EUA, ou a bula chamar a doença por outro nome.", "alerta"));
      }
    }
    var uso = trechosEmUso(res);
    if (uso.naoAchou) {
      partes.push(nota("Não achei " + nomeDoenca + " na posologia desta bula. Abaixo, a posologia geral.", "alerta"));
      partes.push(h("h3", { classe: "form-t", texto: "Posologia geral (texto oficial)" }));
    } else if (!alvo.termos.length) {
      partes.push(h("h3", { classe: "form-t", texto: "Posologia geral (texto oficial)" }));
      partes.push(h("p", { classe: "dica", texto: "Digite a doença acima para ver só o trecho dela." }));
    } else {
      partes.push(h("h3", { classe: "form-t", texto: "Dose na bula (texto oficial)" }));
      if (res.porIndicacao) partes.push(nota("A posologia desta bula não separa por doença: vale a dose geral abaixo."));

  var MAPA_UNIDADE = { mg: ["mg", 1], mcg: ["mg", 0.001], g: ["mg", 1000], UI: ["UI", 1], mEq: ["mEq", 1] };

  /** A prescrição digitada, em unidades da comparação, com os erros por campo. */
  function lerPrescricao() {
    var p = E.prescr;
    var erros = {};
    var faltam = [];
    var dose = C.lerNumero(p.dose);
    if (dose.erro) erros.dose = dose.erro;
    else if (dose.vazio) faltam.push("dose");
    var peso = C.lerNumero(p.peso, { max: 1000 });
    if (peso.erro) erros.peso = peso.erro;
    var intervalo = null;
    if (p.intervalo === "outro") {
      var oi = C.lerNumero(p.outroIntervalo, { max: 720 });
      if (oi.erro) erros.outroIntervalo = oi.erro;
      else if (oi.vazio) faltam.push("intervalo");
      else intervalo = oi.valor;
    } else if (p.intervalo !== "unica") intervalo = +p.intervalo;
    var valor = dose.valor;
    var unidade = p.unidade;
    var conversao = null;
    if (p.unidade === "mL") {
      var cq = C.lerNumero(p.concQtd);
      var cv = C.lerNumero(p.concVol);
      if (cq.erro) erros.concQtd = cq.erro;
      else if (cq.vazio) faltam.push("concentração");
      if (cv.erro) erros.concVol = cv.erro;
      else if (cv.vazio) faltam.push("volume da concentração");
      if (dose.valor && cq.valor && cv.valor) {
        valor = (dose.valor * cq.valor) / cv.valor;
        unidade = p.concUnidade;
        conversao = C.com(dose.valor, "mL") + " × " + C.com(cq.valor, p.concUnidade) + " ÷ " + C.com(cv.valor, "mL") + " = " + C.com(valor, unidade);
      }
    }
    if (Object.keys(erros).length || faltam.length || !valor) return { erros: erros, faltam: faltam };
    var m = MAPA_UNIDADE[unidade];
    var presc = { dose: valor * m[1], u: m[0], intervalo: intervalo, peso: peso.valor || null, paciente: p.paciente, renal: p.renal, hepatica: p.hepatica };
    return { erros: erros, faltam: faltam, presc: presc, conversao: conversao, digitada: { valor: valor, unidade: unidade } };
  }

  function descreverPrescricao(lp) {
    var pr = lp.presc;
    var partes = [];
    var u = pr.u;
    var porDia = pr.intervalo ? (pr.dose * 24) / pr.intervalo : pr.dose;
    var dig = lp.digitada.unidade !== u ? " (" + C.com(lp.digitada.valor, lp.digitada.unidade) + ")" : "";
    partes.push(C.com(pr.dose, u) + dig + " por dose");
    partes.push(pr.intervalo ? "a cada " + C.com(pr.intervalo, "h") : "dose única");
    if (pr.intervalo) partes.push(C.com(porDia, u) + " por dia");
    if (pr.peso) {
      partes.push(C.com(pr.dose / pr.peso, u + "/kg") + " por dose");
      if (pr.intervalo) partes.push(C.com(porDia / pr.peso, u + "/kg") + " por dia");
    }
    return partes.join(" · ");
  }

  var ESTADOS = {
    coincide: ["ok", "Coincide"],
    intervalo: ["atencao", "Dose igual, intervalo diferente"],
    perto: ["atencao", ""],
    diferente: ["neutro", "Diferente"],
    "maximo-passa": ["grave", "Passa do máximo"],
    "maximo-talvez": ["atencao", "Pode passar do máximo"],
    "maximo-ok": ["ok", "Dentro do máximo"],
    "outra-populacao": ["neutro", "Outra população"],

    "nao-comparavel": ["neutro", ""]

  function contextoDe(item) {
    var u = item.trecho;

  function itemConferencia(item) {

  function resultadoConferencia() {
    var caixa = document.createDocumentFragment();
    var lp = lerPrescricao();
    ["dose", "peso", "outroIntervalo", "concQtd", "concVol"].forEach(function (k) {
      var el = document.getElementById("pe-" + k);

    if (!c.itens.length) {

      return caixa;
    }
    var primeiro;
    if (c.resumo === "passa") {
      primeiro = c.passa[0];
      caixa.appendChild(h("div", { classe: "alerta alerta-grave", role: "alert" }, icone("alerta", 18), h("p", { texto: "Passa de um máximo citado na bula: " + descrever(primeiro.r.v) + ". Prescrito: " + C.com(primeiro.r.prescrito.valor, primeiro.r.v.u + (primeiro.r.v.porKg ? "/kg" : "") + "/" + primeiro.r.prescrito.por) + "." })));
    } else if (c.resumo === "coincide") {
      primeiro = c.coincide[0];
      caixa.appendChild(h("div", { classe: "alerta alerta-ok" }, icone("ok", 18), h("p", { texto: "Coincide com a bula: " + descrever(primeiro.r.v) + (c.coincide.length > 1 ? " (e mais " + (c.coincide.length - 1) + ")" : "") + ". Confira se o trecho é da mesma população, gravidade e situação do paciente." })));
    } else if (c.resumo === "intervalo") {
      primeiro = c.intervalo[0];
      caixa.appendChild(h("div", { classe: "alerta alerta-atencao" }, icone("alerta", 18), h("p", { texto: "A dose bate com a bula, mas o intervalo não: a bula diz " + descrever(primeiro.r.v) + "." })));
    } else if (c.resumo === "perto") {
      primeiro = c.perto[0];
      caixa.appendChild(h("div", { classe: "alerta alerta-atencao" }, icone("alerta", 18), h("p", { texto: "Não coincide; o mais perto é " + descrever(primeiro.r.v) + ", " + C.num(Math.abs(primeiro.r.desvio) * 100) + "% " + (primeiro.r.desvio > 0 ? "acima" : "abaixo") + "." })));
    } else if (c.resumo === "diferente") {
      caixa.appendChild(h("div", { classe: "alerta alerta-atencao" }, icone("alerta", 18), h("p", { texto: "Nenhum número deste trecho da bula coincide com a prescrição. Leia o trecho acima antes de seguir." })));
    } else {
      caixa.appendChild(nota("Nenhum número do trecho pôde ser comparado com esta prescrição (veja os motivos abaixo)."));
    }
    if (c.talvez.length) caixa.appendChild(h("div", { classe: "alerta alerta-atencao" }, icone("alerta", 18), h("p", { texto: "A dose do dia passa de " + descrever(c.talvez[0].r.v) + ". Se esse máximo for diário, a prescrição passa dele." })));
    var avisos = [];
    if (c.semPeso && !lp.presc.peso) avisos.push(c.semPeso + (c.semPeso === 1 ? " valor é" : " valores são") + " por kg: informe o peso para comparar.");
    if (c.outraPop) avisos.push(c.outraPop + (c.outraPop === 1 ? " valor é" : " valores são") + " de " + (lp.presc.paciente === "adulto" ? "criança" : "adulto") + " e ficaram de fora.");
    if (c.outraSit) avisos.push(c.outraSit + (c.outraSit === 1 ? " valor é" : " valores são") + " de ajuste renal ou hepático e ficaram de fora. Marque a situação, se for o caso.");
    avisos.forEach(function (a) { caixa.appendChild(h("p", { classe: "dica", texto: a })); });

    var principais = c.passa.concat(c.coincide, c.intervalo, c.talvez, c.perto.slice(0, 3), c.itens.filter(function (i) { return i.r.estado === "maximo-ok"; }));

    }

    return caixa;
  }

  function campoNum(campo, rotulo, sufixo, dica) {
