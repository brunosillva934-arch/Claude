<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Prescrições</title>
<link rel="icon" href="/*ICONE*/">
<style>
/*FONTES*/
/*ESTILO*/
</style>
</head>
<body>
<div id="app">
  <!-- Condutas: a busca fica sempre montada, para voltar ao mesmo ponto -->
  <section class="tela" id="tela-inicio" data-rota="inicio">
    <header class="barra barra-inicio">
      <div class="barra-linha">
        <h1 class="marca"><span class="marca-rx" aria-hidden="true">Rx</span>Prescrições</h1>
        <button class="icone-btn" data-ir="#/sobre" aria-label="Sobre e ajustes"><svg><use href="#i-mais"/></svg></button>
      </div>
      <label class="busca">
        <svg class="busca-lupa" aria-hidden="true"><use href="#i-lupa"/></svg>
        <input id="busca" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="Doença, sintoma, remédio ou CID" aria-label="Buscar">
        <button class="busca-limpar" id="busca-limpar" aria-label="Limpar busca" hidden><svg><use href="#i-x"/></svg></button>
      </label>
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por etiqueta"></div>
    </header>
    <main class="conteudo" id="inicio-corpo"></main>
  </section>

  <section class="tela" id="tela-remedios" data-rota="remedios" hidden>
    <header class="barra">
      <div class="barra-linha"><h1 class="barra-titulo">Remédios</h1></div>
      <label class="busca">
        <svg class="busca-lupa" aria-hidden="true"><use href="#i-lupa"/></svg>
        <input id="busca-rem" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="Filtrar remédios" aria-label="Filtrar remédios">
        <button class="busca-limpar" id="busca-rem-limpar" aria-label="Limpar" hidden><svg><use href="#i-x"/></svg></button>
      </label>
    </header>
    <main class="conteudo" id="remedios-corpo"></main>
  </section>

  <section class="tela" id="tela-tabelas" data-rota="tabelas" hidden>
    <header class="barra">
      <div class="barra-linha"><h1 class="barra-titulo">Tabelas de consulta rápida</h1></div>
      <nav class="saltos" id="tabelas-saltos" aria-label="Ir para a tabela"></nav>
    </header>
    <main class="conteudo" id="tabelas-corpo"></main>
  </section>

  <section class="tela" id="tela-receita" data-rota="receita" hidden>
    <header class="barra">
      <div class="barra-linha"><h1 class="barra-titulo">Minha receita</h1></div>
    </header>
    <main class="conteudo" id="receita-corpo"></main>
  </section>

  <!-- telas de detalhe: redesenhadas a cada visita -->
  <section class="tela" id="tela-detalhe" data-rota="detalhe" hidden>
    <header class="barra barra-detalhe">
      <div class="barra-linha">
        <button class="icone-btn" id="voltar" aria-label="Voltar"><svg><use href="#i-voltar"/></svg></button>
        <h1 class="barra-titulo" id="detalhe-titulo"></h1>
        <div class="barra-acoes" id="detalhe-acoes"></div>
      </div>
      <nav class="saltos" id="detalhe-saltos" aria-label="Ir para a seção" hidden></nav>
    </header>
    <main class="conteudo" id="detalhe-corpo"></main>
  </section>

  <nav class="abas" id="abas" aria-label="Seções do app">
    <a href="#/" data-aba="inicio"><svg><use href="#i-lista"/></svg><span>Condutas</span></a>
    <a href="#/remedios" data-aba="remedios"><svg><use href="#i-pilula"/></svg><span>Remédios</span></a>
    <a href="#/tabelas" data-aba="tabelas"><svg><use href="#i-tabela"/></svg><span>Tabelas</span></a>
    <a href="#/receita" data-aba="receita"><svg><use href="#i-receita"/></svg><span>Receita</span><b class="contador" id="contador" hidden></b></a>
  </nav>
  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-lupa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-voltar" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-mais" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></symbol>
  <symbol id="i-estrela" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-estrela-cheia" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-copiar" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M15.5 8.5V5.5a2 2 0 00-2-2h-7a2 2 0 00-2 2v9a2 2 0 002 2h2" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
  <symbol id="i-somar" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-feito" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-partilhar" viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="6" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="18" cy="18.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1" stroke="currentColor" stroke-width="1.9"/></symbol>
  <symbol id="i-lixo" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.8h4V7M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.5" cy="6.5" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-pilula" viewBox="0 0 24 24"><rect x="2.8" y="8.2" width="18.4" height="7.6" rx="3.8" transform="rotate(-40 12 12)" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M9.6 9.1l5 5.8" stroke="currentColor" stroke-width="1.9"/></symbol>
  <symbol id="i-tabela" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 9.5h17M3.5 14.5h17M10 9.5v10" stroke="currentColor" stroke-width="1.9"/></symbol>
  <symbol id="i-lapis" viewBox="0 0 24 24"><path d="M4.5 19.5l1-4.2L15.8 5a2 2 0 012.8 0l.4.4a2 2 0 010 2.8L8.7 18.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M13.8 7l3.2 3.2" stroke="currentColor" stroke-width="1.9"/></symbol>
  <symbol id="i-cima" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-baixo" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-receita" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
</svg>

<script>/*DADOS*/</script>
<script>

</script>
</body>
</html>
