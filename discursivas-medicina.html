/* ── TXT: texto puro em 78 colunas, prova primeiro e espelho no fim ─── */
const REGUA="=".repeat(78);
function quebra(t,w=78){
  return String(t==null?"":t).split("\n").map(par=>{
    if(par.length<=w) return par;
    const ind=(par.match(/^\s*/)||[""])[0], lim=Math.max(24,w-ind.length), out=[]; let l="";
    for(const pal of par.slice(ind.length).split(/\s+/)){
      if(!l){ l=pal; continue; }
      if((l+" "+pal).length<=lim) l+=" "+pal; else { out.push(ind+l); l=pal; }
    }
    if(l) out.push(ind+l);
    return out.join("\n");
  }).join("\n");
}
function slug(s,max=46){
  return semAcento(s||"questao").replace(/[^a-z0-9 ]/g,"").trim().slice(0,max).replace(/\s+/g,"-")||"questao";
}
function txtProva(q,n){
  const L=[];

  L.push(`QUESTÃO ${n||1} — ${String(q.params.tema||"").toUpperCase()}`,
    `${q.params.nivel} · ${q.params.area} · ${q.params.formato}${COM_PACIENTE(q.params.formato)?" · "+q.params.cenario:""} · dificuldade ${q.params.dificuldade}`,"");
  const ms=q.enunciado.momentos||[];
  for(const m of ms){
    if(ms.length>1)L.push(`[MOMENTO ${m.momento}]`);
    L.push(quebra(m.texto),"");
    for(const i of (q.enunciado.itens||[]).filter(i=>(i.momento||1)===m.momento))
      L.push(quebra(`${i.item}) ${i.comando}`),`   (até ${i.limite_linhas||q.params.limite} linhas)`,"");
  }
  return L.join("\n").replace(/\n{3,}/g,"\n\n");
}
function txtEspelho(q,n){
  const esp=q.nucleo.espelho||{itens:[]};
  const L=[`ESPELHO DA QUESTÃO ${n||1} — ${q.params.tema} · ${fmt(somaMax(esp.itens))} pontos`,`veredito: ${(q.veredito||{}).v||"SEM CARIMBO"}`,""];
  if(q.nucleo.ponte_clinica) L.push(quebra("Ponte clínica: "+q.nucleo.ponte_clinica),"");
  for(const i of esp.itens||[]){
    L.push(`${i.item}) ${i.etapa_raciocinio||""}`);
    if(i.resposta_nota_maxima) L.push(quebra("   "+i.resposta_nota_maxima));
    for(const x of i.quesitos||[])
      L.push(quebra(`   [${fmt(x.pontos)}] ${x.descricao||""}${x.exige_justificativa?" — exige justificativa com dados do caso":""}`));
    const alt=(i.alternativas_aceitas||[]).map(a=>`${a.resposta}${a.condicao?" ("+a.condicao+")":""}`).filter(Boolean);
    if(alt.length) L.push(quebra("   Aceito também: "+alt.join("; ")));
    for(const g of i.erros_graves||[])
      L.push(quebra(`   ERRO GRAVE (${g.tipo||"grave"}): ${g.erro}${g.consequencia_para_o_paciente?" -> "+g.consequencia_para_o_paciente:""} [${g.penalidade||"zera o item"}]`));
    L.push("");
  }
  if(q.nucleo.anti) L.push(quebra("Contra a resposta decorada: "+q.nucleo.anti),"");
  if((q.nucleo.conferir||[]).length) L.push(quebra("Para conferência humana: "+q.nucleo.conferir.join("; ")),"");
  const ref=q.nucleo.referencia||((esp.itens||[])[0]||{}).referencia;
  if(ref) L.push(quebra("Fonte: "+ref),"");

function txtPacote(qs,titulo){

async function baixarArquivo(nome,conteudo,btnId){
  const d=_dl||(_dl=await cap("downloads")), b=btnId&&document.getElementById(btnId), antes=b&&b.textContent;
  const diz=t=>{ if(b){ b.textContent=t; setTimeout(()=>{ if(b.isConnected)b.textContent=antes; },2000); } };
  if(!d){ diz("download indisponível aqui"); return; }
  try{ await d.save({filename:nome,data:conteudo}); diz("baixado"); }
  catch(e){ diz(e&&e.code==="declined"?"download recusado":"não deu para baixar"); }
}
function markdownQuestao(q){
  const esp=q.nucleo.espelho||{itens:[]}, n=q.nucleo, ref=n.referencia||((esp.itens||[])[0]||{}).referencia;
  return `# ${q.params.tema} — ${q.params.formato} (dificuldade ${q.params.dificuldade})

> ${q.params.nivel} · ${q.params.area}${COM_PACIENTE(q.params.formato)?" · "+q.params.cenario:""} · botões no alto: ${(q.params.botoes||[]).join(", ")}
> veredito: ${(q.veredito||{}).v||"SEM CARIMBO"} — ${(q.veredito||{}).por||""}

## Enunciado

${textoEnunciado(q.enunciado)}

## Espelho (${fmt(somaMax(esp.itens))} pontos)

${(esp.itens||[]).map(i=>[`### ${i.item}) ${i.etapa_raciocinio||""}`,i.resposta_nota_maxima||"","",
  (i.quesitos||[]).map(x=>`- **${fmt(x.pontos)}** ${x.descricao}${x.exige_justificativa?" _(exige justificativa)_":""}`).join("\n"),
  (i.alternativas_aceitas||[]).length?`\nAceito também: ${i.alternativas_aceitas.map(a=>`${a.resposta}${a.condicao?` (${a.condicao})`:""}`).join("; ")}`:null,
  (i.erros_graves||[]).length?`\n**Erros graves (zeram o item):** ${i.erros_graves.map(g=>`${g.erro}${g.consequencia_para_o_paciente?` → ${g.consequencia_para_o_paciente}`:""}`).join("; ")}`:null
 ].filter(x=>x!=null).join("\n")).join("\n\n")}

## Ponte clínica

${n.ponte_clinica||""}
${n.anti?`\n**Contra a resposta decorada:** ${n.anti}\n`:""}${(n.conferir||[]).length?`\n**Para conferência humana:** ${n.conferir.join("; ")}\n`:""}${ref?`\nFonte: ${ref}\n`:""}`;
}
