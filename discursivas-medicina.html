<title>Discursivas de Medicina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Layout: coluna única de folha de prova; o enunciado aparece enquanto é escrito; o espelho é um anexo lacrado. */
:root{
  --paper:#f3f4f7; --surface:#ffffff; --surface-2:#eceff5;
  --ink:#14171f; --ink-2:#4b5263; --ink-3:#6b7387;
  --rule:#d4d9e3; --rule-strong:#b3bbcb;
  --accent:#2b4b9b; --accent-soft:#e7ecfa; --accent-ink:#1d3773; --on-accent:#ffffff;
  --ok:#17704a; --ok-soft:#e2f2ea; --warn:#8a6412; --warn-soft:#faf0d9; --bad:#a3301d; --bad-soft:#fae9e5;
  --seal:#7c6425; --seal-soft:#f5eedd;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1117; --surface:#161a22; --surface-2:#1d222c;
  --ink:#e9ecf3; --ink-2:#9ea7b9; --ink-3:#8089a0;
  --rule:#2a3140; --rule-strong:#3b4455;
  --accent:#8ea8ff; --accent-soft:#1a2340; --accent-ink:#b9c8ff; --on-accent:#0e1117;
  --ok:#5cc292; --ok-soft:#13291f; --warn:#d9a845; --warn-soft:#2a2113; --bad:#e58470; --bad-soft:#2d1814;
  --seal:#cfae60; --seal-soft:#272013;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1117; --surface:#161a22; --surface-2:#1d222c;
  --ink:#e9ecf3; --ink-2:#9ea7b9; --ink-3:#8089a0;
  --rule:#2a3140; --rule-strong:#3b4455;
  --accent:#8ea8ff; --accent-soft:#1a2340; --accent-ink:#b9c8ff; --on-accent:#0e1117;
  --ok:#5cc292; --ok-soft:#13291f; --warn:#d9a845; --warn-soft:#2a2113; --bad:#e58470; --bad-soft:#2d1814;
  --seal:#cfae60; --seal-soft:#272013;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:62rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── cabeçalho ───────────────────────────────── */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.top .wrap{padding-block:10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.02em}
.brand em{font-style:italic;color:var(--accent)}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
nav.tabs{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:6px 11px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink)}
nav.tabs button:hover{color:var(--ink)}
.theme-btn{background:none;border:1px solid var(--rule);border-radius:999px;width:28px;height:28px;line-height:1;color:var(--ink-2);font-size:13px}

/* ── blocos ──────────────────────────────────── */
main{padding-block:22px 64px}
section.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:18px;min-width:0}
section.card.fino{padding:12px 18px}
.stack{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
.hint{font-size:13px;color:var(--ink-2)}
.hint.tight{font-size:12.5px}
.sep{flex:1;min-width:1rem}

/* ── parâmetros ──────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
@media (min-width:560px){label.f.largo{grid-column:span 2}}
label.f > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;padding:7px 8px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.6}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.dial{display:flex;gap:4px}
.dial button{flex:1;border:1px solid var(--rule-strong);background:var(--surface);border-radius:3px;padding:6px 0;font-family:var(--mono);font-size:14px}
.dial button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dial.txt button{font-family:var(--body);font-size:13px;font-weight:500}
.dial button.largo{flex:2.6;font-family:var(--body);font-size:12.5px;font-weight:500}
.dial.gr button{font-family:var(--body);font-size:14.5px;font-weight:600;padding:11px 0}

/* ── botões de dificuldade ───────────────────── */
.botoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px}
.btn-sw{text-align:left;background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.btn-sw b{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.btn-sw small{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.btn-sw[data-on="1"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.btn-sw[data-on="1"] b{color:var(--accent-ink)}
.btn-sw[data-on="1"] small{color:var(--ink-2)}
.pin{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;background:var(--seal-soft);color:var(--seal);border-radius:2px;padding:1px 4px;text-transform:uppercase}
.alerta{background:var(--warn-soft);border-left:3px solid var(--warn);color:var(--ink);font-size:13px;padding:8px 10px;border-radius:0 3px 3px 0}
.alerta.bad{background:var(--bad-soft);border-color:var(--bad)}
.alerta.ok{background:var(--ok-soft);border-color:var(--ok)}

/* ── esteira ─────────────────────────────────── */
.esteira{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.et{flex:1 1 0;min-width:118px;border:1px solid var(--rule);border-radius:3px;padding:8px 9px;background:var(--surface-2)}
.et .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em}
.et .t{font-size:12.5px;font-weight:600;margin-top:2px}
.et .s{font-size:11.5px;color:var(--ink-3);margin-top:3px;min-height:1.4em}
.et[data-st="rodando"]{border-color:var(--accent);background:var(--accent-soft)}
.et[data-st="rodando"] .s{color:var(--accent-ink)}
.et[data-st="ok"]{border-color:var(--ok)}
.et[data-st="ok"] .s{color:var(--ok)}
.et[data-st="falhou"]{border-color:var(--bad)}
.et[data-st="falhou"] .s{color:var(--bad)}
@keyframes pulse{50%{opacity:.4}}
.et[data-st="rodando"] .t{animation:pulse 1.4s ease-in-out infinite}
.medidor{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ── ações ───────────────────────────────────── */
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.go{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:3px;padding:9px 18px;font-weight:600;font-size:14px}
.go[disabled]{opacity:.5;cursor:not-allowed}
.ghost{background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;padding:8px 13px;font-size:13.5px;font-weight:500}
.ghost.sm{padding:5px 10px;font-size:12.5px}
.ghost[disabled]{opacity:.45;cursor:not-allowed}
.ghost[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}

/* ── prova ───────────────────────────────────── */
.cab{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cab-t{flex:1;min-width:14rem}
.cab-t h2{font-size:22px;margin-top:4px}
.barra-acoes{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.vivo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-radius:3px;padding:7px 10px}
.vivo .pt{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.vivo .tm{color:var(--ink-3);font-variant-numeric:tabular-nums}
.caret{display:inline-block;width:.45em;height:1em;background:var(--accent);vertical-align:-.12em;margin-left:2px;animation:pulse 1s ease-in-out infinite}
.prova{font-family:var(--display);font-size:16.5px;line-height:1.62;max-width:46rem}
.prova p{margin:0 0 .7em}
.prova p:last-child{margin-bottom:0}
.prova .vit{font-family:var(--mono);font-size:14px;background:var(--surface-2);padding:1px 4px;border-radius:2px;white-space:nowrap}
.prova .vr{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.prova .vr .vit{background:none;padding:0;font-size:inherit}
.momento{border-top:2px solid var(--ink);padding-top:12px;margin-top:4px}
.momento > .mh{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.item{border-top:1px solid var(--rule);padding-top:12px;margin-top:14px}
.item .cmd{display:flex;gap:9px;align-items:baseline}
.item .cmd .letra{font-family:var(--display);font-weight:600;font-size:17px;color:var(--accent);min-width:1.1em}
.item .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:7px 0 5px;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.conta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.conta[data-over="1"]{color:var(--bad);font-weight:500}
.trava{background:var(--surface-2);border:1px dashed var(--rule-strong);border-radius:3px;padding:14px;font-size:13px;color:var(--ink-2);text-align:center}

/* ── lacre do espelho ────────────────────────── */
.lacre{border:1px solid var(--seal);background:var(--seal-soft);border-radius:3px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lacre .sel{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--seal);font-weight:500}
.lacre p{font-size:13px;color:var(--ink-2);flex:1;min-width:14rem}

/* ── espelho / correção ──────────────────────── */
.esp-item{border-top:1px solid var(--rule);padding-top:12px;margin-top:12px}
.esp-item:first-child{border-top:0;margin-top:0;padding-top:0}
.esp-cab{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.esp-cab > b{font-family:var(--display);font-size:17px;color:var(--accent)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule-strong);border-radius:2px;padding:1px 5px;color:var(--ink-2);white-space:nowrap}
.tag.ac{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tag.gv{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
ul.q{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:5px}
ul.q li{display:flex;gap:9px;align-items:baseline;font-size:13.5px;border-bottom:1px dotted var(--rule);padding-bottom:5px}
ul.q li > span:last-child{min-width:0}
ul.q li .pts{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);min-width:3.6em;text-align:right;font-variant-numeric:tabular-nums;flex:none}
ul.q li[data-r="integral"] .pts{color:var(--ok);font-weight:500}
ul.q li[data-r="parcial"] .pts{color:var(--warn);font-weight:500}
ul.q li[data-r="zero"] .pts{color:var(--bad);font-weight:500}
ul.q li .mot{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
ul.q li .vel{color:var(--ink-3);font-style:italic}
.nota{font-family:var(--display);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.nota small{font-family:var(--mono);font-size:13px;color:var(--ink-3);font-weight:400}
.linha-nota{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.barra{flex:1;min-width:10rem;height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--accent)}
.feedback{font-family:var(--display);font-size:16px;line-height:1.65;max-width:46rem}
ol.passos{margin:8px 0 0;padding-left:1.3em;font-family:var(--display);font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:4px;max-width:46rem}
.sel-dark{background:var(--surface-2);border-radius:3px;padding:12px;font-size:13px;white-space:pre-wrap;font-family:var(--mono);line-height:1.5;max-height:16rem;overflow:auto}
ul.lint{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
ul.lint li{padding-left:16px;position:relative}
ul.lint li::before{content:"";position:absolute;left:2px;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--ok)}
ul.lint li[data-n="warn"]::before{background:var(--warn)}
ul.lint li[data-n="bad"]::before{background:var(--bad)}
ul.lint li[data-n="info"]::before{background:var(--rule-strong)}

/* ── validação ───────────────────────────────── */
.rolavel{overflow-x:auto}
table.val{width:100%;border-collapse:collapse;font-size:13.5px}
table.val th,table.val td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.val th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
table.val td.num,table.val th.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.carimbo{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ok);color:var(--ok);border-radius:3px;padding:5px 12px;font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;transform:rotate(-1.2deg)}
.carimbo[data-v="REESCREVER"]{border-color:var(--warn);color:var(--warn)}
.carimbo[data-v="DESCARTAR"]{border-color:var(--bad);color:var(--bad)}
.carimbo[data-v="EXEMPLO"],.carimbo[data-v="SEM CARIMBO"],.carimbo[data-v="ESCREVENDO"]{border-color:var(--rule-strong);color:var(--ink-3);transform:none}
.carimbo[data-v="CONFERINDO"]{border-color:var(--accent);color:var(--accent);transform:none;animation:pulse 1.6s ease-in-out infinite}
.carimbo.mini{transform:none;font-size:10.5px;padding:3px 8px}

/* ── painel ──────────────────────────────────── */
.placar{display:flex;flex-direction:column;gap:7px}
.pl-row{display:grid;grid-template-columns:minmax(7.5rem,1fr) 1fr 3.2rem;gap:10px;align-items:center;font-size:13.5px}
.pl-row .bar{height:9px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.pl-row .bar i{display:block;height:100%}
.pl-row .v{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.tile{border:1px solid var(--rule);border-radius:3px;padding:10px 12px;background:var(--surface-2)}
.tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:var(--display);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .v.txt{font-size:16px;line-height:1.3}
.vazio{border:1px dashed var(--rule-strong);border-radius:3px;padding:20px;text-align:center;color:var(--ink-2);font-size:13.5px}
.lista{display:flex;flex-direction:column;gap:8px}
.reg{border:1px solid var(--rule);border-radius:3px;padding:10px 12px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;background:var(--surface)}
.reg .t{font-weight:600;font-size:14px;flex:1;min-width:12rem}
.reg .t .mot{display:block;font-weight:400;font-size:12px;color:var(--ink-3);margin-top:2px}
.reg .d{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
details{border-top:1px solid var(--rule);padding-top:10px}
details summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
details[open] summary{color:var(--accent)}
details .body{padding-top:10px}
.off{opacity:.55}
/* ── objetiva: alternativas ──────────────────── */
.pergunta{font-family:var(--display);font-size:16.5px;line-height:1.55;font-weight:600;margin-top:14px;max-width:46rem}
.alts{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-width:46rem}
.alt{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;padding:9px 11px;font-family:var(--display);font-size:16px;line-height:1.5;color:var(--ink)}
.alt .l{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent);flex:none}
.alt .tx{flex:1;min-width:0}
.alt .por{display:block;font-family:var(--body);font-size:12.5px;line-height:1.45;color:var(--ink-2);margin-top:4px}
button.alt:not([disabled]):hover{border-color:var(--accent)}
.alt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.alt[data-e="certa"]{border-color:var(--ok);background:var(--ok-soft)}
.alt[data-e="errada"]{border-color:var(--bad);background:var(--bad-soft)}
.alt[disabled]{cursor:default;opacity:1}
/* ── árvore do tema ──────────────────────────── */
.arvore{display:flex;flex-direction:column;margin-top:10px;border-top:1px solid var(--rule)}
.no{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 0 5px calc(var(--prof,0)*18px);border-bottom:1px dotted var(--rule);min-width:0}
.no .tog{flex:none;width:22px;height:24px;border:0;background:none;color:var(--ink-3);padding:0;font-size:12px}
.no .no-t{flex:1;min-width:9rem;text-align:left;background:none;border:1px solid transparent;border-radius:3px;padding:3px 7px;font-size:13.5px;line-height:1.35}
.no .no-t:hover{border-color:var(--rule-strong)}
.no .no-t[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.no[data-sel="h"] .no-t{color:var(--accent-ink)}
.no .conta{min-width:2.6em;text-align:right}
.no .conta[data-z="1"]{color:var(--rule-strong)}
@media (prefers-reduced-motion:reduce){.et .t,.vivo .pt,.caret,.carimbo{animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <span class="brand">Discursivas de <em>Medicina</em></span>
    <span class="kicker" id="modo-kicker">gerar, ver e exportar</span>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <button class="theme-btn" id="theme" title="Alternar tema" aria-label="Alternar tema">◐</button>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="banner"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   1. TABELAS DO MÉTODO — os botões, os limites e a regra de decisão
   ══════════════════════════════════════════════════════════════ */
const BOT_PAC = [
  {n:"Apresentação",          b:"típica, de livro",              a:"atípica: idoso, gestante, criança pequena, imunossuprimido", min:"básico",
   x:"quadro típico, em paciente sem particularidade que mude a apresentação"},
  {n:"Diferencial",           b:"diagnóstico evidente",          a:"fronteira entre diagnósticos de condutas opostas", min:"clínico",
   x:"o diagnóstico é evidente; não construa fronteira entre dois diagnósticos"},
  {n:"Modificador de conduta",b:"nenhum",                        a:"comorbidade, contraindicação, alergia ou interação que muda a conduta padrão", min:"básico",
   x:"nenhuma comorbidade, alergia, contraindicação ou interação que mude a conduta padrão"},
  {n:"Prioridade e tempo",    b:"conduta eletiva",               a:"decisão tempo-dependente em que a ordem importa", min:"internato",
   x:"nada tempo-dependente; a ordem das condutas não é cobrada"},
  {n:"Ruído",                 b:"só dados relevantes",           a:"achado incidental que não explica o quadro", min:"clínico",
   x:"nenhum achado incidental nem dado posto para confundir"},
  {n:"Interpretação",         b:"resultado já interpretado",     a:"dado bruto: gasometria, hemograma, ECG ou laudo descritos", min:"básico",
   x:"os exames vêm com o que mostram, já lidos; o aluno não lê traçado, gasometria nem hemograma crus"},
  {n:"Recurso",               b:"hospital terciário completo",   a:"recurso limitado (UBS, sem tomografia)", min:"internato",
   x:"todos os recursos disponíveis"},
  {n:"Evolução",              b:"retrato estático",              a:"o caso evolui depois da conduta do aluno", min:"internato",
   x:"um momento só; o caso não evolui"},
  {n:"Dimensão humana",       b:"só técnica",                    a:"má notícia, recusa, notificação compulsória, ética", min:"clínico",
   x:"sem dilema ético, má notícia ou recusa"}
];
const BOT_SEM = [
  {n:"Elos causais",   b:"1–2 elos, descrição direta",  a:"4 ou mais elos, do molecular ao sinal clínico", min:"básico",
   x:"nenhum comando pede cadeia com mais de 2 elos"},
  {n:"Comparação",     b:"conceitos distantes",         a:"conceitos vizinhos que o aluno confunde", min:"básico",
   x:"não ponha lado a lado dois modelos, grupos ou conceitos vizinhos para o aluno distinguir"},
  {n:"Previsão",       b:"descrever o que o livro diz", a:"prever o efeito de uma situação nova", min:"básico",
   x:"não peça para prever o que acontece numa situação nova"},
  {n:"Contraintuitivo",b:"fato esperado",               a:"explicar um achado que parece contradizer a regra", min:"básico",
   x:"nenhum achado que contrarie o esperado e nenhum dado posto para confundir"},
  {n:"Integração",     b:"uma disciplina",              a:"cruzar disciplinas", min:"básico",
   x:"fique dentro da disciplina da área pedida"},
  {n:"Interpretação",  b:"resultado já interpretado",   a:"dado bruto: curva, exame, resultado de experimento", min:"básico",
   x:"os resultados vêm em palavras, já lidos; nada de valores, curvas ou lâminas cruas para o aluno interpretar"}
];
const NIVEIS = ["básico","clínico","internato","residência (acesso)","residência (especialidade)"];
const FACUL = ["básico","clínico","internato"];
const RESID = ["residência (acesso)","residência (especialidade)"];
const ehFaculdade = n => FACUL.includes(n);
const ROTULO_NIVEL = {"básico":"básico · 1º–2º","clínico":"clínico · 3º–4º","internato":"internato · 5º–6º",
  "residência (acesso)":"acesso","residência (especialidade)":"especialidade"};
const ORDEM_NIVEL = n => n.startsWith("residência") ? 3 : NIVEIS.indexOf(n);
const ORDEM_MIN   = m => m==="básico"?0 : m==="clínico"?1 : 2;

const AREAS_CLIN = ["clínica médica","cirurgia","pediatria","ginecologia e obstetrícia","preventiva e saúde coletiva"];
const AREAS_BAS  = ["anatomia","fisiologia","bioquímica","farmacologia","patologia","microbiologia","imunologia"];
const FORMATOS   = ["caso clínico","caso evolutivo","mecanismo","comparação","interpretação de dado","previsão","integração"];
const COM_PACIENTE = f => f==="caso clínico" || f==="caso evolutivo";
const CENARIOS   = ["UBS","UPA","pronto-socorro","enfermaria","UTI","ambulatório","centro obstétrico"];
const ETAPAS = ["mecanismo","comparação","previsão","interpretação","síntese","diagnóstico diferencial","investigação","conduta","seguimento","comunicação e ética"];
const poolDe = f => COM_PACIENTE(f)?BOT_PAC:BOT_SEM;
/* questão objetiva: mesma esteira, com alternativas no lugar do espelho */
const ehObj = q => !!(q&&q.params&&q.params.tipo==="objetiva");
const LETRAS = "ABCDE";
const nAlt = p => (p&&Number(p.alternativas)===5)?5:4;
/* nível 0 = aprendizagem: para quem acabou de ver a aula e está fixando */
const rotuloDif = d => Number(d)===0?"aprendizagem":`dificuldade ${d}`;
const tagDif = d => Number(d)===0?"aprendizagem":"d"+d;
/* faculdade sem caso clínico: o método é o mesmo; só não pode haver paciente, história clínica nem prontuário no enunciado */
const diretaOn = p => !!p && ehFaculdade(p.nivel) && p.direta===true && !COM_PACIENTE(p.formato);
const formatosPara = p => FORMATOS.filter(f=>!(ehFaculdade(p.nivel)&&p.direta&&COM_PACIENTE(f)) && !(p.tipo==="objetiva"&&f==="caso evolutivo"));

/* quantos botões no alto, e quais são obrigatórios */
function quantos(d){ return d; }
function obrigatorios(d,formato){
  if(COM_PACIENTE(formato)){
    if(d===3) return [["Diferencial","Modificador de conduta","Interpretação"]];
    if(d===4) return [["Diferencial","Modificador de conduta"]];
    if(d>=5)  return [["Evolução"],["Prioridade e tempo"],["Diferencial","Modificador de conduta"]];
    return [];
  }
  if(d===3||d===4) return [["Elos causais","Comparação"]];
  if(d>=5) return [["Elos causais","Comparação"],["Previsão","Contraintuitivo"]];
  return [];
}
function permitido(bot,nivel){ return ORDEM_MIN(bot.min) <= ORDEM_NIVEL(nivel); }
/* dificuldade 1: um degrau acima da aprendizagem. Sobe o botão mais leve que faz sentido no formato —
   ler um dado bruto num caso típico, ou aplicar o mecanismo a uma situação nova — e não o mais pesado da lista. */
const BOTAO_LEVE={"caso clínico":"Interpretação","caso evolutivo":"Interpretação","mecanismo":"Previsão","comparação":"Comparação",
  "interpretação de dado":"Interpretação","previsão":"Previsão","integração":"Integração"};
/* a rampa: a ordem em que os botões sobem sozinhos, do mais leve ao mais pesado. Cada nível contém o anterior. */
const RAMPA_SEM=["Previsão","Comparação","Interpretação","Elos causais","Integração","Contraintuitivo"];
const RAMPA_PAC=["Interpretação","Modificador de conduta","Diferencial","Ruído","Prioridade e tempo","Evolução","Apresentação","Recurso","Dimensão humana"];
function autoBotoes(d,formato,nivel){
  const pool = poolDe(formato).filter(b=>permitido(b,nivel)), tem=n=>pool.some(p=>p.n===n);
  const alvo = Math.min(quantos(d), pool.length), sel = [];
  if(d>=1){ const leve=tem(BOTAO_LEVE[formato])?BOTAO_LEVE[formato]:tem("Interpretação")?"Interpretação":null; if(leve) sel.push(leve); }
  for(const grupo of obrigatorios(d,formato)){
    if(grupo.some(g=>sel.includes(g))) continue;
    const esc = grupo.find(g=>tem(g));
    if(esc) sel.push(esc);
  }
  for(const n of (COM_PACIENTE(formato)?RAMPA_PAC:RAMPA_SEM)){ if(sel.length>=alvo) break; if(tem(n)&&!sel.includes(n)) sel.push(n); }
  return sel.slice(0,Math.max(alvo,sel.length));
}
function conferirBotoes(sel,d,formato,nivel){
  const avisos=[], alvo=quantos(d);
  const pool=poolDe(formato).filter(b=>permitido(b,nivel));
  if(d===0){ if(sel.length) avisos.push(`Aprendizagem não pede botão no alto, e ${sel.length===1?"há 1":`há ${sel.length}`}. Com botão no alto a questão deixa de ser de fixação.`); }
  else if(d<5 && sel.length!==alvo) avisos.push(`Dificuldade ${d} pede ${alvo} ${alvo===1?"botão":"botões"} no alto; estão ${sel.length}.`);
  if(d===5 && sel.length<5)    avisos.push(`Dificuldade 5 pede 5 ou mais botões no alto; estão ${sel.length}.`);
  for(const grupo of obrigatorios(d,formato)){
    if(!grupo.some(g=>sel.includes(g))) avisos.push(`Falta obrigatório: ${grupo.join(" ou ")}.`);
  }
  for(const s of sel) if(!pool.some(p=>p.n===s)) avisos.push(`${s} não cabe no nível ${nivel}.`);
  return avisos;
}

/* REGRA DE DECISÃO — a primeira linha que se aplicar decide (a página decide, não o modelo) */
const CRITERIOS = {veross:"verossimilhança e precisão",correcao:"correção e atualidade",seguranca:"segurança",
  clareza:"clareza do comando",vazamento:"vazamento",relevancia:"relevância",dificuldade:"dificuldade real",espelho:"espelho justo"};
function decidir({notas,divergencia,preceptor,dificuldade,objetiva}){
  const nf=notas.forte, nm=notas.mediano, nd=notas.decoreba;
  const crit=(preceptor&&preceptor.criterios)||[];
  const de=k=>{ const c=crit.find(c=>c.k===k); return c?c.nota:null; };
  const seg=["veross","correcao","seguranca"].map(de).filter(v=>v!=null);
  const minSeg=seg.length?Math.min(...seg):null;
  const minCrit=crit.length?Math.min(...crit.map(c=>c.nota)):null;
  const gap=(nf!=null&&nm!=null)?nf-nm:null, limGap=dificuldade>=4?3:2, apr=dificuldade<=2;

  if(minSeg!=null && minSeg<=2) return {v:"DESCARTAR",por:"O revisor deu 2 ou menos em verossimilhança, correção ou segurança: há erro clínico ou conceitual.",
    instr:"Há erro clínico ou conceitual: corrija-o na raiz, no caso e no espelho, sem deixar resto."};
  if(objetiva){
    if(nf!=null && nf<8) return {v:"REESCREVER",por:"O candidato forte errou: o gabarito está ambíguo ou errado, ou a pergunta admite outra leitura.",
      instr:`Um ótimo candidato marcou outra alternativa${divergencia?` (${divergencia})`:""}. Deixe uma única melhor resposta: corrija o gabarito, o distrator defensável ou a pergunta.`};
    if(dificuldade>=3 && nd!=null && nd>=8) return {v:"REESCREVER",por:"O decoreba acertou: dá para marcar a correta só de memória.",
      instr:"A resposta decorada acerta a questão: faça o distrator do decoreba ser tentador e a correta depender do raciocínio sobre esta situação."};
    if(minCrit!=null && minCrit<4){
      const pior=crit.filter(c=>c.nota===minCrit).map(c=>c.criterio).join(", ");
      return {v:"REESCREVER",por:`O revisor deu ${minCrit} em ${pior}: defeito pontual, que o conserto resolve sem recomeçar.`,instr:""};
    }
    return {v:"APROVAR",por:nf!=null?"O forte acertou e o revisor não achou defeito que prejudique o uso.":"O revisor não achou erro clínico nem defeito que prejudique o uso."};
  }
  if(nf!=null && nf<8 && divergencia) return {v:"REESCREVER",por:"O candidato forte ficou abaixo de 8 e leu o enunciado de outro jeito: o comando está ambíguo.",
    instr:`O enunciado admite outra leitura («${divergencia}»): reescreva o comando ambíguo.`};
  if(nf!=null && nf<8) return {v:"REESCREVER",por:"O candidato forte ficou abaixo de 8 sem ler errado: o espelho está exigente demais ou errado. O conserto mexe só no espelho.",
    instr:"Um ótimo candidato não chegou a 8. Ajuste só o espelho: quesito que nem ele cumpriria, resposta correta que o espelho não previa, ponto mal distribuído."};
  if(nm!=null && nm>=8 && dificuldade>=3) return {v:"REESCREVER",por:"O candidato mediano chegou a 8 com dificuldade 3 ou mais: fácil demais para o que foi pedido.",maisBotao:true,
    instr:"Um candidato mediano chegou a 8: a questão está fácil demais para a dificuldade pedida."};
  if(!apr && nd!=null && nd>=7) return {v:"REESCREVER",por:"O decoreba chegou a 7: dá para resolver só de memória.",
    instr:"A resposta decorada chegou a 7: reforce o item que exige raciocinar, de modo que recitar a regra não baste."};
  if(!apr && gap!=null && gap<limGap) return {v:"REESCREVER",por:`Discriminação ${gap.toFixed(1).replace(".",",")}, abaixo de ${limGap}: a questão não separa quem sabe de quem não sabe.`,
    instr:"Forte e mediano tiraram notas próximas: aumente o peso do raciocínio no espelho ou acrescente o dado que separa os dois."};
  if(minCrit!=null && minCrit<4){
    const pior=crit.filter(c=>c.nota===minCrit).map(c=>c.criterio).join(", ");
    return {v:"REESCREVER",por:`O revisor deu ${minCrit} em ${pior}: defeito pontual, que o conserto resolve sem recomeçar.`,instr:""};
  }
  return {v:"APROVAR",por:nf!=null?"O forte vai bem, o mediano vai pior e o revisor não achou defeito que prejudique o uso.":"O revisor não achou erro clínico nem defeito que prejudique o uso."};
}

/* ══════════════════════════════════════════════════════════════
   2. O FIO — o formato compacto em que o modelo escreve e a página lê.
   Um objeto JSON por linha, chaves curtas, listas posicionais: custa bem menos
   tokens que um JSON de chaves longas e pode ser lido enquanto ainda chega.
   ══════════════════════════════════════════════════════════════ */
const semAcento=s=>String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const letra=x=>semAcento(x).replace(/[^a-z0-9]/g,"").slice(0,2);
const limpo=s=>{ const t=String(s==null?"":s).trim(); return /^(n[aã]o|nenhum[a]?|nada|false|null|0|-|—|n\/a|vazio)?\.?$/i.test(t)?"":t; };
const par=(x,chaves)=>Array.isArray(x)?x:(x&&typeof x==="object"?chaves.map(k=>x[k]):[x]);

function reparar(s){
  let o="",str=false,esc=false;
  for(const c of s){
    if(str){
      if(esc){esc=false;o+=c;}
      else if(c==="\\"){esc=true;o+=c;}
      else if(c==='"'){str=false;o+=c;}
      else o+= c==="\n"?"\\n":c==="\r"?"":c==="\t"?"\\t":c;
    }else{ if(c==='"')str=true; o+=c; }
  }
  return o.replace(/,\s*([}\]])/g,"$1");
}
/* lê objetos JSON completos de um texto que ainda está chegando; tolera cerca de código, vírgulas e colchetes em volta */
function criarLeitor(){
  let pos=0,ini=-1,prof=0,str=false,esc=false;
  return {
    alimentar(txt){
      const novos=[];
      for(;pos<txt.length;pos++){
        const c=txt[pos];
        if(str){ if(esc)esc=false; else if(c==="\\")esc=true; else if(c==='"')str=false; continue; }
        if(c==='"'){ if(prof>0)str=true; continue; }
        if(c==="{"){ if(prof===0)ini=pos; prof++; }
        else if(c==="}"&&prof>0){
          prof--;
          if(prof===0){
            const s=txt.slice(ini,pos+1); ini=-1;
            try{ novos.push(JSON.parse(s)); }
            catch(e){ try{ novos.push(JSON.parse(reparar(s))); }catch(_){} }
          }
        }
      }
      return novos.filter(o=>o&&typeof o==="object"&&!Array.isArray(o));
    },
    parcial(txt){ return prof>0&&ini>=0?txt.slice(ini):""; }
  };
}
function lerRegistros(txt){ return criarLeitor().alimentar(String(txt||"")); }
/* o valor de um campo de texto que ainda não fechou: é o que deixa o enunciado aparecer enquanto é escrito */
function campoParcial(parc,chave){
  const m=new RegExp('"'+chave+'"\\s*:\\s*"').exec(parc); if(!m)return null;
  let out="";
  for(let i=m.index+m[0].length;i<parc.length;i++){
    const c=parc[i];
    if(c==="\\"){
      const n=parc[i+1]; if(n===undefined)break;
      if(n==="n")out+="\n"; else if(n==="t")out+=" "; else if(n==="r"){}
      else if(n==="u"){ const h=parc.slice(i+2,i+6); if(h.length<4)break; out+=String.fromCharCode(parseInt(h,16)||32); i+=4; }
      else out+=n;
      i++;
    }else if(c==='"')break; else out+=c;
  }
  return out;
}

function esqueleto(p,id){
  return {id,criado:hoje(),params:p,
    nucleo:{formato:p.formato,paciente_oculto:null,cadeia_causal:null,ponte_clinica:"",botoes_aplicados:[],alvos:{},anti:"",conferir:[],referencia:"",
      espelho:{itens:[],pontuacao_total:10}},
    enunciado:{momentos:[],itens:[]},lint:[],validacao:null,
    veredito:{v:"SEM CARIMBO",por:"Ainda não passou por um revisor. A checagem automática da página está logo abaixo."}};
}
/* um registro do fio entra na questão; serve igual para a primeira escrita e para o conserto */
function aplicar(q,r){
  const n=q.nucleo, en=q.enunciado;
  if(!n.alvos)n.alvos={};
  if(r.t==="plano"){
    if(["caso","dx","fisio","oculto","evol"].some(k=>r[k]!=null)){
      const po=n.paciente_oculto||(n.paciente_oculto={resumo:"",diagnosticos:[],fisiopatologia_central:"",o_que_o_aluno_nao_ve:"",evolucao:""});
      if(r.caso!=null)po.resumo=String(r.caso);
      if(r.dx!=null)po.diagnosticos=[].concat(r.dx).map(String).filter(Boolean);
      if(r.fisio!=null)po.fisiopatologia_central=String(r.fisio);
      if(r.oculto!=null)po.o_que_o_aluno_nao_ve=String(r.oculto);
      if(r.evol!=null)po.evolucao=String(r.evol);
    }
    if(Array.isArray(r.cadeia)) n.cadeia_causal=r.cadeia.map((c,i)=>{ const [de,para,pq]=par(c,["de","para","por_que"]); return {elo:i+1,de:String(de||""),para:String(para||""),por_que:String(pq||"")}; });
    if(r.ponte!=null) n.ponte_clinica=String(r.ponte);
    if(r.botoes!=null&&typeof r.botoes==="object") n.botoes_aplicados=(Array.isArray(r.botoes)?r.botoes:Object.entries(r.botoes)).map(b=>{ const [bt,onde]=par(b,["botao","onde_aparece"]); return {botao:String(bt||""),onde_aparece:String(onde||"")}; });
    const alvos=Array.isArray(r.alvos)?r.alvos:(r.alvos&&typeof r.alvos==="object"?Object.entries(r.alvos).map(([l,v])=>[l,...par(v,["etapa","alvo","pts"])]):null);
    if(alvos){
      for(const a of alvos){ const [l,et,al,pt]=par(a,["i","etapa","alvo","pts"]); if(letra(l)) n.alvos[letra(l)]={etapa:String(et||"").toLowerCase(),alvo:String(al||""),pts:Number(pt)||0}; }
      for(const i of en.itens) i.etapa_raciocinio=(n.alvos[i.item]||{}).etapa||i.etapa_raciocinio||"";
      for(const e of n.espelho.itens){ const a=n.alvos[e.item]; if(a){ e.etapa_raciocinio=a.etapa||e.etapa_raciocinio; e.pergunta_alvo=a.alvo||e.pergunta_alvo; } }
    }
    if(r.anti!=null) n.anti=limpo(r.anti);
    if(r.conferir!=null) n.conferir=[].concat(r.conferir).map(limpo).filter(Boolean);
    if(r.ref!=null){ n.referencia=limpo(r.ref); for(const e of n.espelho.itens) e.referencia=n.referencia; }
  }else if(r.t==="mom"){
    const num=Math.max(1,Number(r.n)||1), m=en.momentos.find(x=>x.momento===num);
    if(m){ if(r.txt!=null)m.texto=String(r.txt); } else en.momentos.push({momento:num,texto:String(r.txt||"")});
    en.momentos.sort((a,b)=>a.momento-b.momento);
    const its=Array.isArray(r.itens)?r.itens:(r.itens&&typeof r.itens==="object"?Object.entries(r.itens):null);
    if(its){
      en.itens=en.itens.filter(i=>i.momento!==num);
      for(const it of its){
        const [l,c]=par(it,["i","cmd"]), k=letra(l); if(!k)continue;
        en.itens=en.itens.filter(i=>i.item!==k);
        en.itens.push({item:k,momento:num,comando:String(c||""),limite_linhas:q.params.limite,etapa_raciocinio:(n.alvos[k]||{}).etapa||""});
      }
      en.itens.sort((a,b)=>a.item.localeCompare(b.item));
    }
  }else if(r.t==="alt"){
    const alts=q.alternativas||(q.alternativas=[]), txt=String(r.txt||"").trim(); if(!txt)return;
    const nova={txt,ok:r.ok===true||Number(r.ok)===1||/^(s|t|y|v)/i.test(String(r.ok)),por:String(r.por||"").trim(),grave:limpo(r.grave)};
    const L=String(r.i||"").trim().toUpperCase().slice(0,1), k=L?alts.findIndex(a=>a.l===L):-1;
    if(k>=0){ alts[k]={...nova,l:L}; if(nova.ok) alts.forEach((a,j)=>{ if(j!==k)a.ok=false; }); }   /* conserto: troca a alternativa daquela letra */
    else alts.push({...nova,l:""});
  }else if(r.t==="esp"){
    const l=letra(r.i); if(!l)return;
    const a=n.alvos[l]||{}, velho=n.espelho.itens.find(e=>e.item===l)||{};
    const novo={item:l,etapa_raciocinio:a.etapa||velho.etapa_raciocinio||"",pergunta_alvo:a.alvo||velho.pergunta_alvo||"",
      resposta_nota_maxima:String(r.max||""),
      quesitos:(r.q||[]).map(x=>{ const [d,pt,j]=par(x,["descricao","pontos","exige_justificativa"]);

  const foco=(p.foco||"").trim(), mat=p.fonte==="curso"?String(p.material||"").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim().slice(0,14000):"";
  const L=[`- Nível: ${p.nivel} — ${regraNivel(p)}`,`- Área e tema: ${p.area} · ${p.tema}`];
  const nos=(ctx&&ctx.nos||[]).filter(Boolean);
  if(nos.length) L.push(n>1?`- Assunto de cada questão, nesta ordem. Cada questão fica dentro do seu assunto e não invade os dos outros: ${nos.map((c,i)=>`${i+1}) ${c}`).join("; ")}`
                         :`- Assunto desta questão: ${nos[0]}. A questão fica dentro dele.`);
  if(foco) L.push(`- Recorte pedido (manda sobre qualquer sugestão): ${foco}`);
  L.push(`- Formato: ${p.formato}${pac?`, cenário ${p.cenario}`:""}${dir?" — sem caso clínico nem prontuário":""}`);
  L.push(p.tipo==="objetiva"?`- Objetiva de múltipla escolha: ${nAlt(p)} alternativas, uma única melhor resposta`
    :`- ${p.itens===1?"1 item":`${p.itens} itens`}; cada resposta em até ${p.limite} linhas (1 linha ≈ 12 palavras)`);
  L.push(p.dificuldade===0
    ?`- Nível de aprendizagem: o aluno acabou de ver a aula e está fixando o conteúdo. ${altos.length?"Mesmo assim, estes botões sobem:":"Nenhum botão no alto."}`
    :`- Dificuldade ${p.dificuldade} = ${altos.length?"estes botões no alto, cada um pesando na resposta:":"nenhum botão no alto."}`);
  for(const b of altos) L.push(`  · ${b.n}: ${b.a}`);
  if(baixos.length) L.push(`  No baixo, e assim ficam: ${baixos.map(b=>`${b.n} — ${b.x||b.b}`).join("; ")}.`);
  if(!pac&&p.semPessoas) L.push('- Sem pessoas no enunciado: nada de paciente, indivíduo, idade ou sexo. Apresente os dados como preparação experimental, amostra, curva, traçado ou valores de bancada ("em cardiomiócitos isolados", "a curva abaixo"). A ponte clínica continua obrigatória, mas só no plano.');
  if(mat) L.push(`- MATERIAL DO CURSO — fonte de verdade desta questão, acima de qualquer diretriz. Cubra só o que ele sustenta, no recorte e na ênfase dele. Se ele contrariar a diretriz vigente, siga o material e registre a divergência em "conferir". Em "ref", cite: ${p.referencia||"material do curso"}.\n"""\n${mat}\n"""`);
  else L.push(`- Fonte: ${p.referencia||(p.nivel==="básico"?"o livro-texto de referência da disciplina; em tema clínico, a diretriz brasileira vigente mais aceita":"a diretriz brasileira vigente mais aceita; sem diretriz brasileira, a internacional de referência")}`);
  if(ctx&&ctx.evitar&&ctx.evitar.length) L.push(`- Já cobrado em questões anteriores ${nos.length?"destes assuntos":"deste tema"}: ${ctx.evitar.map(x=>`«${x}»`).join("; ")}. Não repita nenhum desses pontos, nem com outra roupagem: cobre outros pontos ${nos.length?"do mesmo assunto":"do tema, os seguintes em importância"}, com outra situação.`);
  if(!nos.length&&ctx&&ctx.angulos&&ctx.angulos.length) L.push(`- Ângulos sugeridos, um por questão e nesta ordem${foco?", dentro do recorte pedido":""} (adapte ao formato): ${ctx.angulos.slice(0,n).join("; ")}`);
  return L.join("\n");
}

function linhaParams(p){
  return `${p.nivel} · ${p.area} · ${p.tema} · ${p.formato}${COM_PACIENTE(p.formato)?" · "+p.cenario:""}${p.no&&p.no.caminho?` · assunto: ${p.no.caminho}`:""}${diretaOn(p)?" · sem caso clínico nem prontuário":""} · ${rotuloDif(p.dificuldade)} · botões no alto: ${(p.botoes||[]).join(", ")||"nenhum"} · ${p.tipo==="objetiva"?`objetiva de ${nAlt(p)} alternativas`:`até ${p.limite} linhas por resposta`}`;
}
function blocoQuestao(q){
  if(ehObj(q)) return `[PLANO — o aluno não vê]\n${textoNucleo(q)}\n\n[ENUNCIADO E PERGUNTA]\n${textoEnunObj(q)}\n\n[ALTERNATIVAS, com o gabarito e o comentário de cada uma]\n${textoAlternativas(q,true)}`;
  return `[PLANO — o aluno não vê]\n${textoNucleo(q)}\n\n[ENUNCIADO]\n${textoEnunciado(q.enunciado)}\n\n[ESPELHO]\n${textoEspelho(q.nucleo.espelho)}`;
}

const PROMPT_UNICO = `Você é preceptor e membro de banca: cria, valida e corrige questões discursivas de medicina, da faculdade à residência, em português do Brasil.

PRINCÍPIO: só se cobra o que explica ou muda o cuidado de um paciente. A dificuldade vem do raciocínio, nunca de detalhe obscuro. Não invente diretriz, dose nem valor de corte: na dúvida, troque o recorte ou avise.

== 1. PRIMEIRA MENSAGEM ==
Pergunte tudo de uma vez, com o padrão entre parênteses:
1. Nível: básico (1º–2º ano) | clínico (3º–4º) | internato (5º–6º) | residência
2. Grande área e tema
3. Formato: caso clínico | caso evolutivo | mecanismo | comparação | interpretação de dado | previsão | integração (padrão: você escolhe pelo nível)
4. Dificuldade: aprendizagem (acabei de ver a aula e quero fixar) ou de 1 a 5 (padrão: 3)
4b. Tipo: discursiva ou objetiva (padrão: discursiva). Na objetiva: uma única melhor resposta; a pergunta se responde sem olhar as alternativas; alternativas da mesma categoria e de tamanho parecido; cada distrator nasce de um erro de raciocínio; nada de "todas / nenhuma das anteriores" nem pergunta negativa; gabarito comentado alternativa por alternativa, mostrado só depois que eu marcar.
5. Modo: TREINO (eu respondo e você corrige) | BANCO (só questão e espelho) (padrão: TREINO)
6. Referência: diretriz ou material meu (opcional)
Se eu responder só parte, use os padrões e siga. Na faculdade (básico, clínico e internato), o padrão é questão sem caso clínico: nada de paciente, história clínica nem prontuário no enunciado, a menos que eu peça. A dificuldade continua vindo dos botões (elos causais, conceitos vizinhos, previsão, achado contraintuitivo, dado bruto), montados sobre um fenômeno, um experimento, uma curva ou uma comparação. No básico, nunca cobre conduta nem dose; no clínico, conduta só por classe de fármaco e com o porquê. Na residência, quase sempre caso clínico, com dose só quando ela muda a decisão.

== 2. DIFICULDADE = NÚMERO DE BOTÕES NO ALTO (1 a 5) ==
Com paciente: apresentação atípica · diferencial entre diagnósticos de condutas opostas · modificador de conduta · prioridade e tempo · ruído · dado bruto para interpretar · recurso limitado · evolução depois da conduta · dimensão humana.
Sem paciente: 4 ou mais elos causais · conceitos vizinhos · previsão de situação nova · achado contraintuitivo · integração de disciplinas · dado bruto.
No 1, suba o botão mais leve: ler um dado bruto num caso típico, ou aplicar o mecanismo a uma situação nova. A partir de 3, um botão central: diferencial ou modificador de conduta (com paciente); elos causais ou comparação (sem paciente). Os botões que não subiram ficam no baixo e não podem pesar: sem dado bruto, cadeia longa, previsão, comparação de vizinhos ou distrator que o nível não pediu. Nos níveis 1 e 2, cada comando pede pouco, e a explicação correta do livro vale pelo menos metade de cada item.
APRENDIZAGEM = nenhum botão no alto, para fixar a aula: só as ideias centrais do tema, uma por item, em degraus (o que é; como ou por que acontece, em 1 ou 2 elos; uma aplicação direta). O enunciado pode dar o contexto, e eu explico com as minhas palavras. Sem exceção, distrator ou pegadinha; a explicação do livro, bem dada, vale nota máxima, e o teste do decoreba não se aplica.

== 3. COMO ESCREVER (faça tudo antes de mostrar; não mostre as etapas) ==
A. PLANO: paciente oculto coerente, ou cadeia causal completa; a ponte clínica; e o alvo de cada item — uma etapa do raciocínio e os pontos (total 10; raciocinar pesa mais que lembrar).
B. ENUNCIADO, a partir do plano: só o que o médico teria naquele momento; dado cru, nunca rótulo nem diagnóstico; nenhum adjetivo que interprete; valor com unidade e, quando o aluno daquele nível não sabe de cor, valor de referência entre colchetes; cada dado com função. Comando com verbo de tarefa (cite, interprete, justifique, compare, explique, preveja, priorize), número de elementos e limite de linhas; nunca "comente" nem "discorra".
C. ESPELHO, fiel ao enunciado: resposta nota máxima que cabe no limite; 2 a 4 quesitos observáveis e independentes por item; alternativas aceitas, com a condição; erros graves plausíveis, que zeram o item; pelo menos um item em que a resposta decorada perde ponto; fonte com nome e ano, sem página.
D. TESTE interno: responda como residente forte, interno mediano e decoreba, e corrija os três pelo espelho. Refaça, até 2 vezes, se o forte não chega a 8; o mediano chega a 8 com dificuldade 3 ou mais; o decoreba chega a 7; forte menos mediano fica abaixo de 2; ou sobra dúvida clínica.
E. No fim, liste "para conferir": toda dose, valor de corte ou recomendação recente que mereça conferência humana.

== 4. MODO BANCO ==
Mostre enunciado, espelho completo, botões aplicados, ponte clínica e a lista para conferir.

== 5. MODO TREINO ==
a) Mostre só o enunciado (caso evolutivo: um momento por vez). Guarde o espelho; não o mostre antes da minha resposta.
b) CORREÇÃO: pontos por quesito, motivo em uma linha. Certo sem a justificativa exigida vale no máximo metade; a justificativa usa dados deste caso; erro grave zera o item; não premie extensão.

  return ["apresentação e diagnóstico diferencial","interpretação do exame-chave","conduta inicial e prioridade","complicação ou falha da primeira conduta","população especial ou contraindicação","seguimento, alta e prevenção"];

let _sample=null,_db=null,_dl=null,_user=null;
async function cap(n){ try{ return (window.claude&&typeof window.claude.use==="function")?await window.claude.use(n):null; }catch(e){ return null; } }
async function pedirSample(){
  if(_sample)return _sample;
  _sample=await cap("sample"); S.sampleOk=!!_sample; renderBanner(); return _sample;
}
/* fila própria: duas chamadas por vez, e a escrita passa na frente da conferência */
const FILA={ativos:0,espera:[]};
function naFila(fn,prio){ return new Promise((res,rej)=>{ const j={fn,res,rej}; if(prio)FILA.espera.unshift(j); else FILA.espera.push(j); bombear(); }); }
function bombear(){
  while(FILA.ativos<2&&FILA.espera.length){
    const j=FILA.espera.shift(); FILA.ativos++;
    Promise.resolve().then(j.fn).then(j.res,j.rej).finally(()=>{ FILA.ativos--; bombear(); });
  }
}
/* medidor: estimativa pelo tamanho do texto, para você ver o que cada etapa custa */
const TOK=n=>Math.round(n/3.4);
function medir(rotulo,ent,sai,ms,tier,falhou){
  const u=S.uso; u.n++; u.ent+=TOK(ent); u.sai+=TOK(sai);
  u.itens.unshift({rotulo,ent:TOK(ent),sai:TOK(sai),s:Math.round(ms/1000),tier:tier||"",falhou:!!falhou});
  u.itens.length=Math.min(u.itens.length,12);
  pintarMedidor();
}
async function chamar(prompt,{tier,signal,onText,cache,rotulo,prio,aoIniciar}={}){
  const s=await pedirSample();
  if(!s) throw {code:"not_granted",message:"Claude indisponível nesta visualização."};
  const opts={modelTier:tier||"default"};
  if(signal)opts.signal=signal; if(onText)opts.onText=onText; if(cache===false)opts.cache=false;
  let t0=0;
  try{
    const r=await naFila(()=>{ t0=performance.now(); if(aoIniciar){ try{ aoIniciar(); }catch(e){} } return s(prompt,opts); },prio);
    medir(rotulo,prompt.length,(r&&r.text||"").length,performance.now()-t0,r&&r.modelTierApplied);
    return r||{text:"",truncated:false};
  }catch(e){
    if(!(e&&e.code==="cancelled"&&!t0)) medir(rotulo,prompt.length,(e&&e.text||"").length,t0?performance.now()-t0:0,opts.modelTier,true);
    throw e;
  }
}
async function pedirRegistros(prompt,opts){
  const r=await chamar(prompt,opts), regs=lerRegistros(r.text);
  if(!regs.length) throw {code:"gen",message:"a resposta veio sem dados legíveis."};
  return regs;
}
function erroLegivel(e){
  const c=e&&e.code;
  return ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)?"O Claude não está liberado nesta visualização: use o prompt único, na tela Montar."
    :c==="rate_limited"?"Limite de uso ou de chamadas atingido. Espere um pouco antes de tentar de novo."
    :c==="session_expired"?"A sessão expirou: entre de novo no Claude e repita."
    :c==="refused"?"O Claude recusou este pedido. Mude o tema ou o recorte e tente de novo."
    :c==="prompt_too_large"?"O pedido ficou grande demais: encurte o material colado."
    :c==="cancelled"?"Interrompido."
    :c==="gen"?`Não deu certo: ${(e&&e.message)||"a resposta veio incompleta."} Tente de novo.`
    :(c==="invalid_json"||c==="empty_completion")?"A resposta veio vazia ou ilegível. Tente de novo."
    :"Falha de conexão com o Claude. Tente de novo.";
}

async function iniciarDb(){
  _user=await cap("user");
  if(_user&&typeof _user.can==="function"){ try{ if((await _user.can("data.write"))===false) S.podeEscrever=false; }catch(e){} }
  _db=await cap("db");
  if(!_db){ S.dbPronto=true; render(); return; }
  const t=setTimeout(()=>{ if(!S.dbPronto){ S.dbPronto=true; render(); } },10000);
  try{
    const docs=s=>((s&&s.docs)||[]).map(d=>d.data()).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x)));
    const [,ses,qs]=await Promise.all([
      _db.collection("arvores").limit(80).get().then(a=>{ for(const t of docs(a)){ if(!t.id||!Array.isArray(t.nos))continue; const loc=S.arvores[t.id]; if(!loc||(t.atualizado||0)>(loc.atualizado||0))S.arvores[t.id]=t; } guardar("disc-arvores",S.arvores); }).catch(()=>{}),
      _db.collection("sessoes").orderBy("criado","desc").limit(120).get(),
      _db.collection("questoes").orderBy("criado","desc").limit(60).get()
    ]);
    /* os documentos chegam congelados: a página trabalha em cópias */
    S.historico=ordenarHistorico(docs(ses));
    const vindas=docs(qs).filter(q=>q.id&&q.params&&q.nucleo&&q.enunciado);
    S.banco=[...S.banco.filter(q=>!vindas.some(v=>v.id===q.id)),...vindas];
  }catch(e){}
  clearTimeout(t); S.dbPronto=true; render();
}

/* a mesa: a questão aberta e o que você escreveu sobrevivem a um recarregar — questão perdida é chamada desperdiçada */
let _mesaT=0;
function guardarMesa(){
  const qs=S.lote.filter(q=>q&&!q.gerando&&!q.exemplo&&utilizavel(q)).map(limpa);
  const provas={}; for(const q of qs) if(S.provas[q.id]) provas[q.id]=limpa(S.provas[q.id]);
  guardar("disc-mesa",{qs,atual:S.questao&&S.questao.id,provas,responder:S.responder});
}
function agendarMesa(){ clearTimeout(_mesaT); _mesaT=setTimeout(guardarMesa,800); }
function restaurarMesa(){
  const m=ler("disc-mesa",null); if(!m||!Array.isArray(m.qs))return;
  const qs=m.qs.filter(q=>q&&q.id&&q.params&&q.nucleo&&q.nucleo.espelho&&q.enunciado);
  if(!qs.length)return;
  S.lote=qs; S.provas=m.provas||{};
  S.questao=qs.find(q=>q.id===m.atual)||qs[0]; const pr=S.prova=provaDe(S.questao);
  S.responder=!!(m.responder||pr.entregue); S.espelhoAberto=!S.responder||pr.fase>=2||!!pr.pulou;
}

function provaDe(q){ return S.provas[q.id]||(S.provas[q.id]=novaProva(q)); }
