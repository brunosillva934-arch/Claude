/* a escrita. Uma questão = uma chamada. Um lote = duas chamadas em paralelo, cada uma com metade das questões:
   as instruções (e o material colado) viajam duas vezes em vez de uma por questão, e o modelo já planeja casos diferentes entre si. */
async function gerarTudo(){
  if(S.rodando)return;
  const p={...S.params,tema:S.params.tema.trim(),foco:(S.params.foco||"").trim(),botoes:[...S.params.botoes]};
  if(!p.tema){ S.log=["Escreva um tema antes de gerar."]; render(); return; }
  if(p.fonte==="curso"&&!(p.material||"").trim()){ S.log=["Você escolheu o material do curso como fonte, mas não colou nada. Cole o conteúdo ou volte para a diretriz vigente."]; render(); return; }
  const n=S.quantidade, base=Date.now(), guardado=limpa(p);
  const arv=p.fonte!=="curso"?arvoreDe(p):null, alvosNo=alvosDaArvore(arv,n);
  const qs=Array.from({length:n},(_,i)=>{ const no=alvosNo[i];
    const q=esqueleto({...guardado,botoes:[...p.botoes],...(no?{no:{id:no.id,caminho:caminhoDe(arv,no.id)}}:{})},"q"+(base+i)); q.gerando=true; return q; });
  /* blocos de até 3 questões por chamada; a fila roda duas chamadas por vez */
  const nb=n===1?1:Math.max(2,Math.ceil(n/(p.tipo==="objetiva"?5:3))), blocos=Array.from({length:nb},()=>[]);
  qs.forEach((q,i)=>blocos[i%nb].push(q));
  for(const b of blocos) b.forEach((q,i)=>{ q.vez=i?"fila":"espera"; });
  guardarPrefs();
  /* a sessão: o que já estava pronto fica; as novas entram no fim */
  const anteriores=S.lote.filter(q=>!q.gerando&&utilizavel(q)), qAntes=S.questao, pAntes=S.prova, respAntes=S.responder, espAntes=S.espelhoAberto;
  S.rodando=true; S.abort=new AbortController(); S.log=[]; S.remover=null; S.t0=performance.now(); zerarEsteira();
  S.lote=[...anteriores,...qs]; S.questao=qs[0]; S.prova=provaDe(qs[0]); S.responder=false; S.espelhoAberto=true; S.view="prova";
  marca("questao","rodando",n>1?`${n} questões em ${blocos.length} chamadas`:"planejando o caso");
  render();
  const tique=setInterval(pintarVivo,1000), sig=S.abort.signal;
  const evitar=evitarPara(p), ang=n>1?embaralhar(angulosPara(p)):[];
  /* com árvore, cada bloco leva os assuntos das suas questões e o que já foi cobrado neles; sem árvore, o que já foi cobrado no tema */
  const contexto=b=>{
    if(!arv||!alvosNo.length) return {evitar,angulos:n>1?b.map(angulo):[]};
    const ids=[...new Set(b.map(q=>q.params.no&&q.params.no.id).filter(Boolean))];
    return {nos:b.map(q=>q.params.no&&q.params.no.caminho),angulos:[],
      evitar:ids.flatMap(id=>{ const no=noDe(arv,id); return ((no&&no.v)||[]).slice(-4).map(v=>ids.length>1?`${no.t}: ${v}`:v); }).slice(-10)};
  };
  const angulo=q=>{ const k=qs.indexOf(q); return ang[k%ang.length]+(k>=ang.length?" (outra situação e outro ponto do tema)":""); };
  const falhas=(await Promise.all(blocos.map(b=>
    gerarBloco(p,b,contexto(b),sig).then(()=>null,e=>e||{code:"gen"})))).filter(Boolean);
  clearInterval(tique);
  S.rodando=false; S.abort=null;
  for(const q of qs){ q.gerando=false; q.parcial=null; }
  const prontas=qs.filter(utilizavel), parou=falhas.some(e=>e.code==="cancelled");
  S.lote=[...anteriores,...prontas];
  if(!prontas.length){
    /* nada novo ficou pronto: a sessão volta ao que era */
    const volta=qAntes&&(anteriores.includes(qAntes)||qAntes.exemplo||S.banco.some(x=>x.id===qAntes.id));
    S.questao=volta?qAntes:(anteriores[0]||null); S.prova=S.questao?(volta?pAntes:provaDe(S.questao)):null;
    S.responder=volta?respAntes:false; S.espelhoAberto=volta?espAntes:true; S.view="montar";
    S.log.push(parou?"Interrompido antes de a questão ficar pronta.":erroLegivel(falhas[0]||{code:"gen",message:"a resposta veio sem questão."}));
    falharEsteira(parou?"interrompido":"falhou"); render(); return;
  }
  if(prontas.length<n) S.log.push(parou?`Interrompido: ${prontas.length} de ${n} ficaram prontas.`:`${n-prontas.length} de ${n} não vieram. ${erroLegivel(falhas[0]||{code:"gen"})}`);
  for(const q of prontas){ finalizar(q); lembrar(q);
    const no=arv&&q.params.no&&noDe(arv,q.params.no.id);
    if(no){ no.n=(no.n||0)+1; const v=pontosDe(q); if(v)no.v=[...(no.v||[]),v].slice(-6); } }
  if(arv&&prontas.some(q=>q.params.no)) salvarArvore(arv);
  if(!prontas.includes(S.questao)){ S.questao=prontas[0]; S.prova=provaDe(prontas[0]); }
  marca("questao","ok",n>1?`${prontas.length} de ${n} prontas`:ehObj(prontas[0])?`${prontas[0].alternativas.length} alternativas`:`${prontas[0].nucleo.espelho.itens.length} itens · ${fmt(somaMax(prontas[0].nucleo.espelho.itens))} pontos`);
  render(); guardarMesa();
  if(S.velocidade!=="direto"&&!parou) conferirFila(prontas,S.velocidade); else semCarimbo();
}
function tirarDaSessao(q){
  if(S.remover!=="s:"+q.id){ S.remover="s:"+q.id; render(); return; }
  S.remover=null; const k=S.lote.indexOf(q);
  S.lote=S.lote.filter(x=>x!==q); delete S.provas[q.id];
  if(S.questao===q){ const prox=S.lote[Math.min(k,S.lote.length-1)]||null; if(prox){ abrirQuestao(prox); return; } S.questao=null; S.prova=null; }
  render(); guardarMesa();
}
function esvaziarSessao(){
  if(S.remover!=="sessao"){ S.remover="sessao"; render(); return; }
  S.remover=null;
  if(S.questao&&S.lote.includes(S.questao)){ S.questao=null; S.prova=null; }
  for(const q of S.lote) delete S.provas[q.id];
  S.lote=[]; render(); guardarMesa();
}
const prontasDaSessao=()=>S.lote.filter(x=>!x.gerando&&utilizavel(x));
function baixarSessao(btnId){
  const qs=prontasDaSessao(); if(!qs.length)return;
  baixarArquivo(`sessao-${qs.length}q-${hoje()}.txt`,txtPacote(qs,`Sessão · ${qs.length} ${qs.length===1?"questão":"questões"}`),btnId);
}
function encerrar(q){ q.gerando=false; q.parcial=null; finalizar(q); }
async function gerarBloco(p,alvo,ctx,signal){
  /* se o modelo esquecer o "k" num lote, o registro vai para a questão em curso; um plano novo abre a seguinte */
  let kAtual=1;
  const leitor=criarLeitor(), de=k=>alvo[Math.min(alvo.length,Math.max(1,Number(k)||kAtual))-1];
  const consumir=txt=>{
    let novo=false;
    for(const r of leitor.alimentar(txt)){
      if(!["plano","mom","esp","alt"].includes(r.t))continue;
      if(Number(r.k)) kAtual=Math.min(alvo.length,Math.max(1,Number(r.k)));
      else if(r.t==="plano"&&alvo[kAtual-1].temPlano&&kAtual<alvo.length) kAtual++;
      const q=de(r.k), i=alvo.indexOf(q);
      aplicar(q,r); q.vez="escrevendo"; if(r.t==="plano")q.temPlano=true; if(r.t==="mom")q.parcial=null;
      for(let j=0;j<i;j++) if(alvo[j].gerando&&utilizavel(alvo[j])) encerrar(alvo[j]);
      if((r.t==="esp"||r.t==="alt")&&espelhoCompleto(q)) encerrar(q);
      novo=true;
    }
    const parc=leitor.parcial(txt);
    if(/"t"\s*:\s*"mom"/.test(parc)){
      const tx=campoParcial(parc,"txt");
      if(tx){ const km=/"k"\s*:\s*(\d+)/.exec(parc), nm=/"n"\s*:\s*(\d+)/.exec(parc), q=de(km&&km[1]);
        const primeira=!q.parcial; q.parcial={n:nm?Number(nm[1]):1,txt:tx}; q.vez="escrevendo";
        if(!novo&&q===S.questao) pintarParcial(q,primeira); }
    }
    if(novo) aoRegistro(); else pintarVivo();
  };
  try{
    const r=await chamar(pGerar(p,alvo.length,ctx),{tier:motor().escreve,signal,cache:false,prio:true,
      rotulo:alvo.length>1?`escrita de ${alvo.length} questões`:"escrita da questão",onText:({text})=>consumir(text),
      aoIniciar:()=>{ if(alvo[0].vez==="espera"){ alvo[0].vez="pensando"; pintarVivo(); } }});
    consumir(r.text);
    if(r.truncated&&!alvo.every(espelhoCompleto)) throw {code:"gen",message:"a resposta foi cortada pelo limite de tamanho."};
    if(!alvo.every(utilizavel)) throw {code:"gen",message:"a resposta veio incompleta."};
  }catch(e){ if(e&&typeof e.text==="string"){ try{ consumir(e.text); }catch(_){} } throw e; }
  finally{ for(const q of alvo){ q.parcial=null; if(utilizavel(q)) encerrar(q); } }
}
/* chegou um bloco inteiro: redesenha, a não ser que você esteja digitando uma resposta */
function aoRegistro(){
  if(S.view!=="prova")return;
  const a=document.activeElement;
  if(a&&a.tagName==="TEXTAREA"){ pintarVivo(); return; }
  render();
}
const CARET='<span class="caret"></span>';
function pintarParcial(q,primeira){
  const n=document.getElementById("vivo-mom");
  if(!n){ if(primeira)aoRegistro(); return; }
  n.innerHTML=destacarValores(q.parcial.txt)+CARET; pintarVivo();
}
function faseTexto(q){
  const en=q.enunciado, esp=q.nucleo.espelho.itens;
  if(q.vez==="fila") return "na vez: outra questão deste bloco está sendo escrita antes";
  if(q.vez==="espera") return "na fila: duas chamadas rodam por vez";
  if(ehObj(q)&&en.itens.length&&!q.parcial) return `enunciado pronto · escrevendo as alternativas, ${Math.min((q.alternativas||[]).length+1,nAlt(q.params))} de ${nAlt(q.params)}`;
  if(en.itens.length&&!q.parcial){ const tot=Math.max(en.itens.length,Object.keys(q.nucleo.alvos||{}).length); return `enunciado pronto · escrevendo o espelho, item ${Math.min(esp.length+1,tot)} de ${tot}`; }
  if(q.parcial||en.momentos.length) return "escrevendo o enunciado";
  if(q.temPlano) return "plano fechado · começando o enunciado";
  return "planejando o caso: o modelo pensa antes de escrever";
}
function pintarVivo(){
  const host=document.getElementById("vivo"); if(!host)return;
  const q=S.questao;
  if(!q||!q.gerando){ if(host.firstChild){ host.replaceChildren(); host.className=""; } return; }
  if(!host.firstChild){
    host.className="vivo";
    host.append(el("span",{cls:"pt"}),el("span",{id:"vivo-st"}),el("span",{cls:"tm",id:"vivo-tm"}),el("span",{cls:"sep"}),el("button",{cls:"ghost sm",onclick:parar},"Parar"));
  }
  document.getElementById("vivo-st").textContent=faseTexto(q);
  document.getElementById("vivo-tm").textContent=`${Math.round((performance.now()-S.t0)/1000)} s`;
}

async function conferirFila(qs,modo){
  for(const q of qs){ if(S.questao!==q&&!S.lote.includes(q))continue; await conferir(q,{modo}); }
}
const perfilDe=s=>{ const k=semAcento(s); return k.includes("forte")?"forte":k.includes("median")?"mediano":k.includes("decor")?"decoreba":null; };
function preceptorDe(rev){
  const notas=rev.notas||{}, ch=s=>semAcento(s).replace(/[^a-z]/g,"");
  const achados=(rev.achados||[]).map(a=>{ const [c,d,x]=par(a,["criterio","defeito","conserto"]); return {criterio:String(c||""),defeito:String(d||""),conserto:String(x||"")}; }).filter(a=>a.defeito);
  const criterios=[];
  for(const [k,nome] of Object.entries(CRITERIOS)){
    const achou=Object.entries(notas).find(([kk])=>ch(kk).startsWith(k.slice(0,5)));
    const nota=achou?Number(achou[1]):NaN; if(isNaN(nota))continue;
    const meus=achados.filter(a=>ch(a.criterio).startsWith(k.slice(0,5)));
    let n=Math.max(1,Math.min(5,Math.round(nota)));
    if(n<4&&!meus.length&&!["veross","correcao","seguranca"].includes(k)) n=4;
    criterios.push({k,criterio:nome,nota:n,justificativa:meus.map(a=>a.defeito).join(" · ")});
  }
  return {criterios,achados,o_que_mudar:achados.map(a=>a.conserto).filter(Boolean).join(" "),etapa:String(rev.onde||"")};
}
/* conferência em segundo plano: não segura a questão, carimba quando chega */
async function conferir(q,{modo="seguro",trio=null,consertados=null}={}){
  if(!q||q.conferindo||q.gerando||q.exemplo||!utilizavel(q))return;
  q.conferindo=true; const ctl=new AbortController(); q.abortConf=ctl; const sig=ctl.signal;
  zerarEsteira(); marca("questao","ok","pronta"); pintarValidacao();
  try{
    if(modo==="auditoria"){
      if(trio&&trio.length) marca("candidatos","ok","provas reaproveitadas: o enunciado não mudou");
      else{
        marca("candidatos","rodando","respondendo sem ver o espelho");
        const [a,b]=await Promise.all([
          pedirRegistros(pCandidatos(["forte"],q),{tier:motor().escreve,signal:sig,rotulo:"candidato forte"}),
          pedirRegistros(pCandidatos(["mediano","decoreba"],q),{tier:"quick",signal:sig,rotulo:"candidatos mediano e decoreba"})]);
        trio=[...a,...b].map(r=>{ const k=perfilDe(r.perfil); return k&&r.r&&typeof r.r==="object"?{perfil:k,porque:limpo(r.porque),respostas:Object.fromEntries(Object.entries(r.r).map(([i,t])=>[letra(i),String(t||"")]))}:null; }).filter(Boolean);
        if(!trio.some(t=>t.perfil==="forte")||trio.length<2) throw {code:"gen",message:"as provas simuladas vieram incompletas."};
        marca("candidatos","ok",`${trio.length} provas simuladas`);
      }
    }else{ trio=null; marca("candidatos","espera","só na auditoria"); }
    const obj=ehObj(q);
    marca("revisor","rodando",trio?(obj?"revisando com as respostas simuladas":"corrigindo as provas e revisando"):"procurando erro clínico");
    const regs=await pedirRegistros(pRevisor(q,trio,consertados),{tier:"complex",signal:sig,rotulo:trio?"banca: correção e revisão":"revisor"});
    const rev=regs.find(r=>r.t==="rev"||r.notas);
    if(!rev) throw {code:"gen",message:"a revisão veio sem notas."};
    const prec=preceptorDe(rev), notas={forte:null,mediano:null,decoreba:null}, detalhe={}; let diverg="";
    if(obj&&trio){ const gab=gabaritoDe(q);
      for(const c of trio){ const l=(String((c.respostas||{}).a||"").toUpperCase().match(/[A-E]/)||[""])[0];
        notas[c.perfil]=l===gab?10:0; detalhe[c.perfil]={marcou:l||"?",faltou:c.porque||"",grave:"",fora:""};
        if(c.perfil==="forte"&&l!==gab)diverg=`marcou ${l||"?"}${c.porque?`: ${c.porque}`:""}`; } }
    for(const r of (obj?[]:regs)){
      const k=(r.t==="nota"||(r.perfil&&r.itens))?perfilDe(r.perfil):null; if(!k)continue;
      const soma=Object.values(r.itens||{}).reduce((s,v)=>s+(Number(v)||0),0);
      notas[k]=Math.round(Math.max(0,Math.min(10,soma))*100)/100;
      detalhe[k]={faltou:limpo(r.faltou),grave:limpo(r.grave),fora:limpo(r.fora)};
      if(k==="forte")diverg=limpo(r.diverg);
    }
    const ns=prec.criterios.map(c=>c.nota);
    marca("revisor","ok",trio&&obj?["forte","mediano","decoreba"].map(k=>detalhe[k]?detalhe[k].marcou:"—").join(" · ")+" · gabarito "+gabaritoDe(q):trio?`${fmt(notas.forte)} · ${fmt(notas.mediano)} · ${fmt(notas.decoreba)}`:(ns.length?`menor nota ${Math.min(...ns)} de 5`:"sem notas"));
    marca("decisao","rodando","aplicando a regra");
    const d=decidir({notas,divergencia:diverg,preceptor:prec,dificuldade:q.params.dificuldade,objetiva:obj});
    q.veredito=d;
    q.validacao={notas,detalhe,discriminacao:(notas.forte!=null&&notas.mediano!=null)?Math.round((notas.forte-notas.mediano)*100)/100:null,preceptor:prec,trio:trio||null,modo};
    marca("decisao",d.v==="APROVAR"?"ok":"falhou",d.v==="APROVAR"?"aprovada":d.v.toLowerCase());
    if(d.v==="APROVAR") guardarNoBanco(q,true);
    else if(S.banco.some(x=>x.id===q.id)) guardarNoBanco(q,true);
  }catch(e){
    if(!(e&&e.code==="cancelled")){
      q.veredito={v:"SEM CARIMBO",por:"A revisão não se completou. "+erroLegivel(e)+" A questão continua utilizável; só o carimbo não saiu."};
      falharEsteira();
    }
  }finally{ q.conferindo=false; q.abortConf=null; pintarValidacao(); guardarMesa(); }
}

/* o que há para consertar: o que a página achou sozinha, a razão do veredito e os achados do revisor */
function defeitos(q){
  const L=[], v=q.veredito||{}, prec=q.validacao&&q.validacao.preceptor;
  for(const a of q.lint||[]) if(a.conserto) L.push(a.conserto);
  for(const f of q.falhasEspelho||[]) L.push(`[espelho, item ${f.item}] Falha apontada no recurso de um aluno: ${f.texto}`);
  if((v.v==="REESCREVER"||v.v==="DESCARTAR")&&v.instr) L.push(v.instr);
  for(const a of (prec&&prec.achados)||[]) L.push(`${a.criterio?`[${a.criterio}] `:""}${a.defeito}${a.conserto?` → ${a.conserto}`:""}`);
  return L;
}
/* o conserto: uma chamada, e o modelo devolve só os blocos que mudam. O resto da questão — e o que você escreveu — fica de pé. */
async function consertar(){
  const q=S.questao; if(!q||q.gerando||q.conferindo||q.consertando||q.exemplo)return;
  const lista=defeitos(q); if(!lista.length)return;
  if(q.veredito&&q.veredito.maisBotao){
    const livre=poolDe(q.params.formato).filter(b=>permitido(b,q.params.nivel)&&!q.params.botoes.includes(b.n));
    if(livre.length){ q.params={...q.params,botoes:[...q.params.botoes,livre[0].n]}; lista.push(`Suba para o alto o botão «${livre[0].n}»: ${livre[0].a}. Ele precisa pesar na resposta.`); }
  }
  q.consertando=true; S.log=[]; zerarEsteira(); marca("questao","rodando","consertando só o que foi apontado"); pintarValidacao();
  const antes=textoEnunciado(q.enunciado);
  try{
    const regs=await pedirRegistros(pConserto(q,lista),{tier:motor().escreve,rotulo:"conserto",cache:false,prio:true});
    let mudou=0, fim=null;
    for(const r of regs){ if(r.t==="fim"||r.mudei){ fim=r; continue; } if(["plano","mom","esp","alt"].includes(r.t)){ aplicar(q,r); mudou++; } }
    if(!mudou) throw {code:"gen",message:"o conserto não devolveu nenhum bloco."};
    q.reescalado=null; q.falhasEspelho=[]; finalizar(q);
    q.ajuste=limpo(fim&&fim.mudei)||`${mudou} ${mudou===1?"bloco reescrito":"blocos reescritos"}`;
    q.consertos=(q.consertos||0)+1;
    const mesmoEnunciado=textoEnunciado(q.enunciado)===antes, trio=mesmoEnunciado&&q.validacao&&q.validacao.trio||null, modo=(q.validacao&&q.validacao.modo)||S.velocidade;
    q.validacao=null; q.veredito={v:"SEM CARIMBO",por:"Consertada. Ainda não foi conferida de novo."};
    marca("questao","ok","consertada");
    q.consertando=false; render(); guardarMesa();
    if(modo!=="direto") conferir(q,{modo,trio,consertados:lista});
  }catch(e){
    S.log.push(erroLegivel(e)); falharEsteira();
  }finally{ if(q.consertando){ q.consertando=false; render(); } }
}

/* ══════════════════════════════════════════════════════════════
   8. CORREÇÃO E DEVOLUTIVA DO ALUNO — duas chamadas no ciclo inteiro
   ══════════════════════════════════════════════════════════════ */
function itemCorrigido(q,r){
  const l=letra(r.i), esp=q.nucleo.espelho.itens.find(e=>e.item===l); if(!esp)return null;
  const grave=limpo(r.grave), fora=limpo(r.fora);
  const quesitos=(esp.quesitos||[]).map((x,k)=>{
    const [bruto,motivo]=par((r.q||[])[k],["p","m"]), max=Number(x.pontos)||0;
    const o=grave?0:Math.max(0,Math.min(max,Math.round((Number(bruto)||0)*4)/4));
    return {descricao:x.descricao,pontos_obtidos:o,pontos_max:max,resultado:o>=max&&max>0?"integral":o>0?"parcial":"zero",motivo:limpo(motivo)};
  });
  return {item:l,etapa_raciocinio:esp.etapa_raciocinio||"",quesitos,erros_graves_cometidos:grave?[grave]:[],
    fora_do_espelho:!!fora,fora_do_espelho_motivo:fora,dado_do_caso_ignorado:limpo(r.dica)};
}
const pontosDoItem=i=>({o:i.quesitos.reduce((s,x)=>s+x.pontos_obtidos,0),m:i.quesitos.reduce((s,x)=>s+x.pontos_max,0)});
async function entregar(){
  const q=S.questao, pr=S.prova; if(!q||!pr||pr.entregando||q.gerando)return;
  const respostas=q.enunciado.itens.map(i=>({item:i.item,texto:(pr.respostas[i.item]||"").trim()}));
  if(!respostas.some(r=>r.texto)){ pr.falha="Escreva ao menos um item antes de entregar."; render(); return; }
  pr.entregando=true; pr.falha=""; render();
  const leitor=criarLeitor(), cor={itens:[],paciente:"",fraco:"",interpretacao_divergente:"",nota_total:null};
  const consumir=txt=>{
    let novo=false;
    for(const r of leitor.alimentar(txt)){
      if(r.t==="fim"||r.paciente!=null){ cor.paciente=limpo(r.paciente); cor.fraco=letra(r.fraco); cor.interpretacao_divergente=limpo(r.diverg); novo=true; }
      else if(r.t==="cor"||Array.isArray(r.q)){ const it=itemCorrigido(q,r); if(it&&!cor.itens.some(x=>x.item===it.item)){ cor.itens.push(it); novo=true; } }
    }
    if(novo){ cor.nota_total=notaDaCorrecao(cor); pr.correcao=cor; render(); }
  };
  try{
    const r=await chamar(pCorrigir(q,respostas),{tier:motor().corrige,rotulo:"correção e devolutiva",onText:({text})=>consumir(text)});
    consumir(r.text);
    if(!cor.itens.length) throw {code:"gen",message:"a correção veio vazia."};
    /* item que o corretor pulou conta como não corrigido: entra zerado, com aviso */
    for(const e of q.nucleo.espelho.itens) if(!cor.itens.some(i=>i.item===e.item))
      cor.itens.push({...itemCorrigido(q,{i:e.item,q:[]}),dado_do_caso_ignorado:"O corretor não devolveu este item; confira pelo espelho."});
    cor.itens.sort((a,b)=>a.item.localeCompare(b.item));
    cor.nota_total=notaDaCorrecao(cor); pr.correcao=cor; pr.entregue=true;
    const perdas=cor.itens.map(i=>({i:i.item,...pontosDoItem(i)})).filter(x=>x.m-x.o>0.001);
    if(!perdas.length){ pr.fase=2; pr.reescrita=null; S.espelhoAberto=true; }
    else{
      const fraco=perdas.some(x=>x.i===cor.fraco)?cor.fraco:perdas.sort((a,b)=>(b.m-b.o)-(a.m-a.o))[0].i;
      pr.fase=1; pr.reescrita={item:fraco,texto:"",correcao:null};
    }
    registrar();
  }catch(e){
    pr.correcao=pr.entregue?pr.correcao:null;
    pr.falha=["not_granted","sampling_disabled"].includes(e&&e.code)?"O Claude não está liberado nesta visualização. Abra o espelho abaixo e corrija você mesmo, quesito a quesito.":erroLegivel(e);
  }finally{ pr.entregando=false; render(); guardarMesa(); }
}
/* se o item da reescrita ficou com nota cheia depois de um recurso, o desafio muda de alvo ou deixa de existir */
function reverReescrita(pr){
  if(pr.fase!==1||!pr.reescrita||pr.reescrita.correcao)return;
  const perdas=pr.correcao.itens.map(i=>({i:i.item,...pontosDoItem(i)})).filter(x=>x.m-x.o>0.001);
  if(!perdas.length){ pr.fase=2; pr.reescrita=null; S.espelhoAberto=true; return; }
  if(!perdas.some(x=>x.i===pr.reescrita.item)) pr.reescrita={item:perdas.sort((a,b)=>(b.m-b.o)-(a.m-a.o))[0].i,texto:"",correcao:null};
}
/* recurso: um por item; a nota pode subir, nunca descer */
async function enviarRecurso(l){
  const q=S.questao, pr=S.prova; if(!q||!pr||!pr.correcao||pr.recursoEnviando)return;
  const k=pr.correcao.itens.findIndex(x=>x.item===l), velho=pr.correcao.itens[k]; if(!velho||velho.recurso)return;
  const arg=((pr.recursoTexto||{})[l]||"").trim();
  if(arg.length<15){ pr.falhaRecurso="Escreva o seu argumento: onde a sua resposta cumpre o quesito, ou por que ela também está certa."; render(); return; }
  pr.recursoEnviando=l; pr.falhaRecurso=""; render();
  try{
    const regs=await pedirRegistros(pRecurso(q,pr,velho,arg),{tier:motor().corrige,rotulo:"recurso do item "+l});
    const rc=regs.find(r=>r.t==="cor"||Array.isArray(r.q)), rec=regs.find(r=>r.t==="rec"||r.porque!=null)||{};
    const novo=rc&&itemCorrigido(q,{...rc,i:l});
    if(!novo) throw {code:"gen",message:"o recurso voltou sem a nova correção."};
    const tinhaGrave=(velho.erros_graves_cometidos||[]).length>0, mantemGrave=tinhaGrave&&(novo.erros_graves_cometidos||[]).length>0;
    const quesitos=velho.quesitos.map((x,j)=>{
      const n=novo.quesitos[j]; if(mantemGrave||!n)return x;
      const sobe=tinhaGrave||n.pontos_obtidos>x.pontos_obtidos, o=sobe?n.pontos_obtidos:x.pontos_obtidos;
      return {...x,pontos_obtidos:o,resultado:o>=x.pontos_max&&x.pontos_max>0?"integral":o>0?"parcial":"zero",motivo:sobe?n.motivo:x.motivo};
    });
    const antes=pontosDoItem(velho).o, falha=limpo(rec.espelho);
    const item={...velho,quesitos,erros_graves_cometidos:mantemGrave?velho.erros_graves_cometidos:[],
      fora_do_espelho:velho.fora_do_espelho||novo.fora_do_espelho,fora_do_espelho_motivo:velho.fora_do_espelho_motivo||novo.fora_do_espelho_motivo};
    const depois=pontosDoItem(item);
    if(depois.m-depois.o<=0.001) item.dado_do_caso_ignorado="";
    item.recurso={argumento:arg,antes,depois:depois.o,porque:limpo(rec.porque),espelho:falha};
    pr.correcao.itens[k]=item; pr.correcao.nota_total=notaDaCorrecao(pr.correcao);
    if(falha){
      q.falhasEspelho=[...(q.falhasEspelho||[]).filter(f=>f.item!==l),{item:l,texto:falha}];
      if(S.banco.some(x=>x.id===q.id)) guardarNoBanco(q,true);
    }
    reverReescrita(pr); pr.recursoAberto=null; registrar();
  }catch(e){ pr.falhaRecurso=erroLegivel(e); }
  finally{ pr.recursoEnviando=null; render(); guardarMesa(); }
}
async function entregarReescrita(){
  const q=S.questao, pr=S.prova; if(!q||!pr||!pr.reescrita||pr.entregando)return;
  if(!(pr.reescrita.texto||"").trim()){ pr.falha="Escreva a reescrita antes de entregar."; render(); return; }
  pr.entregando=true; pr.falha=""; render();
  try{
    const regs=await pedirRegistros(pReescrita(q,pr),{tier:motor().corrige,rotulo:"reescrita e fecho"});
    const rc=regs.find(r=>r.t==="cor"||Array.isArray(r.q)), fim=regs.find(r=>r.t==="fim"||r.passos||r.licao)||{};
    const it=rc&&itemCorrigido(q,{...rc,i:pr.reescrita.item});
    if(!it) throw {code:"gen",message:"a correção da reescrita veio vazia."};
    pr.reescrita.correcao={itens:[it]};
    pr.fb2={melhora:limpo(fim.melhora),passos:[].concat(fim.passos||[]).map(limpo).filter(Boolean),licao:limpo(fim.licao)};
    pr.fase=2; S.espelhoAberto=true; registrar();
  }catch(e){ pr.falha=erroLegivel(e); }
  finally{ pr.entregando=false; render(); guardarMesa(); }
}
function registrar(){
  const q=S.questao, pr=S.prova; if(!q||!pr)return;
  if(ehObj(q)){
    const o=pr.obj; if(!o||!o.fim)return;
    const etapa=(((q.nucleo.alvos||{}).a||{}).etapa||"—").toLowerCase();
    const graves=o.tentativas.map(l=>altDe(q,l)).filter(a=>a&&!a.ok&&a.grave).map(a=>`${a.txt}: ${a.grave}`);
    const reg={id:pr.questaoId+"-"+(pr.registroId||(pr.registroId=Date.now())),criado:pr.criado||(pr.criado=hoje()),ts:pr.registroId,tipo:"objetiva",
      questaoId:q.id,tema:q.params.tema,area:q.params.area,nivel:q.params.nivel,formato:q.params.formato,dificuldade:q.params.dificuldade,
      nota:o.nota,etapas:{[etapa]:{o:o.nota,m:10}},graves,reescrita_nota:null,repescagem:graves.length?[dias(pr.criado,3),dias(pr.criado,10)]:[]};
    S.historico=ordenarHistorico([reg,...S.historico.filter(h=>h.id!==reg.id)]);
    salvar("sessoes",reg.id,reg); return;
  }
  if(!pr.correcao)return;
  const etapas={}, graves=[];
  for(const i of pr.correcao.itens||[]){
    const etapa=(i.etapa_raciocinio||"—").toLowerCase(), {o,m}=pontosDoItem(i);
    if(m){ etapas[etapa]=etapas[etapa]||{o:0,m:0}; etapas[etapa].o+=o; etapas[etapa].m+=m; }
    for(const g of i.erros_graves_cometidos||[]) graves.push(String(g));
  }
  const rw=pr.reescrita&&pr.reescrita.correcao&&pr.reescrita.correcao.itens[0];
  const reg={id:pr.questaoId+"-"+(pr.registroId||(pr.registroId=Date.now())),criado:pr.criado||(pr.criado=hoje()),ts:pr.registroId,
    questaoId:q.id,tema:q.params.tema,area:q.params.area,nivel:q.params.nivel,formato:q.params.formato,
    dificuldade:q.params.dificuldade,nota:notaDaCorrecao(pr.correcao),etapas,graves,
    reescrita_nota:rw?(()=>{ const {o,m}=pontosDoItem(rw); return m?Math.round(o/m*1000)/100:null; })():null,
    repescagem:graves.length?[dias(pr.criado,3),dias(pr.criado,10)]:[]};
  S.historico=ordenarHistorico([reg,...S.historico.filter(h=>h.id!==reg.id)]);
  salvar("sessoes",reg.id,reg);
}

/* ══════════════════════════════════════════════════════════════
   9. PAINEL — placar por etapa, escada e repescagem
   ══════════════════════════════════════════════════════════════ */
function painel(){
  const H=S.historico, porEtapa={}, porArea={};
  for(const h of H){
    for(const [e,v] of Object.entries(h.etapas||{})){ porEtapa[e]=porEtapa[e]||{o:0,m:0}; porEtapa[e].o+=v.o; porEtapa[e].m+=v.m; }
    if(h.area){ porArea[h.area]=porArea[h.area]||{s:0,n:0}; porArea[h.area].s+=Number(h.nota)||0; porArea[h.area].n++; }
  }
  const etapas=Object.entries(porEtapa).map(([k,v])=>({k,pc:v.m?v.o/v.m*100:0})).sort((a,b)=>a.pc-b.pc);
  const areas=Object.entries(porArea).map(([k,v])=>({k,med:v.s/v.n,n:v.n})).sort((a,b)=>a.med-b.med);
  /* a repescagem fecha quando o mesmo tema volta, depois da data, sem erro grave */
  const graves=[], d0=hoje();
  for(const h of H) for(const g of h.graves||[]) for(const d of h.repescagem||[]){
    const cumprida=H.some(x=>x.id!==h.id&&x.tema===h.tema&&(x.criado||"")>=d&&!(x.graves||[]).length);
    if(!cumprida) graves.push({erro:g,quando:d,tema:h.tema,area:h.area,nivel:h.nivel,formato:h.formato,dificuldade:h.dificuldade,vencida:d<=d0});
  }
  graves.sort((a,b)=>a.quando.localeCompare(b.quando));
  const temaNivel={}; let escada=null;
  for(const h of H){ const k=`${h.tema}|${h.nivel}`; (temaNivel[k]=temaNivel[k]||[]).push(h); }
  for(const arr of Object.values(temaNivel)){
    const u=arr.slice(0,2); if(u.length<2)continue;
    if(u.every(x=>Number(x.nota)>=8)) escada={dir:"sobe",tema:u[0].tema,nivel:u[0].nivel,de:u[0].dificuldade};
    else if(u.every(x=>Number(x.nota)<5)) escada={dir:"desce",tema:u[0].tema,nivel:u[0].nivel,de:u[0].dificuldade};
  }
  const media=H.length?H.reduce((a,h)=>a+(Number(h.nota)||0),0)/H.length:null;
  return {etapas,areas,graves,escada,media,n:H.length,piorEtapa:etapas[0]||null,piorArea:areas[0]||null};
}
function aplicarSugestao(){
  const P=painel(), p=S.params;
  if(P.piorArea&&AREAS_CLIN.concat(AREAS_BAS).includes(P.piorArea.k)){
    p.area=P.piorArea.k;
    if(AREAS_BAS.includes(p.area)&&p.nivel!=="básico") p.nivel="básico";
    if(AREAS_CLIN.includes(p.area)&&p.nivel==="básico") p.nivel="clínico";
  }
  const daArea=S.historico.filter(h=>h.area===p.area);
  if(daArea.length){
    const t={}; for(const h of daArea){ t[h.tema]=t[h.tema]||{s:0,n:0}; t[h.tema].s+=Number(h.nota)||0; t[h.tema].n++; }
    const pior=Object.entries(t).map(([k,v])=>({k,m:v.s/v.n})).sort((a,b)=>a.m-b.m)[0];
    if(pior)p.tema=pior.k;
  }
  if(P.escada) p.dificuldade=Math.min(5,Math.max(0,(Number(P.escada.de)||0)+(P.escada.dir==="sobe"?1:-1)));
  p.botoes=autoBotoes(p.dificuldade,p.formato,p.nivel);
  const e=P.piorEtapa&&P.piorEtapa.k;
  p.foco=e?`a etapa em que mais perco ponto: ${e}`:"";
  if(e&&COM_PACIENTE(p.formato)){
    const alvo=e.includes("conduta")?"Modificador de conduta":e.includes("diagnóstico")?"Diferencial":e.includes("interpret")?"Interpretação":e.includes("seguimento")?"Evolução":e.includes("comunica")?"Dimensão humana":null;
    const b=alvo&&BOT_PAC.find(x=>x.n===alvo);
    if(p.dificuldade>0&&b&&!p.botoes.includes(alvo)&&permitido(b,p.nivel)) p.botoes=[alvo,...p.botoes].slice(0,Math.max(quantos(p.dificuldade),1));
  }
  S.view="montar"; render();
}
function montarRepescagem(g){
  const p=S.params;
  if(NIVEIS.includes(g.nivel))p.nivel=g.nivel;
  if(AREAS_CLIN.concat(AREAS_BAS).includes(g.area))p.area=g.area;
  if(FORMATOS.includes(g.formato))p.formato=g.formato;
  p.tema=g.tema; if(g.dificuldade!=null)p.dificuldade=g.dificuldade;
  p.foco=`repescagem: ${COM_PACIENTE(p.formato)?"outro paciente":"outra situação"} em que esteja em jogo a mesma decisão deste erro grave que cometi — «${g.erro}»`;
  p.botoes=autoBotoes(p.dificuldade,p.formato,p.nivel);
  S.quantidade=1; S.view="montar"; render();
}

/* ── TXT: texto puro em 78 colunas, prova primeiro e espelho no fim ─── */
const REGUA="=".repeat(78);
function quebra(t,w=78){
  return String(t==null?"":t).split("\n").map(par=>{
    if(par.length<=w) return par;
    const ind=(par.match(/^\s*/)||[""])[0], lim=Math.max(24,w-ind.length), out=[]; let l="";
    for(const pal of par.slice(ind.length).split(/\s+/)){
      if(!l){ l=pal; continue; }
      if((l+" "+pal).length<=lim) l+=" "+pal; else { out.push(ind+l); l=pal; }
    }
    if(l) out.push(ind+l);
    return out.join("\n");
  }).join("\n");
}
function slug(s,max=46){
  return semAcento(s||"questao").replace(/[^a-z0-9 ]/g,"").trim().slice(0,max).replace(/\s+/g,"-")||"questao";
}
function txtProva(q,n){
  const L=[];
  if(q.exemplo) L.push("[EXEMPLO QUE ACOMPANHA A PÁGINA — não foi gerado pelos seus parâmetros]","");
  L.push(`QUESTÃO ${n||1} — ${String(q.params.tema||"").toUpperCase()}`,
    `${q.params.nivel} · ${q.params.area} · ${q.params.formato}${COM_PACIENTE(q.params.formato)?" · "+q.params.cenario:""} · ${rotuloDif(q.params.dificuldade)}`);
  if(q.params.no&&q.params.no.caminho) L.push(quebra("assunto: "+q.params.no.caminho));
  L.push("");
  const ms=q.enunciado.momentos||[];
  for(const m of ms){
    if(ms.length>1)L.push(`[MOMENTO ${m.momento}]`);
    L.push(quebra(m.texto),"");
    if(ehObj(q)) continue;
    for(const i of (q.enunciado.itens||[]).filter(i=>(i.momento||1)===m.momento))
      L.push(quebra(`${i.item}) ${i.comando}`),`   (até ${i.limite_linhas||q.params.limite} linhas)`,"");
  }
  if(ehObj(q)){
    L.push(quebra(((q.enunciado.itens||[])[0]||{}).comando||""),"");
    for(const a of q.alternativas||[]) L.push(quebra(`${a.l}) ${a.txt}`));
    L.push("");
  }
  return L.join("\n").replace(/\n{3,}/g,"\n\n");
}

    L.push("");
  }
  if(q.nucleo.anti) L.push(quebra("Contra a resposta decorada: "+q.nucleo.anti),"");
  if((q.nucleo.conferir||[]).length) L.push(quebra("Para conferência humana: "+q.nucleo.conferir.join("; ")),"");
  const ref=q.nucleo.referencia||((esp.itens||[])[0]||{}).referencia;
